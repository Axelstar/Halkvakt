# Halkvakt iOS — XcodeGen-definition. `xcodegen` här ⇒ Halkvakt.xcodeproj.
# Se ios/MAC-GUIDE.md för Davids exakta steg.
name: Halkvakt
options:
  bundleIdPrefix: se.halkvakt
  deploymentTarget:
    iOS: "17.0"
packages:
  HalkvaktEngine:
    path: ../HalkvaktEngine
targets:
  Halkvakt:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: HalkvaktEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.halkvakt.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"   # iPhone-app — iPad-multitasking kräver annars alla vridningar (validering 31/8)
        MARKETING_VERSION: 0.3.9
        CURRENT_PROJECT_VERSION: 12
        SWIFT_VERSION: "5.0"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Halkvakt
        DEVELOPMENT_TEAM: R93LGMM343   # Lagerlöf Labs. Satt 20/9 (läst ur .xcodeproj efter Axels 0.3.8-arkivering) så att
        # xcodegen slutar nollställa den — steget "välj Team igen" har kostat ett handgrepp vid varje bygge sedan 29/8.
        # Team-id är inte en hemlighet; det står i varje signerat bygge. Läxan 29/8 gäller fortfarande: koden i
        # Lita på-rutan på telefonen är CERTIFIKATETS id, inte teamets — det här är teamets.
    entitlements:
      path: Halkvakt.entitlements
      properties:
        com.apple.developer.usernotifications.time-sensitive: true   # #23 heads-up bryter Fokus "Kör"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)     # annars sätter xcodegen 1.0 — Apple tillåter aldrig nedräkning
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIRequiresFullScreen: true   # hängslen: stående låst utan iPad-krav
        UILaunchScreen: {}   # kräver fullskärm — utan denna letterboxar iOS appen med svarta band
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [location, audio]
        NSLocationWhenInUseUsageDescription: >-
          Halkvakt jämför din position med vägfaror lokalt i telefonen för att
          kunna varna med rösten. Positionen lämnar aldrig enheten.
        NSLocationAlwaysAndWhenInUseUsageDescription: >-
          Med "Alltid" kan vakten varna även när skärmen är släckt under körning.
          All matchning sker lokalt — positionen lämnar aldrig enheten.
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:   # skinnet v3 — Instrument Sans + IBM Plex Mono (OFL), Sources/Fonts
          - InstrumentSans.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
          - IBMPlexMono-SemiBold.ttf
