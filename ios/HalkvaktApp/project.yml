# Halkvakt iOS — XcodeGen-definition. `xcodegen` här ⇒ Halkvakt.xcodeproj.
# Se ios/MAC-GUIDE.md för Davids exakta steg.
name: Halkvakt
options:
  bundleIdPrefix: se.halkvakt
  deploymentTarget:
    iOS: "17.0"
packages:
  HalkvaktEngine:
    path: ../HalkvaktEngine
targets:
  Halkvakt:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: HalkvaktEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.halkvakt.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"   # iPhone-app — iPad-multitasking kräver annars alla vridningar (validering 31/8)
        MARKETING_VERSION: 0.3.3
        CURRENT_PROJECT_VERSION: 6
        SWIFT_VERSION: "5.0"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Halkvakt
        DEVELOPMENT_TEAM: ""   # OBS: väljs manuellt i Xcode efter VARJE xcodegen (Signing & Capabilities → Team). Koden i Lita på-rutan är CERTIFIKATETS id, inte teamets — läxa 29/8
    entitlements:
      path: Halkvakt.entitlements
      properties:
        com.apple.developer.usernotifications.time-sensitive: true   # #23 heads-up bryter Fokus "Kör"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)     # annars sätter xcodegen 1.0 — Apple tillåter aldrig nedräkning
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIRequiresFullScreen: true   # hängslen: stående låst utan iPad-krav
        UILaunchScreen: {}   # kräver fullskärm — utan denna letterboxar iOS appen med svarta band
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [location, audio]
        NSLocationWhenInUseUsageDescription: >-
          Halkvakt jämför din position med vägfaror lokalt i telefonen för att
          kunna varna med rösten. Positionen lämnar aldrig enheten.
        NSLocationAlwaysAndWhenInUseUsageDescription: >-
          Med "Alltid" kan vakten varna även när skärmen är släckt under körning.
          All matchning sker lokalt — positionen lämnar aldrig enheten.
        ITSAppUsesNonExemptEncryption: false
