# Grind NT — nederbördstypen (kort #45). Läsande knapp; se skriptets huvud. Spärrad till 1 mars 2027:
# utan dom-läget skriver den bara räkningar på facitsidan (TROSKLAR-NEDERBORDSTYPEN §5).
name: grind-nt
on:
  workflow_dispatch:
    inputs:
      dagar:
        description: "Fönster i dygn (spärrat läge)"
        required: false
        default: "30"
      lage:
        description: "sparr (standard) eller dom (låst till 2027-03-01)"
        type: choice
        default: sparr
        options: [sparr, dom]
jobs:
  grind-nt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node --experimental-strip-types scripts/grind-nt.ts --sjalvtest
      # Kort #323 (DECISIONS #513): fönstret ur hinken (de exporterade dygnen) och driften (de senaste) till en tillfällig
      # PostGIS, så att raderingens golv på 14 dygn (#511) inte krymper grinden. Grinden räknar mot den.
      - uses: ./.github/actions/tillfalliga-arkivet
        with: { dagar: "${{ inputs.dagar || '30' }}", drift-url: "${{ secrets.DATABASE_URL }}", tabeller: "weather_latest" }
      # shell: bash ger pipefail — annars äter tee exit-koden (läxan i DECISIONS #26).
      - shell: bash
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ inputs.lage }}" = dom ]; then FLAGGA=--dom; else FLAGGA=; fi
          node --experimental-strip-types scripts/grind-nt.ts "${{ inputs.dagar || '30' }}" $FLAGGA | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
        env: { DATABASE_URL: "${{ env.TILLFALLIG_URL }}" }
