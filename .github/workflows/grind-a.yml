name: grind-a
on:
  schedule:
    - cron: "40 5 * * 1"   # måndagar — underlaget växer med vintern
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Grind A — självtest först, sedan arkivet
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
        run: |
          node --experimental-strip-types publish/grind-a.ts --sjalvtest | tee -a "$GITHUB_STEP_SUMMARY"
          node --experimental-strip-types publish/grind-a.ts | tee -a "$GITHUB_STEP_SUMMARY"
