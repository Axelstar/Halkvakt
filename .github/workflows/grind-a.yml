name: grind-a
on:
  # Startas av pulsklockan (Supabase pg_cron, puls-grind-a "40 5 * * 1" UTC) — kort #160: GitHub-cronen kom
  # 5–7 h sent 14/9 och levererade 40 % i #70. Tiden: måndagar — underlaget växer med vintern
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Grind A — självtest först, sedan arkivet
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
        # shell: bash ger pipefail — utan den äter `| tee` exit-koden och underlagsvakt/
        # självtest kan aldrig fälla jobbet (tee-läxan, DECISIONS #26; larmvägen bevisad 1/9).
        shell: bash
        run: |
          node --experimental-strip-types publish/grind-a.ts --sjalvtest | tee -a "$GITHUB_STEP_SUMMARY"
          node --experimental-strip-types publish/grind-a.ts | tee -a "$GITHUB_STEP_SUMMARY"
