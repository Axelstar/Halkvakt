# Norskt skuggarkiv (#35): Vegvesen DATEX. Kontot beviljat 4/9 — första körningen med
# hemligheter är en REKOGNOSERING (verklig XML på Summary-sidan), parsern skrivs mot
# den. Utan hemligheter hoppar jobbet över tyst. Cron kvar som hängslen; pulsklockan
# tar över takten när arkivet faktiskt tickar (DECISIONS #26/#63).
name: ingest-no
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
concurrency: { group: ingest-no, cancel-in-progress: false }
jobs:
  no:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # shell: bash ger pipefail — annars äter tee exit-koden (läxan i DECISIONS #26).
      - name: Vegvesen DATEX → no.* (rekognosering tills parsern finns)
        shell: bash
        env:
          DATABASE_URL: "${{ secrets.DATABASE_URL }}"
          VEGVESEN_USER: "${{ secrets.VEGVESEN_USER }}"
          VEGVESEN_PASS: "${{ secrets.VEGVESEN_PASS }}"
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          node --experimental-strip-types ingest/no.ts | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
