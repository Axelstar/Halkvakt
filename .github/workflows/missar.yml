# #19: manuell knapp — körs från första halkdagen (och närhelst Bengt vill ha siffror).
name: missar
on:
  workflow_dispatch:
    inputs:
      dagar:
        description: "Dagar bakåt"
        default: "30"
jobs:
  missar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node --experimental-strip-types publish/missar.ts "${{ inputs.dagar }}"
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
