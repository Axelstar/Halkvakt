name: ios-engine
on:
  push:
    branches: [main]
    paths: ["ios/**", "engine/vectors/**", "engine/fixtures/**", ".github/workflows/ios-engine.yml"]
  workflow_dispatch: {}
jobs:
  vectors:
    # Swift engine is pure — runs on Linux (free minutes; macOS only needed for the app later).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Install Swift
        run: |
          curl -sL -o swift.tar.gz "https://download.swift.org/swift-6.0.3-release/ubuntu2404/swift-6.0.3-RELEASE/swift-6.0.3-RELEASE-ubuntu24.04.tar.gz"
          mkdir -p $HOME/swift && tar -xzf swift.tar.gz -C $HOME/swift --strip-components=1
      - name: Swift engine vs shared vectors (third runtime, same truth)
        run: cd ios/HalkvaktEngine && $HOME/swift/usr/bin/swift test
