# Reels (DECISIONS #780, #806, kort #281): två reels om dagen till Instagram och Facebook-sidan, inget annat.
# Startas av pulsklockan: puls-reels 19:50 UTC (kvällen, 20:50 vintertid) och puls-reels-morgon 05:45 UTC (morgonen, 06:45
# vintertid). reels.mjs läser av klockan i Stockholm vilken plats det är. Kvällen roterar mellan Ska du köra i morgon bitti?,
# Bilen säger plus / Gissa temperaturen (varannan vecka), Pendlar du, Har frosten nått din stad, Var är det halt och Sverige i
# natt; morgonen mellan Ska du köra nu? och Bilen säger plus. Kvällens data avgör vilka som får gå; data äldre än två timmar
# eller ingen film med något sant att visa: ingen reel.
# Kvällen är skarp sedan 4/11 (REELS_SKARPT=nej stoppar). Morgonen är torrkörning tills REELS_MORGON_SKARPT=ja: filmen och
# texterna läggs som artefakten *reel* och syns i sammanfattningen. Samma körning mäter reels äldre än 20 timmar.
name: reels
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency: { group: reels, cancel-in-progress: false }

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Verktygen
        run: |
          pip install --quiet numpy scikit-image matplotlib
          npm i --no-save --no-audit --no-fund playwright@1.47.2
          # Utan --with-deps: löparen har biblioteken, och typsnittspaketen den annars hämtar behövs inte (reel.html bär egna
          # typsnitt). 5/11 gav Ubuntus spegel 25 kB/s och körningen hann aldrig filma.
          npx playwright install chromium
          command -v ffmpeg || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }

      - name: Kvällens läge
        run: python3 marknadsforing/reels/data.py

      - name: Välj och filma
        env:
          REELS_SKARPT: ${{ vars.REELS_SKARPT || 'ja' }}
          REELS_MORGON_SKARPT: ${{ vars.REELS_MORGON_SKARPT || 'nej' }}
        run: node marknadsforing/reels.mjs rendera

      - name: Filmen och texterna
        uses: actions/upload-artifact@v4
        with:
          name: reel
          path: |
            marknadsforing/reels-ut/reel.mp4
            marknadsforing/reels-ut/text-*.txt
            marknadsforing/reels-ut/val.json
          if-no-files-found: ignore
          retention-days: 14

      # Kvittot committas även när en kanal faller, annars postar nästa körning samma kväll igen.
      - name: Posta
        env:
          REELS_SKARPT: ${{ vars.REELS_SKARPT || 'ja' }}
          REELS_MORGON_SKARPT: ${{ vars.REELS_MORGON_SKARPT || 'nej' }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_IG_ID: ${{ secrets.META_IG_ID }}
        run: |
          fel=0; node marknadsforing/reels.mjs posta || fel=$?
          git config user.name "Halkvakt reels"
          git config user.email "motor@halkvakt.dev"
          git add marknadsforing/reels-historik.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Reels: $(date -u +%F) [skip ci]"
          git pull --rebase --autostash origin main && git push origin main || { git status --porcelain; exit 1; }
          exit $fel

      # Faller mätningen påverkar det inte kvällens reel.
      - name: Mät reels äldre än ett dygn
        if: always()
        continue-on-error: true
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
        run: |
          node marknadsforing/reels.mjs matt
          git add marknadsforing/reels-historik.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Reels: mätning $(date -u +%F) [skip ci]"
          git pull --rebase --autostash origin main && git push origin main || { git status --porcelain; exit 1; }
