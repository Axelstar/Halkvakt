# Grind V-B (kort #42 steg E, #81): dömer skuggans vattenplaningsvarningar (shadow_log.vb) mot
# TROSKLAR-VATTENPLANING §3 — falsklarm ≤ 20 %, frekvens ≤ 3 per rutt och regndygn. Ingen tröskel
# sätts här; utlösaren importeras ur snapshotkärnan. V-C:s domspärr gäller: under underlaget skrivs
# ingen dom ut och ingen andel, bara räkningar (DECISIONS #350). Fönstret är hela perioden sedan 15/9 (#349).
#
# MÅNDAGSSERIEN (Bengts order 16/9 "kör den varje regnvecka"): sist i mätserien, efter grind-v-a som
# mäter samma spår från andra hållet — grind-a 05:40 · smhi 06:00 · v3 06:20 · trv 06:40 · höjd 07:00
# · V-A 07:20 · V-B 07:40. Mätvakten (vakthundens check 6a) bevakar schemalagda flöden, så en missad
# måndag larmar av sig själv.
#
# INGEN "hoppa över om inget nytt"-spärr, med flit: #85:s bridges-cron hoppade över 32 gånger och
# debiterades en hel minut varje gång. Kör den alltid och läs talen — en vecka utan nya vb-rader är
# också ett svar, och den kostar lika mycket som en tom körning gjort.
name: grind-v-b
on:
  # Startas av pulsklockan (Supabase pg_cron, puls-grind-v-b "40 7 * * 1" UTC) — kort #160: GitHub-cronen kom
  # 5–7 h sent 14/9 och levererade 40 % i #70. Tiden: måndagar, sist i mätserien (efter grind-v-a 07:20)
  workflow_dispatch:
    inputs:
      dagar:
        description: "Dagar bakåt — tomt ger hela perioden sedan 15/9 (DECISIONS #349)"
        default: ""
jobs:
  grind-v-b:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node --experimental-strip-types publish/grind-v-b.ts --sjalvtest
      - name: V-B:s fönster — dygnen sedan VB_START, ett extra för midnatt
        if: ${{ !inputs.dagar }}
        shell: bash
        run: |
          START=$(grep -oE 'VB_START = "[0-9]{4}-[0-9]{2}-[0-9]{2}"' publish/grind-v-b.ts | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}')
          echo "VB_DAGAR=$(( ( $(date -u +%s) - $(date -u -d "$START" +%s) + 86399 ) / 86400 + 1 ))" >> "$GITHUB_ENV"
      # Kort #323 (DECISIONS #513): fönstret ur hinken (de exporterade dygnen) och driften (de senaste) till en tillfällig
      # PostGIS, så att raderingens golv på 14 dygn (#511) inte krymper grinden. Grinden räknar mot den.
      - uses: ./.github/actions/tillfalliga-arkivet
        with: { dagar: "${{ inputs.dagar || env.VB_DAGAR }}", drift-url: "${{ secrets.DATABASE_URL }}", tabeller: "shadow_log,situation_archive" }
      # shell: bash ger pipefail — annars äter tee exit-koden (läxan i DECISIONS #26).
      - shell: bash
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          node --experimental-strip-types publish/grind-v-b.ts "${{ inputs.dagar }}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
        env: { DATABASE_URL: "${{ env.TILLFALLIG_URL }}" }
