# Nyckelbytet för INGEST_KEY (DECISIONS #570, Bengt 15/10 "gör 1,2 och 3"). Nyckeln läckte i klartext i en publik Actions-logg
# (dbknapp 38698517939: en bevisrad läste cron.job.command). Den nya nyckeln skapas här, maskeras innan något annat händer och
# skrivs aldrig ut: den sätts som funktionshemlighet (supabase secrets set, SUPABASE_ACCESS_TOKEN) och byts in i varje pg_cron-jobb
# som bär den gamla (DATABASE_URL). Arbetsflödena som anropar funktionerna läser nyckeln ur cron.job och följer med av sig själva.
# Beviset: arkivexporten svarar inte 403 på den nya nyckeln och 403 på den gamla, och inget cron-jobb bär den gamla.
# Misslyckas något efter att hemligheten satts läggs den gamla nyckeln tillbaka i båda ändarna, högljutt.
name: nyckelbyte-ingest
on:
  workflow_dispatch:
    inputs:
      bekrafta:
        description: "Skriv BYT för att byta INGEST_KEY"
        required: true
        default: ""
permissions: { contents: read }
concurrency: { group: nyckelbyte-ingest, cancel-in-progress: false }
jobs:
  byt:
    if: inputs.bekrafta == 'BYT'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: supabase/setup-cli@v1
        with: { version: 2.117.0 }
      - name: Byt INGEST_KEY i funktionerna och i cron.job
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: "${{ secrets.SUPABASE_ACCESS_TOKEN }}"
          DATABASE_URL: "${{ secrets.DATABASE_URL }}"
        run: |
          set -euo pipefail
          REF=xmpfztykhyvhmrzsnjrc
          FN="https://$REF.supabase.co/functions/v1/arkivexport"
          [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$DATABASE_URL" ] || { echo "::error::SUPABASE_ACCESS_TOKEN eller DATABASE_URL saknas"; exit 1; }

          GAMMAL=$(psql "$DATABASE_URL" -At -c "select substring(command from 'x-halkvakt-key[^A-Za-z0-9_-]+([A-Za-z0-9_-]+)') from cron.job where jobname = 'halkvakt-arkivexport'")
          [ "${#GAMMAL}" -ge 32 ] || { echo "::error::den gamla nyckeln gick inte att läsa ur cron.job (halkvakt-arkivexport)"; exit 1; }
          echo "::add-mask::$GAMMAL"
          NY=$(openssl rand -hex 32)
          echo "::add-mask::$NY"
          [ "${#NY}" -eq 64 ] && [ "$NY" != "$GAMMAL" ] || { echo "::error::den nya nyckeln blev inte 64 tecken"; exit 1; }

          # Antal jobb som bär en nyckel (variablerna tolkas av psql ur stdin; inget kommando skrivs ut).
          rakna() { psql "$DATABASE_URL" -At -v ON_ERROR_STOP=1 -v k="$1" <<'SQL'
          select count(*) from cron.job where position(:'k' in command) > 0;
          SQL
          }
          byt_cron() { psql "$DATABASE_URL" -At -v ON_ERROR_STOP=1 -v fran="$1" -v till="$2" <<'SQL'
          select count(*) from (select cron.alter_job(jobid, command := replace(command, :'fran', :'till'))
            from cron.job where position(:'fran' in command) > 0) x;
          SQL
          }
          satt_hemlighet() { local f="$RUNNER_TEMP/ingest.env"; printf 'INGEST_KEY=%s\n' "$1" > "$f"; supabase secrets set --env-file "$f" --project-ref "$REF" >/dev/null; rm -f "$f"; }
          status() { curl -s -o /dev/null -w '%{http_code}' -X POST "$FN" -H "x-halkvakt-key: $1" -H "Content-Type: application/json" -d '{}' || echo 000; }
          tillbaka() {
            echo "::error::$1 — den gamla nyckeln läggs tillbaka"
            byt_cron "$NY" "$GAMMAL" >/dev/null || true
            satt_hemlighet "$GAMMAL" || true
            exit 1
          }

          FORE=$(rakna "$GAMMAL")
          echo "Före: $FORE cron-jobb bär den gamla nyckeln"
          [ "$FORE" -ge 1 ] || { echo "::error::inget cron-jobb bär den gamla nyckeln"; exit 1; }

          satt_hemlighet "$NY" || { echo "::error::supabase secrets set föll — inget är bytt"; exit 1; }
          echo "Funktionshemligheten INGEST_KEY är satt"
          BYTTA=$(byt_cron "$GAMMAL" "$NY") || tillbaka "cron.job gick inte att byta"
          KVAR=$(rakna "$GAMMAL"); MED_NY=$(rakna "$NY")
          echo "cron.job: $BYTTA jobb bytta, $KVAR bär den gamla, $MED_NY bär den nya"
          [ "$KVAR" -eq 0 ] && [ "$MED_NY" -eq "$FORE" ] || tillbaka "cron.job bär inte den nya nyckeln i alla $FORE jobb"

          # Hemligheten når funktionerna inom sekunder; pröva i upp till två minuter.
          S=403
          for i in $(seq 1 24); do S=$(status "$NY"); [ "$S" != 403 ] && break; sleep 5; done
          echo "Ny nyckel: HTTP $S"
          [ "$S" != 403 ] && [ "$S" != 000 ] || tillbaka "funktionen tar inte emot den nya nyckeln (HTTP $S)"
          G=$(status "$GAMMAL")
          echo "Gammal nyckel: HTTP $G"
          [ "$G" = 403 ] || { echo "::error::den gamla nyckeln ger HTTP $G, inte 403"; exit 1; }
          {
            echo "### Nyckelbytet (DECISIONS #570)"
            echo "- cron.job: $BYTTA jobb bytta, $KVAR bär den gamla nyckeln, $MED_NY bär den nya"
            echo "- arkivexporten: den nya nyckeln ger HTTP $S, den gamla HTTP $G"
          } >> "$GITHUB_STEP_SUMMARY"
