# Nyckelbytet för funktionernas nyckel (DECISIONS #570, #571). Nyckeln läckte i klartext i en publik Actions-logg
# (dbknapp 38698517939: en bevisrad läste cron.job.command). Sedan sql/054 prövar de nio funktionerna x-halkvakt-key mot raden i
# `funktionsnyckel`, inte mot funktionshemligheten INGEST_KEY, så bytet görs helt med DATABASE_URL: raden och varje pg_cron-jobb
# som bär den gamla nyckeln byts i SAMMA transaktion. Den nya nyckeln skapas här, maskeras innan något annat händer och skrivs
# aldrig ut; värdena går till psql som variabler, så inget kommando hamnar i loggen. Arbetsflödena som anropar funktionerna läser
# nyckeln ur cron.job och följer med av sig själva. Beviset: arkivexporten svarar inte 403 på den nya nyckeln och 403 på den gamla.
# Fäller en kontroll i transaktionen rullas allt tillbaka (ON_ERROR_STOP); faller beviset efteråt byts den gamla tillbaka.
# Historik: de tre första körningarna (38701610490, 38703298551, 38705146382) försökte sätta funktionshemligheten, som
# deploynyckeln inte får skriva (edge_functions_secrets_write).
name: nyckelbyte-ingest
on:
  workflow_dispatch:
    inputs:
      bekrafta:
        description: "Skriv BYT för att byta funktionernas nyckel"
        required: true
        default: ""
permissions: { contents: read }
concurrency: { group: nyckelbyte-ingest, cancel-in-progress: false }
jobs:
  byt:
    if: inputs.bekrafta == 'BYT'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Byt nyckeln i funktionsnyckel och i cron.job
        shell: bash
        env:
          DATABASE_URL: "${{ secrets.DATABASE_URL }}"
        run: |
          set -euo pipefail
          FN="https://xmpfztykhyvhmrzsnjrc.supabase.co/functions/v1/arkivexport"
          [ -n "$DATABASE_URL" ] || { echo "::error::DATABASE_URL saknas"; exit 1; }

          GAMMAL=$(psql "$DATABASE_URL" -At -c "select nyckel from funktionsnyckel where id = 1")
          [ "${#GAMMAL}" -ge 32 ] || { echo "::error::funktionsnyckel saknar en nyckel (sql/054 inte körd?)"; exit 1; }
          echo "::add-mask::$GAMMAL"
          NY=$(openssl rand -hex 32)
          echo "::add-mask::$NY"
          [ "${#NY}" -eq 64 ] && [ "$NY" != "$GAMMAL" ] || { echo "::error::den nya nyckeln blev inte 64 tecken"; exit 1; }

          rakna() { psql "$DATABASE_URL" -At -v ON_ERROR_STOP=1 -v k="$1" <<'SQL'
          select count(*) from cron.job where position(:'k' in command) > 0;
          SQL
          }
          # Raden och cron-jobben i en transaktion. Är raden inte exakt en, eller antalet bytta jobb inte det väntade, fäller en
          # omöjlig typomvandling satsen (beroende av talet, så att planeraren inte räknar ut den i förväg som en konstant 1/0),
          # ON_ERROR_STOP stänger psql och transaktionen rullas tillbaka — inget är bytt.
          byt() { psql "$DATABASE_URL" -At -v ON_ERROR_STOP=1 -v fran="$1" -v till="$2" -v antal="$3" <<'SQL'
          begin;
          with u as (update funktionsnyckel set nyckel = :'till', bytt_at = now() where id = 1 and nyckel = :'fran' returning 1)
          select case when c = 1 then 'raden bytt' else ('fel: raderna ' || c)::int::text end from (select count(*) as c from u) z;
          select case when n = :antal then n::text || ' jobb bytta' else ('fel: jobben ' || n)::int::text end
            from (select count(*) as n from (select cron.alter_job(jobid, command := replace(command, :'fran', :'till'))
                  from cron.job where position(:'fran' in command) > 0) x) y;
          commit;
          SQL
          }
          status() { curl -s -o /dev/null -w '%{http_code}' -X POST "$FN" -H "x-halkvakt-key: $1" -H "Content-Type: application/json" -d '{}' || echo 000; }

          FORE=$(rakna "$GAMMAL")
          echo "Före: $FORE cron-jobb bär den gamla nyckeln"
          [ "$FORE" -ge 1 ] || { echo "::error::inget cron-jobb bär den gamla nyckeln"; exit 1; }
          # Funktionerna måste redan pröva mot databasen (sql/054 och omdeployen), annars faller beviset — pröva den gamla först.
          F=$(status "$GAMMAL"); echo "Gammal nyckel före bytet: HTTP $F"
          [ "$F" != 403 ] && [ "$F" != 000 ] || { echo "::error::funktionen tar inte emot den nuvarande nyckeln — inget är bytt"; exit 1; }

          byt "$GAMMAL" "$NY" "$FORE" || { echo "::error::transaktionen föll — inget är bytt"; exit 1; }
          KVAR=$(rakna "$GAMMAL"); MED_NY=$(rakna "$NY")
          echo "cron.job: $KVAR bär den gamla, $MED_NY bär den nya"

          S=$(status "$NY"); echo "Ny nyckel: HTTP $S"
          G=$(status "$GAMMAL"); echo "Gammal nyckel: HTTP $G"
          if [ "$S" = 403 ] || [ "$S" = 000 ] || [ "$G" != 403 ] || [ "$KVAR" -ne 0 ] || [ "$MED_NY" -ne "$FORE" ]; then
            echo "::error::beviset föll — den gamla nyckeln byts tillbaka"
            byt "$NY" "$GAMMAL" "$MED_NY" || echo "::error::tillbakabytet föll också — läs funktionsnyckel och cron.job"
            exit 1
          fi
          {
            echo "### Nyckelbytet (DECISIONS #570, #571)"
            echo "- cron.job: $KVAR bär den gamla nyckeln, $MED_NY bär den nya"
            echo "- arkivexporten: den nya nyckeln ger HTTP $S, den gamla HTTP $G"
          } >> "$GITHUB_STEP_SUMMARY"
