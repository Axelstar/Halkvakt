name: kandidat-timme
# KANDIDATEN LIVE, DEL B — grannarnas fel, RÅ och blandningen vid alla punkter för timmen (kort #343 steg 3, DECISIONS #556, #558).
# Körs varje timme av pulsklockan när den raden finns; tills dess på knapp. Läser PH för timmen ur kandidat_ph (del A) och grind A:s
# ankare just nu (sql/032 vagpunkt_ankare, samma population som skuggans RÅ), räknar med replikans tal (fysik/live/kandidat_timme.py)
# och skriver kandidat_live (sql/050), sedan gallringen. SAKNAS PH för timmen (DECISIONS #561, Bengts val a): är del A:s senaste
# körning fallen eller pågår förklarar den luckan, och timmen hoppas över grönt, med en notis HOPPAD som räknar den — mätvakten
# larmar redan på del A. Har del A:s senaste körning LYCKATS och PH ändå saknas är kedjan trasig, och då blir jobbet rött; annars
# kunde del B tiga för alltid medan allt såg grönt ut.
# RESERVEN (Bengts order 20/10): för den pågående timmen avgör scripts/kandidat-reserv.ts ur del A:s körningar sedan den senaste
# slotten (00:13, 06:13, 12:13, 18:13 UTC). Har pulsklockan inte startat slottens körning, eller har den enda fallit, startar del B
# del A själv och hoppar timmen — 20/10 föll 06:13 bort under morgonavbrottet och kandidaten teg nästan elva timmar.
# Ingen Trafikverksdata i någon fil eller logg: ankarna lämnar aldrig jobbet, bara kandidatens egna tal skrivs.
on:
  workflow_dispatch:
    inputs:
      tid:
        description: "timmen, t.ex. 2026-10-15T12:00:00Z — tomt = den timme som pågår just nu (UTC)"
        required: false
        default: ""
permissions:
  contents: read
  actions: write     # del A:s körningar, för att avgöra om en saknad PH är förklarad, och reserven som startar del A (20/10)
jobs:
  timme:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: "${{ github.token }}"
    steps:
      - uses: actions/checkout@v4
      # Fysiken och kuvösen ligger i det privata repot Axelstar/halkvakt-kuvos sedan 31/10 (DECISIONS #768, där F1): koden läggs ovanpå
      # utcheckningen med läsnyckeln. Loggen och sammanfattningen här är publika: inga parametrar, särdrag eller modellutskrifter, bara klart eller fel.
      - uses: actions/checkout@v4
        with: { repository: Axelstar/halkvakt-kuvos, token: "${{ secrets.KUVOS_LASNYCKEL }}", path: .kuvos-privat, persist-credentials: false }
      - name: Koden ur det privata repot ovanpå
        run: rsync -a --exclude .git .kuvos-privat/ ./ && rm -rf .kuvos-privat
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: fysik/requirements.txt }
      - name: Självtesten
        run: |
          node --experimental-strip-types ingest/kandidat-db.ts --sjalvtest 2>&1 | grep -v ExperimentalWarning | tail -1
          node --experimental-strip-types scripts/kandidat-reserv.ts --sjalvtest 2>&1 | grep -v ExperimentalWarning | tail -1
          python3 -m pip install -q $(grep -E '^(numpy|pandas)==' fysik/requirements.txt)
          python3 fysik/live/kandidat_timme.py --sjalvtest > /dev/null; echo "självtest ok: kandidat_timme.py"
      - name: Timmen, PH och ankarna
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
        shell: bash
        run: |
          TID="${{ inputs.tid }}"; [ -n "$TID" ] || TID=$(date -u +%Y-%m-%dT%H:00:00Z)
          echo "TID=$TID" >> "$GITHUB_ENV"
          set +e
          node --experimental-strip-types ingest/kandidat-db.ts ph "$TID" ph.csv 2>&1 | grep -v ExperimentalWarning | tee -a "$GITHUB_STEP_SUMMARY"
          KOD=${PIPESTATUS[0]}
          set -e
          if [ "$KOD" = 3 ]; then
            # Reserven (scripts/kandidat-reserv.ts, 20/10) gäller den pågående timmen. En angiven tid, eller ett gh som inte
            # svarar, prövas som förut: lyckades del A:s senaste körning är kedjan trasig, annars hoppas timmen.
            RES=""
            if [ -z "${{ inputs.tid }}" ]; then
              RES=$(gh run list --workflow kandidat-fysik.yml --limit 10 --json status,conclusion,createdAt 2>/dev/null \
                | node --experimental-strip-types scripts/kandidat-reserv.ts 2>/dev/null) || RES=""
            fi
            if [ -z "$RES" ]; then
              A=$(gh run list --workflow kandidat-fysik.yml --limit 1 --json conclusion,createdAt -q '.[0].conclusion + " " + .[0].createdAt' 2>/dev/null) || A="okänd (gh svarade inte)"
              if [ "${A%% *}" = success ]; then RES="trasig"$'\t'"del A:s senaste körning lyckades ($A)"; else RES="hoppa"$'\t'"del A:s senaste körning: ${A:-ingen}"; fi
            fi
            BESLUT="${RES%%$'\t'*}"; SKAL="${RES#*$'\t'}"
            case "$BESLUT" in
              trasig)
                echo "::error::ingen PH för $TID: $SKAL — kedjan är trasig, inte bara sen (eller timmen är äldre än tabellens två dygn)"
                exit 1 ;;
              starta)
                gh workflow run kandidat-fysik.yml
                echo "::warning title=RESERV::ingen PH för $TID: $SKAL — del A startad som reserv (scripts/kandidat-reserv.ts)"
                echo "**RESERV:** ingen PH för $TID — $SKAL. Del A är startad nu; timmen räknas som hoppad." >> "$GITHUB_STEP_SUMMARY" ;;
              *)
                echo "::notice title=HOPPAD::ingen PH för $TID: $SKAL (DECISIONS #561)"
                echo "**HOPPAD:** ingen PH för $TID — $SKAL. Timmen räknas som hoppad, inte som fel." >> "$GITHUB_STEP_SUMMARY" ;;
            esac
            echo "HOPPAD=1" >> "$GITHUB_ENV"
            exit 0
          fi
          [ "$KOD" = 0 ] || exit "$KOD"
          node --experimental-strip-types ingest/kandidat-db.ts ankare ankare.csv 2>&1 | grep -v ExperimentalWarning | tee -a "$GITHUB_STEP_SUMMARY"
          gh release download metnordic-live-2026-27 --pattern metnordic_punkter.csv --dir mn
          sed 's/^station_id,/sid,/' mn/metnordic_punkter.csv > punkter.csv
      - name: Del B — grannarna, RÅ och blandningen
        if: env.HOPPAD != '1'
        shell: bash
        run: |
          set -o pipefail
          python3 fysik/live/kandidat_timme.py --ph ph.csv --punkter punkter.csv --ankare ankare.csv --tid "$TID" --ut live.csv > del-b.log 2>&1 || { echo "::error::Del B föll. Utskriften visas inte i den publika loggen; felsök i en session med halkvakt-kuvos."; tail -n 1 del-b.log; exit 1; }
          echo "del B klar för $TID" | tee -a "$GITHUB_STEP_SUMMARY"
          rm -f ankare.csv
      - name: Till tabellen kandidat_live, sedan gallringen
        if: env.HOPPAD != '1'
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
        run: node --experimental-strip-types ingest/kandidat-db.ts skriv-live live.csv 2>&1 | grep -v ExperimentalWarning | tee -a "$GITHUB_STEP_SUMMARY"
