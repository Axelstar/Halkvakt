name: ny-kandidat-timme
# DEN NYA KANDIDATENS SKUGGA, DEL B (ersättningsregeln docs/FORREGISTRERING-ERSATTNING-2027-28.md §4, DECISIONS #692). Samma steg som den
# frystas kandidat-timme.yml: PH för timmen ur ny_kandidat_ph (den nyas del A, ny-kandidat-fysik.yml) och grind A:s ankare just nu (den
# frystas `ingest/kandidat-db.ts ankare`, bara läsning: samma population som den frystas RÅ), grannarnas fel, RÅ och blandningen med den
# nyas par ur kuvos/kandidat-2027-28.json (fysik/ny_kandidat/levande.py --del-b) → ny_kandidat_live, gallringen och domloggen
# ny_kandidat_logga() (sql/068). Loggen anropas härifrån och inte av pg_cron, så att flaggan styr all skrivning.
# FLAGGAN (kuvos/ny-kandidat-skugga.json) av ⇒ jobbet räknar inget och skriver inget; PH finns då inte heller i databasen.
# SAKNAS PH för timmen hoppas den grönt med en notis, och loggen skriver timmen som tyst (som den frystas logg gör en timme utan
# färskt värde).
# RESERVEN (DECISIONS #854, Bengt 13/11: "Ja, båda"): för den pågående timmen avgör scripts/kandidat-reserv.ts ur del A:s körningar
# sedan slotten :28 om del A ska startas igen, som den frystas reserv men med tre försök. MET:s THREDDS föll varje morgon 11–13/11
# mellan omkring 06:10 och 06:50 UTC, och del A på 06:28 föll 12/11 och 13/11; då saknade både den nya kandidaten och småvägsröstens
# timme PH i flera timmar. Timmen utan PH loggas som tyst som förut, och jobbet är grönt; reserven startar bara del A igen.
# PULSKLOCKAN sedan 24/10 (DECISIONS #706): puls-ny-kandidat-timme "47 * * * *", tre minuter före den frystas logg :50. Knappen finns
# kvar för en enskild timme. Ingenting här når appen, rösten, lägesfilen eller den frystas dom.
# Ingen Trafikverksdata i någon fil eller logg: ankarna lämnar aldrig jobbet, bara kandidatens egna tal skrivs.
# STORSTÄDERNAS PUNKTER (B och C, DECISIONS #804, kort #378): en egen omgång av del B efter dagens punkter, som aldrig fäller jobbet,
# se steget.
on:
  workflow_dispatch:
    inputs:
      tid:
        description: "timmen, t.ex. 2026-11-15T12:00:00Z — tomt = den timme som pågår just nu (UTC)"
        required: false
        default: ""
concurrency: { group: ny-kandidat-timme, cancel-in-progress: false }
permissions:
  contents: read
  actions: write     # del A:s körningar och reserven som startar del A igen (#854)
jobs:
  timme:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: "${{ github.token }}"
      NYKAND_VARIANT: t4                     # T4 §4 a (DECISIONS #720): den rättade kandidatens par och kandidatfil
    steps:
      - uses: actions/checkout@v4
      # Fysiken och kuvösen ligger i det privata repot Axelstar/halkvakt-kuvos sedan 31/10 (DECISIONS #768, där F1): koden läggs ovanpå
      # utcheckningen med läsnyckeln. Loggen och sammanfattningen här är publika: inga parametrar, särdrag eller modellutskrifter, bara klart eller fel.
      - uses: actions/checkout@v4
        with: { repository: Axelstar/halkvakt-kuvos, token: "${{ secrets.KUVOS_LASNYCKEL }}", path: .kuvos-privat, persist-credentials: false }
      - name: Koden ur det privata repot ovanpå
        run: rsync -a --exclude .git --exclude '/*.md' .kuvos-privat/ ./ && rm -rf .kuvos-privat
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: fysik/requirements.txt }
      - name: Självtesten, flaggan och kandidatfilen
        shell: bash
        run: |
          set -o pipefail
          node --experimental-strip-types ingest/ny-kandidat-db.ts --sjalvtest 2>&1 | grep -v ExperimentalWarning | tail -1
          node --experimental-strip-types ingest/kandidat-db.ts --sjalvtest 2>&1 | grep -v ExperimentalWarning | tail -1
          node --experimental-strip-types scripts/kandidat-reserv.ts --sjalvtest 2>&1 | grep -v ExperimentalWarning | tail -1
          python3 -m pip install -q $(grep -E '^(numpy|pandas|scipy|scikit-learn|pyarrow)==' fysik/requirements.txt)
          python3 fysik/live/kandidat_timme.py --sjalvtest > /dev/null; echo "självtest ok: kandidat_timme.py"
          F=$(node --experimental-strip-types ingest/ny-kandidat-db.ts --flagga 2>/dev/null); echo "flaggan: $F" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "FLAGGA=${F%%$'\t'*}" >> "$GITHUB_ENV"
          python3 -c "import sys; sys.path.insert(0, 'fysik/ny_kandidat'); import levande; c = levande.ladda()" > /dev/null; echo "kandidatfilen läst" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Flaggan av — ingenting räknas eller skrivs
        if: env.FLAGGA != 'på'
        run: echo "**Flaggan är av** (kuvos/ny-kandidat-skugga.json) — del B räknar inget och skriver inget." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Timmen, PH och ankarna
        if: env.FLAGGA == 'på'
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
        shell: bash
        run: |
          TID="${{ inputs.tid }}"; [ -n "$TID" ] || TID=$(date -u +%Y-%m-%dT%H:00:00Z)
          echo "TID=$TID" >> "$GITHUB_ENV"
          set +e
          node --experimental-strip-types ingest/ny-kandidat-db.ts ph "$TID" ph.csv 2>&1 | grep -v ExperimentalWarning | tee -a "$GITHUB_STEP_SUMMARY"
          KOD=${PIPESTATUS[0]}
          set -e
          if [ "$KOD" = 3 ]; then
            echo "::notice title=HOPPAD::den nya kandidaten: ingen PH för $TID — timmen loggas som tyst"
            echo "**HOPPAD:** ingen PH för $TID i ny_kandidat_ph — timmen loggas som tyst." >> "$GITHUB_STEP_SUMMARY"
            node --experimental-strip-types ingest/ny-kandidat-db.ts logga 2>&1 | grep -v ExperimentalWarning | tee -a "$GITHUB_STEP_SUMMARY"
            # Reserven (#854), efter loggen så att timmen alltid loggas. Den gäller den pågående timmen. En angiven tid, eller ett gh som inte svarar, startar ingenting.
            if [ -z "${{ inputs.tid }}" ]; then
              RES=$(gh run list --workflow ny-kandidat-fysik.yml --limit 10 --json status,conclusion,createdAt 2>/dev/null \
                | node --experimental-strip-types scripts/kandidat-reserv.ts --slott-min 28 --forsok 3 2>/dev/null) || RES=""
              BESLUT="${RES%%$'\t'*}"; SKAL="${RES#*$'\t'}"
              case "$BESLUT" in
                starta)
                  gh workflow run ny-kandidat-fysik.yml || echo "::warning title=RESERV::den nya kandidaten: del A gick inte att starta"
                  echo "::warning title=RESERV::den nya kandidaten: ingen PH för $TID: $SKAL — del A startad igen (scripts/kandidat-reserv.ts)"
                  echo "**RESERV:** $SKAL. Del A är startad igen; PH kommer till nästa timme." >> "$GITHUB_STEP_SUMMARY" ;;
                trasig)
                  echo "::warning title=TRASIG::den nya kandidaten: ingen PH för $TID: $SKAL"
                  echo "**TRASIG?** $SKAL, men PH saknas för $TID." >> "$GITHUB_STEP_SUMMARY" ;;
                hoppa)
                  echo "Reserven: $SKAL." >> "$GITHUB_STEP_SUMMARY" ;;
                *)
                  echo "Reserven: gh eller skriptet svarade inte, ingenting startat." >> "$GITHUB_STEP_SUMMARY" ;;
              esac
            fi
            echo "HOPPAD=1" >> "$GITHUB_ENV"
            exit 0
          fi
          [ "$KOD" = 0 ] || exit "$KOD"
          node --experimental-strip-types ingest/kandidat-db.ts ankare ankare.csv 2>&1 | grep -v ExperimentalWarning | tee -a "$GITHUB_STEP_SUMMARY"
          gh release download metnordic-live-2026-27 --pattern metnordic_punkter.csv --dir mn
          sed 's/^station_id,/sid,/' mn/metnordic_punkter.csv > punkter.csv
      - name: Del B — grannarna, RÅ och blandningen med den nyas par
        if: env.FLAGGA == 'på' && env.HOPPAD != '1'
        shell: bash
        run: |
          set -o pipefail
          python3 fysik/ny_kandidat/levande.py --del-b --ph ph.csv --punkter punkter.csv --ankare ankare.csv --tid "$TID" --ut live.csv > del-b.log 2>&1 || { echo "::error::Del B föll. Utskriften visas inte i den publika loggen; felsök i en session med halkvakt-kuvos."; tail -n 1 del-b.log; exit 1; }
          echo "del B klar för $TID" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Till ny_kandidat_live, gallringen och domloggen
        if: env.FLAGGA == 'på' && env.HOPPAD != '1'
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
        shell: bash
        run: |
          set -o pipefail
          node --experimental-strip-types ingest/ny-kandidat-db.ts skriv-live live.csv 2>&1 | grep -v ExperimentalWarning | tee -a "$GITHUB_STEP_SUMMARY"
          node --experimental-strip-types ingest/ny-kandidat-db.ts logga 2>&1 | grep -v ExperimentalWarning | tee -a "$GITHUB_STEP_SUMMARY"
      # STORSTÄDERNAS PUNKTER (DECISIONS #804, kort #378): en egen omgång av del B EFTER dagens punkter, som redan är skrivna ovan. Den
      # första omgången hoppar över stadspunkterna, eftersom de saknar läge i punktfilen. Samma timme, samma PH och samma ankare. Stationernas
      # rader och lägen följer med, eftersom RÅ:s rester räknas ur stationernas eget PH (kandidat_timme.timme). Varje punkt räknas för sig
      # mot ankarna, så utfallet är detsamma som i en gemensam omgång. Bara B- och C-raderna skrivs. continue-on-error: faller omgången har
      # stadspunkterna inget värde den timmen, och dagens K är redan skrivet. Loggen säger bara klart eller fel.
      - name: Storstädernas punkter — del B och ny_kandidat_live
        if: env.FLAGGA == 'på' && env.HOPPAD != '1'
        continue-on-error: true
        timeout-minutes: 8
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
        shell: bash
        run: |
          set -o pipefail
          { head -1 ph.csv; grep -v -E '^(punkt,|v)' ph.csv || true; } > ph-stad.csv
          grep -qE '^[BC][0-9]{5},' ph-stad.csv || { echo "storstädernas punkter: ingen PH för $TID" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; }
          node --experimental-strip-types ingest/stadskedjan.ts lagen punkter-stad.csv 2>&1 | grep -v ExperimentalWarning
          tail -n +2 punkter.csv | grep -v '^v' | cut -d, -f1-3 >> punkter-stad.csv
          python3 fysik/ny_kandidat/levande.py --del-b --ph ph-stad.csv --punkter punkter-stad.csv --ankare ankare.csv --tid "$TID" --ut live-stad.csv > del-b-stad.log 2>&1 \
            || { echo "::warning::storstädernas punkter: del B föll för $TID"; exit 1; }
          awk -F, 'NR == 1 || $2 ~ /^[BC][0-9][0-9][0-9][0-9][0-9]$/' live-stad.csv > live-bc.csv
          node --experimental-strip-types ingest/ny-kandidat-db.ts skriv-live live-bc.csv > /dev/null 2>&1 || { echo "::warning::storstädernas punkter: skrivningen föll för $TID"; exit 1; }
          # Stadspunkternas logg för olycksfacit (sql/096, DECISIONS #815), efter att deras värden är skrivna. Utskriften visas inte (#768).
          node --experimental-strip-types ingest/ny-kandidat-db.ts logga-stad > /dev/null 2>&1 || { echo "::warning::storstädernas punkter: stadsloggen föll för $TID"; exit 1; }
          echo "storstädernas punkter: klart för $TID" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Ankarna lämnar aldrig jobbet
        if: always()
        run: rm -f ankare.csv
