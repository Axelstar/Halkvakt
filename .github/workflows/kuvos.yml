# Kuvösen (kort #232, PLAN-KUVOSEN steg 3, DECISIONS #439): vintern 2024/25 inläst i en slit-och-släng-PostGIS, aldrig i Supabase.
# Hämtar Trafikverkets leverans ur den privata releasen, kontrollerar sha256 mot kuvos/leverans.json, kör migrationerna och klockan,
# läser in (kuvos/inlasning.ts → kuvos/oversattning.sql), SMHI för samma vinter (kuvos/smhi-inlasning.ts, steg 4), kör vakterna
# som antal och värdevakten. Läser inget utfall.
# Knapp, inte cron. Körflödet (steg 5) byggs ovanpå samma steg.
name: kuvos
on:
  workflow_dispatch:
    inputs:
      matning:
        description: "Läsande mätning efter vakterna, en fil under scripts/matningar/ (tomt = ingen). Förregistreras i DECISIONS före körningen."
        default: ""
      korflode:
        description: "Körflödet (steg 5). tid-sju-dygn = bara körtiden, inga varningar (#426). riktningsprov = LÄSER UTFALL, bara på Bengts ord (#424, #455). kalibrering = regel D på vintern, efter riktningsprovet, bara på Bengts ord (#425, #468)."
        type: choice
        options: [ingen, tid-sju-dygn, riktningsprov, kalibrering]
        default: ingen
permissions:
  contents: read
  issues: write   # domlarmet (DECISIONS #649) för olycksläsningens dom över sikten (#697); inget annat steg använder det
jobs:
  inlasning:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (contains(inputs.matning, 'niva2') || contains(inputs.matning, 'kuvos-blandning-prognos') || contains(inputs.matning, 'kuvos-blandning-vagb')) && 360 || ((inputs.korflode == 'riktningsprov' || inputs.korflode == 'kalibrering' || inputs.matning != '') && 300 || 60) }}   # 6/10: 82 min till höjdprovet, NT och efterhalkan därefter; en mätning kan köra grind A flera gånger (#469). Nivå 2 (#509) kör fysikkedjan två gånger, ~3 h: GitHubs tak 360.
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      PGPASSWORD: postgres
    steps:
      - run: echo "JOBB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      # Fysiken och kuvösen ligger i det privata repot Axelstar/halkvakt-kuvos (DECISIONS #768): koden läggs ovanpå utcheckningen.
      - uses: actions/checkout@v4
        with: { repository: Axelstar/halkvakt-kuvos, token: "${{ secrets.KUVOS_LASNYCKEL }}", path: .kuvos-privat, persist-credentials: false }
      - name: Koden ur det privata repot ovanpå
        run: rsync -a --exclude .git --exclude '/*.md' .kuvos-privat/ ./ && rm -rf .kuvos-privat
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Facitläsningen (DECISIONS #591, #592) läser utfall: utan båda signaturerna i förregistreringens §8 fälls jobbet här, före
      # leveransen och fysikkedjans tre timmar. Indatans prov (kuvos-facit-trv-indata-*) läser inget facit och spärras inte.
      - name: Förregistreringen signerad (facitläsningen)
        if: ${{ contains(inputs.matning, 'kuvos-blandning-vagb-facit-trv') }}
        env: { MATNING: "${{ inputs.matning }}" }
        run: |
          node --experimental-strip-types kuvos/facit-trv.ts --signerad docs/FORREGISTRERING-FACIT-TRV-2024-25.md
          if [[ "$MATNING" == *uppfoljning* ]]; then node --experimental-strip-types kuvos/facit-trv.ts --signerad docs/FORREGISTRERING-FACIT-TRV-UPPFOLJNING.md; fi
      # Olycksläsningen (DECISIONS #697) läser utfall: utan båda signaturerna i förregistreringens §9 fälls jobbet här, före leveransen
      # och fysikkedjans tre timmar. Läsningen prövar signaturerna igen, och facitläsningens förregistrering i forbered().
      - name: Förregistreringen signerad (olyckorna)
        if: ${{ contains(inputs.matning, 'olyckor-trv') }}
        run: node --experimental-strip-types kuvos/olyckor-trv.ts --signerad docs/FORREGISTRERING-OLYCKOR-2024-25.md
      # Leveransen ligger sedan 9/10 i den privata hinken `arkiv` i Supabase, inte i releasen, som blir publik med repot (kort #311,
      # DECISIONS #499). Signerade adresser ur arkivdump; nyckeln ur pg_cron:s jobb som i arkivbackup.yml, maskerad.
      - name: Leveransen ur hinken, kontrollsummorna mot manifestet
        shell: bash
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
        run: |
          set -euo pipefail
          command -v psql >/dev/null || sudo apt-get -qq install -y postgresql-client
          read -r FN KEY < <(psql "$DATABASE_URL" -At -F ' ' -c "select substring(command from '(https://[a-z0-9]+[.]supabase[.]co)') || '/functions/v1/arkivdump', substring(command from 'x-halkvakt-key[^A-Za-z0-9_-]+([A-Za-z0-9_-]+)') from cron.job where jobname = 'halkvakt-arkivexport'")
          [ "${#KEY}" -ge 32 ] || { echo "::error::nyckeln gick inte att läsa ur cron.job (halkvakt-arkivexport)"; exit 1; }
          echo "::add-mask::$KEY"
          FILER=$(node -e 'console.log(JSON.stringify(require("./kuvos/leverans.json").filer.map((f) => "kuvos-trv-2024-25/" + f.packad)))')
          curl -sS --fail-with-body -X POST "$FN?lage=kuvos_hamta" -H "x-halkvakt-key: $KEY" -H "Content-Type: application/json" -d "{\"filer\":$FILER}" > hamta.json
          mkdir -p leverans
          node -e 'for (const d of require("./hamta.json").filer) console.log(d.fil.split("/").pop() + " " + d.url)' | while read -r FIL URL; do
            curl -sS --fail -o "leverans/$FIL" "$URL"
          done
          rm hamta.json
          node -e '
            const m = require("./kuvos/leverans.json"), c = require("crypto"), fs = require("fs");
            let fel = 0;
            for (const f of m.filer) {
              const h = c.createHash("sha256").update(fs.readFileSync("leverans/" + f.packad)).digest("hex");
              console.log(`${f.packad}: ${h === f.packad_sha256 ? "ok" : "FEL " + h}`); if (h !== f.packad_sha256) fel++;
            }
            process.exit(fel ? 1 : 0);'
          curl -sSfL -o static.json https://axelstar.github.io/halkvakt-karta/data/app/v1/static.json
      # Trafikverkets utlämnande TRV 2026/111808 (DECISIONS #591): väglaget och åtgärderna för vintern, i hinken under
      # kuvos/trv-2026-111808/ (Axel via panelen). Bara när mätningen gäller facit; sha256 och storlek mot kuvos/trv-111808-leverans.json.
      - name: Trafikverkets väglag ur hinken, kontrollsummorna mot manifestet
        if: ${{ contains(inputs.matning, 'facit-trv') }}
        shell: bash
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
        run: |
          set -euo pipefail
          read -r FN KEY < <(psql "$DATABASE_URL" -At -F ' ' -c "select substring(command from '(https://[a-z0-9]+[.]supabase[.]co)') || '/functions/v1/arkivdump', substring(command from 'x-halkvakt-key[^A-Za-z0-9_-]+([A-Za-z0-9_-]+)') from cron.job where jobname = 'halkvakt-arkivexport'")
          [ "${#KEY}" -ge 32 ] || { echo "::error::nyckeln gick inte att läsa ur cron.job (halkvakt-arkivexport)"; exit 1; }
          echo "::add-mask::$KEY"
          FILER=$(node -e 'console.log(JSON.stringify(require("./kuvos/trv-111808-leverans.json").filer.map((f) => "trv-2026-111808/" + f.fil)))')
          curl -sS --fail-with-body -X POST "$FN?lage=kuvos_hamta" -H "x-halkvakt-key: $KEY" -H "Content-Type: application/json" -d "{\"filer\":$FILER}" > hamta.json
          mkdir -p trv
          node -e 'for (const d of require("./hamta.json").filer) console.log(d.fil.split("/").pop() + " " + d.url)' | while read -r FIL URL; do
            curl -sS --fail -o "trv/$FIL" "$URL"
          done
          rm hamta.json
          node -e '
            const m = require("./kuvos/trv-111808-leverans.json"), c = require("crypto"), fs = require("fs");
            let fel = 0;
            for (const f of m.filer) {
              const b = fs.readFileSync("trv/" + f.fil), h = c.createHash("sha256").update(b).digest("hex");
              const ok = h === f.sha256 && b.length === f.bytes; fel += !ok;
              console.log(`${f.fil}: ${b.length} byte, ${ok ? "sha256 lika" : "FEL " + h}`);
            }
            process.exit(fel ? 1 : 0);' | tee -a "$GITHUB_STEP_SUMMARY"
      # Olyckorna ur samma utlämnande (kompletteringen 20/10, DECISIONS #665): den rensade kopian, med regnummer och telefonnummer
      # maskade, i hinken under kuvos/trv-2026-111808/. Den står under manifestets 'komplettering', som steget ovan inte hämtar; sha256
      # och storlek mot den. Bara för olycksläsningen (#697).
      - name: Trafikverkets olyckor ur hinken, kontrollsumman mot manifestet
        if: ${{ contains(inputs.matning, 'olyckor-trv') }}
        shell: bash
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
        run: |
          set -euo pipefail
          read -r FN KEY < <(psql "$DATABASE_URL" -At -F ' ' -c "select substring(command from '(https://[a-z0-9]+[.]supabase[.]co)') || '/functions/v1/arkivdump', substring(command from 'x-halkvakt-key[^A-Za-z0-9_-]+([A-Za-z0-9_-]+)') from cron.job where jobname = 'halkvakt-arkivexport'")
          [ "${#KEY}" -ge 32 ] || { echo "::error::nyckeln gick inte att läsa ur cron.job (halkvakt-arkivexport)"; exit 1; }
          echo "::add-mask::$KEY"
          FILER=$(node -e 'console.log(JSON.stringify(require("./kuvos/trv-111808-leverans.json").komplettering.map((f) => "trv-2026-111808/" + f.fil)))')
          curl -sS --fail-with-body -X POST "$FN?lage=kuvos_hamta" -H "x-halkvakt-key: $KEY" -H "Content-Type: application/json" -d "{\"filer\":$FILER}" > hamta.json
          mkdir -p trv
          node -e 'for (const d of require("./hamta.json").filer) console.log(d.fil.split("/").pop() + " " + d.url)' | while read -r FIL URL; do
            curl -sS --fail -o "trv/$FIL" "$URL"
          done
          rm hamta.json
          node -e '
            const m = require("./kuvos/trv-111808-leverans.json"), c = require("crypto"), fs = require("fs");
            let fel = 0;
            for (const f of m.komplettering) {
              const b = fs.readFileSync("trv/" + f.fil), h = c.createHash("sha256").update(b).digest("hex");
              const ok = h === f.sha256 && b.length === f.bytes; fel += !ok;
              console.log(`${f.fil}: ${b.length} byte, ${ok ? "sha256 lika" : "FEL " + h}`);
            }
            process.exit(fel ? 1 : 0);' | tee -a "$GITHUB_STEP_SUMMARY"
      # Steg 4 (DECISIONS #441): SMHI för samma vinter — radarn samplad mot segmenten och fyra metobs-parametrar, hämtade en gång.
      # Hoppas över tills releasen finns och manifestet är incheckat (knappen kuvos-smhi skapar den) — fäller inte andras körningar.
      - name: SMHI ur releasen, kontrollsummorna mot manifestet
        if: ${{ hashFiles('kuvos/smhi-leverans.json') != '' }}
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p smhi && gh release download kuvos-smhi-2024-25 --dir smhi --pattern '*.csv.gz'
          node -e '
            const m = require("./kuvos/smhi-leverans.json"), c = require("crypto"), fs = require("fs");
            let fel = 0;
            for (const f of m.filer) {
              const h = c.createHash("sha256").update(fs.readFileSync("smhi/" + f.fil)).digest("hex");
              console.log(`${f.fil}: ${h === f.sha256 ? "ok" : "FEL " + h}`); if (h !== f.sha256) fel++;
            }
            process.exit(fel ? 1 : 0);'
      # MET Nordic (DECISIONS #480, #481) bara för mätningar som läser den: 49 MB, summorna mot kuvos/metnordic-leverans.json.
      # Läser den: filnamnet innehåller 'metnordic' eller är rutnätsmodellens ('kuvos-rn-') — en ny läsare läggs till här.
      # Blandningen (#516) läser bara static.json härifrån: fysikkedjans prep.py behöver den.
      - name: MET Nordic ur releasen, kontrollsummorna mot manifestet
        if: ${{ hashFiles('kuvos/metnordic-leverans.json') != '' && (contains(inputs.matning, 'metnordic') || contains(inputs.matning, 'kuvos-rn-') || contains(inputs.matning, 'kuvos-blandning') || contains(inputs.matning, 'kuvos-paritet')) }}
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p metnordic && gh release download kuvos-metnordic-2024-25 --dir metnordic
          node -e '
            const m = require("./kuvos/metnordic-leverans.json"), c = require("crypto"), fs = require("fs");
            let fel = 0;
            for (const f of m.filer) {
              const h = c.createHash("sha256").update(fs.readFileSync("metnordic/" + f.fil)).digest("hex");
              console.log(`${f.fil}: ${h === f.sha256 ? "ok" : "FEL " + h}`); if (h !== f.sha256) fel++;
            }
            process.exit(fel ? 1 : 0);'
      # MET Nordics prognoser (DECISIONS #518, #519, kort #308) bara för prognosläget: åtta delar ur den öppna releasen, summorna mot
      # kuvos/metnordic-prognos-leverans.json (skriven när hämtningen är klar; utan den, eller med en del som saknas, fälls jobbet).
      - name: MET Nordics prognoser ur releasen, kontrollsummorna mot manifestet
        if: ${{ contains(inputs.matning, 'kuvos-blandning-prognos') || contains(inputs.matning, 'kuvos-blandning-vagb') || contains(inputs.matning, 'kuvos-paritet') }}
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          [ -f kuvos/metnordic-prognos-leverans.json ] || { echo "::error::kuvos/metnordic-prognos-leverans.json saknas — hämtningen av MET Nordics prognoser är inte klar (kort #308)"; exit 1; }
          mkdir -p mnp && gh release download kuvos-metnordic-prognos-2024-25 --dir mnp --pattern 'metnordic_prognos_*.csv.gz'
          node -e '
            const m = require("./kuvos/metnordic-prognos-leverans.json"), c = require("crypto"), fs = require("fs");
            let fel = 0;
            for (const f of m.filer) {
              if (!fs.existsSync("mnp/" + f.fil)) { console.log(`${f.fil}: SAKNAS`); fel++; continue; }
              const h = c.createHash("sha256").update(fs.readFileSync("mnp/" + f.fil)).digest("hex");
              console.log(`${f.fil}: ${h === f.sha256 ? "ok" : "FEL " + h}`); if (h !== f.sha256) fel++;
            }
            const extra = fs.readdirSync("mnp").filter((x) => !m.filer.some((f) => f.fil === x));
            if (extra.length) { console.log(`utanför manifestet: ${extra.join(", ")}`); fel++; }
            process.exit(fel ? 1 : 0);'
      # FYSIK (DECISIONS #485, kort #305) bara för mätningen som läser den: Axels fysikspår som fil, 27 MB, summan mot kuvos/fysik-leverans.json.
      - name: FYSIK ur releasen, kontrollsumman mot manifestet
        if: ${{ hashFiles('kuvos/fysik-leverans.json') != '' && contains(inputs.matning, 'kuvos-fysik') }}
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p fysik && gh release download kuvos-fysik-2024-25 --dir fysik --pattern '*.csv.gz'
          node -e '
            const m = require("./kuvos/fysik-leverans.json"), c = require("crypto"), fs = require("fs");
            let fel = 0;
            for (const f of m.filer.filter((f) => f.fil.endsWith(".csv.gz"))) {
              const h = c.createHash("sha256").update(fs.readFileSync("fysik/" + f.fil)).digest("hex");
              console.log(`${f.fil}: ${h === f.sha256 ? "ok" : "FEL " + h}`); if (h !== f.sha256) fel++;
            }
            process.exit(fel ? 1 : 0);'
      # Varje migration för sig. De som kräver driftens tabeller (shadow_log m.fl. skapas av ingesten, inte av sql/) faller här
      # och skrivs ut; nästa steg kontrollerar att det kuvösen behöver finns — en saknad del fäller jobbet.
      - name: Migrationerna och klockan
        shell: bash
        run: |
          psql -h localhost -U postgres -qc "CREATE EXTENSION IF NOT EXISTS postgis"
          for f in sql/*.sql; do psql -h localhost -U postgres -q -v ON_ERROR_STOP=1 -f "$f" >/dev/null 2>err.txt || echo "föll (väntat om driftens tabell saknas): $f — $(tail -1 err.txt)"; done
          psql -h localhost -U postgres -q -v ON_ERROR_STOP=1 -f kuvos/klocka.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -Atc "
            SELECT 'weather_observations'::regclass, 'givarfel_dygn'::regclass, 'weather_obs_brott_idx'::regclass,
                   'langsam_vakt(interval)'::regprocedure, 'kuvos.now()'::regprocedure"
      - name: Inläsningen, vakterna och värdevakten
        shell: bash
        run: |
          {
            echo '```'
            node --experimental-strip-types kuvos/inlasning.ts leverans static.json
            if [ -d smhi ]; then node --experimental-strip-types kuvos/smhi-inlasning.ts smhi; else echo "SMHI: ingen release inläst än (kuvos/smhi-leverans.json saknas)"; fi
            psql -h localhost -U postgres -qc "ANALYZE weather_observations"
            node --experimental-strip-types kuvos/vakterna.ts
            # Väg A (DECISIONS #455): trendkandidaterna för hela vintern, efter vakterna (den långsamma vakten fyller givarfel_dygn).
            node --experimental-strip-types kuvos/trend.ts
            node --experimental-strip-types scripts/vardevakten.ts 1000
            echo '```'
          } 2>&1 | grep -v ExperimentalWarning | tee -a "$GITHUB_STEP_SUMMARY"
      # NIVÅ 2 AV VÄDERKÄLLAN (kort #319, DECISIONS #509) bara för mätningen som läser den: fysikkedjan i fysik/ körs här i jobbet,
      # först den frysta kedjan på ECMWF (kontrollen, ska ge FYSIK) och sedan samma kedja på MET Nordic (fysik/niva2/kedja.py).
      # Indata som inte är Trafikverkets (höjd, terräng, vägdata, ECMWF-cachen — öppna källor per station) ur Axels release, summorna mot
      # kuvos/fysik-indata-leverans.json. Trafikverkets filer packas upp där prep.py läser dem och når aldrig trädet (fysik/.gitignore).
      # BLANDNINGEN (kort #308, DECISIONS #490, #516): samma kontroll, och sedan grannarna och blandningen av Axels frysta kuvos_replica.py
      # på kontrollens FYSIK. Filerna bär grannarnas uppmätta yta och lämnar aldrig jobbet: de skrivs i blandning/, som ingen artefakt
      # tar med, och loggen bär bara aggregat.
      - uses: actions/setup-python@v5
        if: ${{ contains(inputs.matning, 'kuvos-fysik-niva2') || contains(inputs.matning, 'kuvos-blandning') || contains(inputs.matning, 'kuvos-paritet') }}
        with: { python-version: "3.13" }
      - name: Rättelsen modell.pkl ur hinken, kontrollsumman mot kandidatfilen (pariteten)
        if: ${{ contains(inputs.matning, 'kuvos-paritet') }}
        shell: bash
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
        run: |
          set -euo pipefail
          read -r FN KEY < <(psql "$DATABASE_URL" -At -F ' ' -c "select substring(command from '(https://[a-z0-9]+[.]supabase[.]co)') || '/functions/v1/arkivdump', substring(command from 'x-halkvakt-key[^A-Za-z0-9_-]+([A-Za-z0-9_-]+)') from cron.job where jobname = 'halkvakt-arkivexport'")
          [ "${#KEY}" -ge 32 ] || { echo "::error::nyckeln gick inte att läsa ur cron.job (halkvakt-arkivexport)"; exit 1; }
          echo "::add-mask::$KEY"
          curl -sS --fail-with-body -X POST "$FN?lage=kuvos_hamta" -H "x-halkvakt-key: $KEY" -H "Content-Type: application/json" -d '{"filer":["kuvos-kandidat-2026-27/modell.pkl"]}' > hamta.json
          node -e '
            const k = require("./kuvos/kandidat-2026-27.json"), h = require("./hamta.json").filer, c = require("crypto"), { execFileSync } = require("child_process"), fs = require("fs");
            const curl = (a) => { try { return execFileSync("curl", a, { maxBuffer: 1 << 30, stdio: ["ignore", "pipe", "ignore"] }); } catch (e) { console.error(`hämtningen föll (curl ${e.status})`); process.exit(1); } };
            const b = curl(["-sS", "--fail", h[0].url]); const f = k.filer.find((x) => x.fil === "modell.pkl");
            const ok = c.createHash("sha256").update(b).digest("hex") === f.sha256 && b.length === f.bytes;
            fs.writeFileSync("modell.pkl", b); console.log(`modell.pkl ur hinken: ${b.length} byte — ${ok ? "sha256 lika kandidatfilen" : "FEL"}`); process.exit(ok ? 0 : 1);'
          rm hamta.json
      - name: Fysikkedjan — kontrollen på ECMWF, och nivå 2 på MET Nordic eller grannarna och blandningen
        if: ${{ contains(inputs.matning, 'kuvos-fysik-niva2') || contains(inputs.matning, 'kuvos-blandning') || contains(inputs.matning, 'kuvos-paritet') }}
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}", MATNING: "${{ inputs.matning }}" }
        run: |
          set -euo pipefail
          [ -f kuvos/fysik-indata-leverans.json ] || { echo "::error::kuvos/fysik-indata-leverans.json saknas — Axels indata-release (kort #319, bedömningen §4.2)"; exit 1; }
          python3 -m pip install -q $(grep -E '^(numpy|pandas|scipy|scikit-learn|pyarrow)==' fysik/requirements.txt)
          mkdir -p indata && gh release download kuvos-fysik-indata-2024-25 --dir indata
          node -e '
            const m = require("./kuvos/fysik-indata-leverans.json"), c = require("crypto"), fs = require("fs");
            let fel = 0;
            for (const f of m.filer) {
              const h = c.createHash("sha256").update(fs.readFileSync("indata/" + f.fil)).digest("hex");
              console.log(`${f.fil}: ${h === f.sha256 ? "ok" : "FEL " + h}`); if (h !== f.sha256) fel++;
            }
            process.exit(fel ? 1 : 0);'
          # Kedjan körs där den frystes: /home/claude/fys är en länk till fysik/ (de frysta filerna bär den sökvägen, README).
          sudo mkdir -p /home/claude /mnt/user-data/uploads && sudo chown -R "$(id -u):$(id -g)" /home/claude /mnt/user-data
          ln -sfn "$PWD/fysik" /home/claude/fys
          mkdir -p fysik/data
          for f in indata/*.tar.gz; do [ -e "$f" ] && tar -xzf "$f" -C fysik/data; done
          if [ -d fysik/data/data ]; then mv fysik/data/data/* fysik/data/ && rmdir fysik/data/data; fi
          for f in indata/*.csv; do [ -e "$f" ] && cp "$f" fysik/data/; done
          for f in leverans/*.csv.gz; do gunzip -c "$f" > "/mnt/user-data/uploads/$(basename "${f%.gz}")"; done
          cp metnordic/static_2026-10-06.json fysik/data/static.json
          echo "indata: $(ls fysik/data | tr '\n' ' ') · ifs $(ls fysik/data/ifs | wc -l) stationer · ifs2 $(ls fysik/data/ifs2 | wc -l)"
          UT="$PWD/niva2-ut"; MN="$PWD/metnordic/metnordic_2024-25.csv.gz"; BL="$PWD/blandning"; MNP="$PWD/mnp"
          {
            echo '```'
            if [[ "$MATNING" == *kuvos-paritet* ]]; then
              # Pariteten (kort #343, steg 5, DECISIONS #559): den LEVANDE kedjan mot kuvösens FRYSTA procedur på samma körning,
              # samma analys och samma modell. Tre förregistrerade körningar i vintern 24/25, en per månad, alla 00Z.
              for KT in 2024-12-15T00 2025-01-15T00 2025-02-15T00; do
                TS="${KT}:00:00Z"
                # En enda läsning utan head: rad 1 i den hopslagna strömmen är första filens rubrik, och de andra filernas rubriker
                # har korning_utc i kolumn 2 och faller bort. (`zcat | head -1` dog på SIGPIPE under pipefail, körning 38645429144.)
                zcat "$MNP"/metnordic_prognos_*.csv.gz | awk -F, -v ts="$TS" 'NR==1 || $2==ts' | gzip > "korning_$KT.csv.gz"
                N=$(zcat "korning_$KT.csv.gz" | tail -n +2 | wc -l)
                echo "körningen $TS: $N prognosrader ur arkivet"
                [ "$N" -gt 0 ] || { echo "::error::körningen $TS finns inte i prognosarkivet"; exit 1; }
                (cd /home/claude/fys && python3 prep.py >/dev/null && python3 live/paritet.py --indata /home/claude/fys/data                   --metnordic "$MN" --korning "$OLDPWD/korning_$KT.csv.gz" --modell "$OLDPWD/modell.pkl"                   --kandidat "$OLDPWD/kuvos/kandidat-2026-27.json" --korningstid "$KT" --ut "$OLDPWD/paritet-ut")
              done
              rm -f modell.pkl
            elif [[ "$MATNING" == *kuvos-blandning-frysta* ]]; then
              # Den frysta kandidaten för 2026/27 (#544 punkt 6, kort #342): den valda proceduren på alla stationer (frysta.py), valet ur
              # kuvos/kandidat-2026-27-val.json. Modellen går till hinken i steget efter; manifestet till repot ur kvittot.
              VAL="$PWD/kuvos/kandidat-2026-27-val.json"
              [ -f "$VAL" ] || { echo "::error::kuvos/kandidat-2026-27-val.json saknas — valregeln i #549 är inte bokförd"; exit 1; }
              (cd /home/claude/fys && python3 prep.py && python3 niva2/frysta.py --val "$VAL" --metnordic "$MN" --ut "$UT" --maxfev 120)
            elif [[ "$MATNING" == *kuvos-blandning-vagb2-terrang* ]]; then
              # Väg B varv 2, körning 2 (#549, kort #321): terrängen och trafiken i energibalansen (vagb_terrang.py, elva parametrar),
              # blandningens vikt ur varv 2:s 42 par. Före varv 1:s gren, som annars tar namnet.
              (cd /home/claude/fys && python3 prep.py && python3 prep_raw.py && python3 niva2/vagb_terrang.py --metnordic "$MN" --prognos "$MNP/metnordic_prognos_*.csv.gz" --ut "$UT" --maxfev 120 \
                && python3 blandning/vagb_blandning.py --oof "$UT/oof_terrang_analys.npy" --veck "$UT/veck_terrang.json" --rutnat varv2 --namn "NIVÅ 2 TERRÄNG ÄRLIG" --fil niva2-terrang --ut "$BL" \
                && python3 blandning/vagb_blandning.py --oof "$UT/oof_terrang_prognos6.npy" --veck "$UT/veck_terrang.json" --rutnat varv2 --namn "NIVÅ 2 TERRÄNG ÄRLIG" --fil niva2-terrang --lage "prognos +6 h" --kod prognos6 --lagg-till --ut "$BL")
            elif [[ "$MATNING" == *kuvos-blandning-vagb2-rutnat* ]]; then
              # Väg B varv 2, körning 1 (#549): fysiken och rättelsen som i varv 1 (vagb.py), blandningens vikt ur varv 2:s 42 par.
              (cd /home/claude/fys && python3 prep.py && python3 prep_raw.py && python3 niva2/vagb.py --metnordic "$MN" --prognos "$MNP/metnordic_prognos_*.csv.gz" --ut "$UT" --maxfev 120 \
                && python3 blandning/vagb_blandning.py --oof "$UT/oof_vagb_analys.npy" --veck "$UT/veck_vagb.json" --rutnat varv2 --ut "$BL" \
                && python3 blandning/vagb_blandning.py --oof "$UT/oof_vagb_prognos6.npy" --veck "$UT/veck_vagb.json" --rutnat varv2 --lage "prognos +6 h" --kod prognos6 --lagg-till --ut "$BL")
            elif [[ "$MATNING" == *kuvos-blandning-vagb* ]]; then
              # Väg B (#544, kort #342): varje veck räknas bara med de andra fyra (vagb.py), och blandningens vikt väljs per veck på de
              # andra fyra (vagb_blandning.py, som först visar att Axels par ger replikans tal byte för byte). Analysläget och +6 h.
              (cd /home/claude/fys && python3 prep.py && python3 prep_raw.py && python3 niva2/vagb.py --metnordic "$MN" --prognos "$MNP/metnordic_prognos_*.csv.gz" --ut "$UT" --maxfev 120 \
                && python3 blandning/vagb_blandning.py --oof "$UT/oof_vagb_analys.npy" --veck "$UT/veck_vagb.json" --ut "$BL" \
                && python3 blandning/vagb_blandning.py --oof "$UT/oof_vagb_prognos6.npy" --veck "$UT/veck_vagb.json" --lage "prognos +6 h" --kod prognos6 --lagg-till --ut "$BL")
            elif [[ "$MATNING" == *kuvos-blandning-prognos* ]]; then
              # #519: nivå 2 på analysen och i prognosläget (omstart vid varje körning), och replikan på var och en av de tre skattningarna.
              (cd /home/claude/fys && python3 prep.py && python3 prep_raw.py && python3 niva2/prognos.py --metnordic "$MN" --prognos "$MNP/metnordic_prognos_*.csv.gz" --ut "$UT" --maxfev 120 \
                && python3 blandning/grannar_blandning.py --oof "$UT/oof_niva2.npy" --namn "NIVÅ 2" --fil niva2 --ut "$BL" \
                && python3 blandning/grannar_blandning.py --oof "$UT/oof_prognos6.npy" --namn "NIVÅ 2" --fil niva2 --lage "prognos +6 h" --kod prognos6 --lagg-till --ut "$BL" \
                && python3 blandning/grannar_blandning.py --oof "$UT/oof_prognos24.npy" --namn "NIVÅ 2" --fil niva2 --lage "prognos +24 h" --kod prognos24 --lagg-till --ut "$BL")
            elif [[ "$MATNING" == *kuvos-blandning-niva2* ]]; then
              # #517: nivå 2:s skattning (ingen kontroll; NIVÅ 2 i replikans halvtimmar är kontrollen mot #509) in i samma replika.
              (cd /home/claude/fys && python3 prep.py && python3 prep_raw.py && python3 niva2/kedja.py niva2 --metnordic "$MN" --ut "$UT" --maxfev 120 && python3 blandning/grannar_blandning.py --oof "$UT/oof_niva2.npy" --namn "NIVÅ 2" --fil niva2 --ut "$BL")
            elif [[ "$MATNING" == *kuvos-blandning* ]]; then
              (cd /home/claude/fys && python3 prep.py && python3 prep_raw.py && python3 niva2/kedja.py kontroll --ut "$UT" && python3 blandning/grannar_blandning.py --oof "$UT/oof_A2_kontroll.npy" --ut "$BL")
            else
              (cd /home/claude/fys && python3 prep.py && python3 niva2/kedja.py kontroll --ut "$UT" && python3 niva2/kedja.py niva2 --metnordic "$MN" --ut "$UT" --maxfev 120)
            fi
            echo '```'
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" fysik-utskrift.txt   # paren per veck läses av facitläsningens identitetsprov (#597)
      - name: Kedjans utdata sparas (modellens skattningar, inte Trafikverkets data)
        if: ${{ always() && contains(inputs.matning, 'kuvos-fysik-niva2') }}
        uses: actions/upload-artifact@v4
        with: { name: niva2-ut, path: niva2-ut/, retention-days: 90, if-no-files-found: ignore }
      # Den frysta kandidatens rättelse är tränad på Trafikverkets rader och ligger i den privata hinken, aldrig i repot eller en
      # artefakt (Bengt 13/10: "i hinken"). Signerad uppladdning skriver inte över en fil som redan finns: det som frysts står kvar.
      # Beviset är filen hämtad tillbaka ur hinken med manifestets sha256, som kuvos-hinken.yml.
      - name: Den frysta kandidaten till hinken, hämtad tillbaka och jämförd
        if: ${{ contains(inputs.matning, 'kuvos-blandning-frysta') }}
        shell: bash
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
        run: |
          set -euo pipefail
          read -r FN KEY < <(psql "$DATABASE_URL" -At -F ' ' -c "select substring(command from '(https://[a-z0-9]+[.]supabase[.]co)') || '/functions/v1/arkivdump', substring(command from 'x-halkvakt-key[^A-Za-z0-9_-]+([A-Za-z0-9_-]+)') from cron.job where jobname = 'halkvakt-arkivexport'")
          [ "${#KEY}" -ge 32 ] || { echo "::error::nyckeln gick inte att läsa ur cron.job (halkvakt-arkivexport)"; exit 1; }
          echo "::add-mask::$KEY"
          anrop() { curl -sS --fail-with-body -X POST "$FN?lage=$1" -H "x-halkvakt-key: $KEY" -H "Content-Type: application/json" -d "$2"; }
          FILER=$(node -e 'console.log(JSON.stringify(require("./niva2-ut/frysta/kandidat.json").filer.map((f) => "kuvos-kandidat-2026-27/" + f.fil)))')
          anrop kuvos_ladda_upp "{\"filer\":$FILER}" > urls.json
          node -e '
            const k = require("./niva2-ut/frysta/kandidat.json"), u = require("./urls.json").urls, { execFileSync } = require("child_process");
            // execFileSync:s fel bär kommandoraden och därmed den signerade adressen: fångas, bara statusen skrivs ut.
            const curl = (a) => { try { return execFileSync("curl", a, { stdio: ["ignore", "ignore", "ignore"] }); } catch (e) { console.error(`uppladdningen föll (curl ${e.status}) — finns filen redan i hinken skrivs den inte över`); process.exit(1); } };
            k.filer.forEach((f, i) => { curl(["-sS", "--fail", "-X", "PUT", "-H", "Content-Type: application/octet-stream", "--data-binary", "@niva2-ut/frysta/" + f.fil, u[i]]);
              console.log(`uppladdad: ${f.fil}`); });'
          anrop kuvos_hamta "{\"filer\":$FILER}" > hamta.json
          rm urls.json
          node -e '
            const k = require("./niva2-ut/frysta/kandidat.json"), h = require("./hamta.json").filer, c = require("crypto"), { execFileSync } = require("child_process");
            let fel = 0;
            const curl = (a) => { try { return execFileSync("curl", a, { maxBuffer: 1 << 30, stdio: ["ignore", "pipe", "ignore"] }); } catch (e) { console.error(`hämtningen föll (curl ${e.status})`); process.exit(1); } };
            h.forEach((d, i) => { const b = curl(["-sS", "--fail", d.url]); const f = k.filer[i];
              const ok = c.createHash("sha256").update(b).digest("hex") === f.sha256 && b.length === f.bytes; fel += !ok;
              console.log(`hämtad ur hinken: ${d.fil} (${b.length} byte) — ${ok ? "sha256 lika" : "FEL"}`); });
            process.exit(fel ? 1 : 0);' | tee -a "$GITHUB_STEP_SUMMARY"
          rm hamta.json
      # En mätning på samma inlästa vinter (snöflingan 2/10, DECISIONS #440). Bara filer under scripts/matningar/; den förregistreras
      # i DECISIONS innan knappen trycks, och den läser inga utfall.
      - name: Mätningen
        if: ${{ inputs.matning != '' }}
        shell: bash
        env: { MATNING: "${{ inputs.matning }}", NODE_OPTIONS: "--max-old-space-size=10240" }
        run: |
          [[ "$MATNING" =~ ^scripts/matningar/[A-Za-z0-9._-]+\.ts$ && -f "$MATNING" ]] || { echo "okänd mätning: $MATNING"; exit 1; }
          { echo '```'; node --experimental-strip-types "$MATNING"; echo '```'; } 2>&1 | grep -v ExperimentalWarning | tee -a "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/utskrift.txt"
      # Olycksläsningens aggregat (DECISIONS #697): JSON och markdown med antal, andelar, kvoter och marginaler — aldrig fritexten eller
      # platsen (PUBLIKT REPO). Domlarmet (#649) gör siktens dom (DOMRAD i utskriften) till ett ärende, också när läsningen fällt jobbet.
      - name: Olycksläsningens aggregat sparas
        if: ${{ always() && contains(inputs.matning, 'olyckor-trv') }}
        uses: actions/upload-artifact@v4
        with: { name: olyckor-2024-25, path: olyckor-ut/, retention-days: 90, if-no-files-found: ignore }
      - name: Domlarmet (#649)
        if: ${{ !cancelled() && contains(inputs.matning, 'olyckor-trv') }}
        run: node --experimental-strip-types scripts/domlarm.ts "$RUNNER_TEMP/utskrift.txt"
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      # Körflödet (steg 5, DECISIONS #426). Väglagsnätets geometri är dagens, som #426 säger; dess sha256 skrivs ut så att körningen
      # går att upprepa på samma nät. tid-sju-dygn läser inga varningar — den avgör bara om serie B ryms var tredje timme.
      - name: Körflödet
        if: ${{ inputs.korflode == 'tid-sju-dygn' }}
        shell: bash
        run: |
          curl -sSfL -o vaglag.geojson https://axelstar.github.io/halkvakt-karta/data/vaglag.geojson
          FORE=$(( ($(date +%s) - JOBB_START) / 60 ))
          { echo '```'; sha256sum vaglag.geojson
            node --experimental-strip-types kuvos/korning.ts vaglag.geojson --tid --dygn 7 --fore-min "$FORE"; echo '```'
          } 2>&1 | grep --line-buffered -v ExperimentalWarning | tee -a "$GITHUB_STEP_SUMMARY"
      # RIKTNINGSPROVET (DECISIONS #424, #455) — det enda läget som läser utfall, och bara på Bengts ord. Före regnmängden prövas:
      # frysrisken som baslinje (rösten i båda serierna), grind A, vägpunktsgrinden och höjden med frysflaggan, och nederbördstypen
      # på sitt startvärde. Grind A och höjdprovet räknar "de senaste N dygnen" från now(): de körs genom kuvösens klocka, ställd på
      # vinterns slut, så att fönstret är vintern och inget annat. Varningarna sparas för tabellen del × ensam × ovanpå (5d).
      # Efterhalkan (#456) går med i samma knapp: utan regnmängden skriver den bara att underlaget saknas.
      - name: Riktningsprovet
        if: ${{ inputs.korflode == 'riktningsprov' }}
        shell: bash
        # 6/10 (körning 37435099300): hojd-prov.ts föll på Nodes standardheap (~4 GB) över 152 dygn — JavaScript heap out
        # of memory efter 92 minuter, och NT och efterhalkan kördes aldrig. Runnern har 16 GB; heapen får 10.
        env: { NODE_OPTIONS: "--max-old-space-size=10240" }
        run: |
          curl -sSfL -o vaglag.geojson https://axelstar.github.io/halkvakt-karta/data/vaglag.geojson
          FRAN=$(psql -h localhost -U postgres -Atc "SELECT to_char(min(sample_time) AT TIME ZONE 'UTC', 'YYYY-MM-DD\"T\"HH24:MI:SS\"Z\"') FROM weather_observations")
          TILL=$(psql -h localhost -U postgres -Atc "SELECT to_char(max(sample_time) AT TIME ZONE 'UTC' + interval '1 second', 'YYYY-MM-DD\"T\"HH24:MI:SS\"Z\"') FROM weather_observations")
          DAGAR=$(psql -h localhost -U postgres -Atc "SELECT ceil(extract(epoch FROM max(sample_time) - min(sample_time)) / 86400)::int + 1 FROM weather_observations")
          KLOCKA="${DATABASE_URL}?options=-c%20search_path%3Dkuvos%2Cpublic%2Cpg_catalog%20-c%20kuvos.nu%3D${TILL}%20-c%20TimeZone%3DUTC"
          {
            echo '```'; echo "vintern $FRAN – $TILL, $DAGAR dygn"; sha256sum vaglag.geojson
            DATABASE_URL="$KLOCKA" node -e 'const pg=require("pg");const c=new pg.Client({connectionString:process.env.DATABASE_URL});c.connect().then(()=>c.query("SELECT now()::text AS nu")).then((r)=>{console.log("klockan för grindarna:",r.rows[0].nu);return c.end()})' || exit 1
            node --experimental-strip-types kuvos/korning.ts vaglag.geojson --ut varningar.ndjson
            node --experimental-strip-types kuvos/baslinjen.ts varningar.ndjson
            DATABASE_URL="$KLOCKA" node --experimental-strip-types publish/grind-a.ts "$DAGAR"
            DATABASE_URL="$KLOCKA" node --experimental-strip-types scripts/hojd-prov.ts "$DAGAR" --frysflagga
            node --experimental-strip-types scripts/grind-nt.ts --kuvos --fran "$FRAN" --till "$TILL"
            node --experimental-strip-types kuvos/efterhalkan.ts
            echo '```'
          } 2>&1 | grep --line-buffered -v ExperimentalWarning | tee -a "$GITHUB_STEP_SUMMARY"
      # KALIBRERINGEN (regel D, DECISIONS #425, #468) — läser utfall, bara på Bengts ord, efter riktningsprovet. Rutnätet och
      # startvärdena härleds ur sql/028; varje punkt skrivs ut med hela vintern och båda halvorna; skriptet föreslår, Bengt fryser (D6).
      - name: Kalibreringen
        if: ${{ inputs.korflode == 'kalibrering' }}
        shell: bash
        env: { NODE_OPTIONS: "--max-old-space-size=10240" }
        run: |
          { echo '```'; node --experimental-strip-types kuvos/kalibrering.ts; echo '```'; } 2>&1 | grep --line-buffered -v ExperimentalWarning | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Varningarna sparas för tabellen (5d)
        if: ${{ inputs.korflode == 'riktningsprov' }}
        uses: actions/upload-artifact@v4
        with: { name: kuvos-varningar, path: varningar.ndjson, retention-days: 90 }
