# Halkvakt live, utkasten (DECISIONS #937): dagslägets inlägg ritas 30 minuter före passet och väntar i social_utkast,
# där admin.halkvakt.se (Sociala medier → Inlägg) kan ändra texten eller slänga det. halkvakt-live.yml postar det på minut 50.
# Startas av pulsklockan: puls-live-utkast-morgon 04:20, -lunch 10:20 och -kvall 15:20 UTC. Larmen går inte hit (halkvakt-larm.yml).
name: halkvakt-utkast
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency: { group: halkvakt-live, cancel-in-progress: false }

jobs:
  utkast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      # Bilden måste vara pushad innan den skickas — Meta hämtar den via raw.githubusercontent.com.
      - name: Välj händelse och rita bilden
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.47.2 pg@8.13.0
          npx playwright install --with-deps chromium
          node marknadsforing/posta.mjs bild

      - name: Committa bilden och historiken
        run: |
          git config user.name "Halkvakt live"
          git config user.email "motor@halkvakt.dev"
          git add marknadsforing/live-historik.json
          if [ -d marknadsforing/inlagg ]; then git add marknadsforing/inlagg; fi
          git diff --cached --quiet || git commit -m "Halkvakt live: bild $(date -u +%FT%H:%M) [skip ci]"
          git pull --rebase --autostash origin main && git push origin main || { git status --porcelain; exit 1; }

