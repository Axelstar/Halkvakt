# Kodgrinden (kort #52): håller Trafikverkets ConditionCode som grind, så att ordlistan kan
# delas i farlighetsord (larmar alltid) och ytord (larmar bara på kod >= 2)? Mäter kodhålet,
# ordförrådet per kod, premissen "kod 1 bär aldrig farlighetsord" och hur länge en klassning står.
# Helt läsande. Knappen finns kvar för hand.
name: kodgrinden
on:
  # Startas av pulsklockan (Supabase pg_cron, puls-kodgrinden "16 9 * * *" UTC, DECISIONS #734) varje dygn tills C är avgjord.
  # Inte GitHub-cronen: kort #160 och #688. En körning tar ~16 s och är gratis i Actions, eftersom repot är publikt.
  workflow_dispatch:
# Domlarmet (DECISIONS #649) skriver ärenden; inget annat behöver token.
permissions:
  contents: read
  issues: write
jobs:
  kodgrinden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node --experimental-strip-types scripts/kodgrinden.ts --sjalvtest
      # shell: bash ger pipefail — annars äter tee exit-koden (läxan i DECISIONS #26).
      - shell: bash
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          node --experimental-strip-types scripts/kodgrinden.ts | tee -a "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/utskrift.txt"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
      # Domlarmet (DECISIONS #649): domraderna i utskriften (scripts/domrad.ts) blir ärenden med etiketten dom,
      # en gång per grind och utfall. Körs även när grinden fällt jobbet — en FALLER ska också larma.
      - name: Domlarmet (#649)
        if: ${{ !cancelled() }}
        run: node --experimental-strip-types scripts/domlarm.ts "$RUNNER_TEMP/utskrift.txt"
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
