name: kandidatbrytaren
# Kandidatens brytare (NIVA2-LIVE steg 13, DECISIONS #562 punkt 5, #578). En av Bengt och Axel kan tysta kandidaten; att starta igen
# kräver båda. Vem som trycker tas ur GitHub-kontot (github.actor), aldrig ur ett fält — scripts/kandidatbrytaren.ts avvisar andra
# konton. Claude trycker med Bengts konto och räknas som Bengt. Ändras läget publiceras lägesfilen direkt.
on:
  workflow_dispatch:
    inputs:
      atgard:
        description: "las = läs läget · tysta = stäng av kandidaten (en av er räcker) · starta = slå på igen (kräver båda)"
        type: choice
        default: las
        options: [las, tysta, starta]
concurrency: { group: kandidatbrytaren, cancel-in-progress: false }
jobs:
  brytaren:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - shell: bash
        env:
          DATABASE_URL: "${{ secrets.DATABASE_URL }}"
          ATGARD: "${{ inputs.atgard }}"
          AKTOR: "${{ github.actor }}"
        run: |
          set -euo pipefail
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          node --experimental-strip-types scripts/kandidatbrytaren.ts "$ATGARD" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
