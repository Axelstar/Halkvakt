# Grind V-A (kort #42 steg 3): bär påståendet "regn framöver" alls? Leave-one-out mot
# regnarkivet med domspärr — under ≥200 fall i 0–10 km skrivs ingen dom ut. Regntröskeln
# SÄTTS inte här utan faller ur mätningen: kandidattrösklar sveps och den lägsta som
# klarar V-A1/V-A2 är svaret. Självtest med känd sanning före den skarpa körningen.
name: grind-v-a
on:
  schedule:
    - cron: "20 7 * * 1"   # måndagar, sist i mätserien (efter hojd-prov 07:00)
  workflow_dispatch:
    inputs:
      dagar:
        description: "Dagar bakåt"
        default: "30"
jobs:
  grind-v-a:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node --experimental-strip-types publish/grind-v-a.ts --sjalvtest
      # shell: bash ger pipefail — annars äter tee exit-koden (läxan i DECISIONS #26).
      - shell: bash
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          node --experimental-strip-types publish/grind-v-a.ts "${{ inputs.dagar || '30' }}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
