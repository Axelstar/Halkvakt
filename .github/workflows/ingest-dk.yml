name: ingest-dk
on:
  # CRON BORTTAGEN (kort #53): pulsklockan är klockan, och GitHub-cronen
  # levererade bara 40 % av bokad takt (#70) medan den kostade full minut per
  # körning. Healthcheck.yml behåller sin cron som oberoende sista utpost.
  workflow_dispatch:
concurrency: { group: ingest-dk, cancel-in-progress: false }
jobs:
  dk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: DMI + trafikkort → dk.* (skuggarkiv, inga användare)
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
        run: node --experimental-strip-types ingest/dk.ts
