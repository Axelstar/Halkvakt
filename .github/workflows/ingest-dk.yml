name: ingest-dk
on:
  schedule:
    - cron: "12,42 * * * *"
  workflow_dispatch:
concurrency: { group: ingest-dk, cancel-in-progress: false }
jobs:
  dk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: DMI + trafikkort → dk.* (skuggarkiv, inga användare)
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
        run: node --experimental-strip-types ingest/dk.ts
