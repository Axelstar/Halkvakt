name: deploy-supabase
# Kort #78 (8/9 2026): deploy av edge functions UTAN Axels terminal. 8/9 låg tre fixar
# (manifest, weather_latest, kartlagren) färdiga på main i timmar medan appen förkastade
# varje snapshot — enda deploy-vägen var Axels dator. Den här knappen är den andra vägen.
#
# Kräver EN hemlighet i GitHub Secrets: SUPABASE_ACCESS_TOKEN (Supabase → Account →
# Access Tokens, "Halkvakt deploy"). Saknas den fäller jobbet med tydligt fel, inget annat.
# --no-verify-jwt: funktionerna vaktar sig själva med INGEST_KEY-headern (pg_cron skickar
# den), en JWT-spärr hade stängt ute klockan. Deployar aldrig ur fas: bundlarna kontrolleras
# mot källorna först. Beviset för publicera är INTE deploy-kvittot utan nästa commit i
# kartrepot: manifestets live-sha lika med sha256 av live.json (CLAUDE.md-läxan 8/9).
on:
  workflow_dispatch:
    inputs:
      funktion:
        description: "Vilken funktion"
        type: choice
        default: publicera
        options: [publicera, ingest-live, vakthund, skuggmotor, skuggrapport, alla]
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Bundlarna i synk med källorna (deploya aldrig ur fas)
        run: |
          node --experimental-strip-types scripts/bundle-publicera.ts --check
          node --experimental-strip-types scripts/bundle-skuggmotor.ts --check
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Deploy
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: "${{ secrets.SUPABASE_ACCESS_TOKEN }}"
          FUNKTION: "${{ inputs.funktion }}"
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN saknas i GitHub Secrets — kort #78, Axel lägger in den"; exit 1
          fi
          if [ "$FUNKTION" = alla ]; then F="publicera ingest-live vakthund skuggmotor skuggrapport"; else F="$FUNKTION"; fi
          for f in $F; do
            echo "== deploy $f"
            supabase functions deploy "$f" --project-ref xmpfztykhyvhmrzsnjrc --no-verify-jwt
            echo "- \`$f\` deployad $(date -u +%FT%TZ) från $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "BEVIS (inte det här kvittot): nästa :x0-commit i Axelstar/halkvakt-karta — manifestets live-sha = sha256(live.json); på :00/:30 nio filer." >> "$GITHUB_STEP_SUMMARY"
