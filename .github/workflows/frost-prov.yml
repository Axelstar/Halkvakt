# Frost-provet (tavelkort "Frost-ankare (NO)"): krymper Norrlandsluckan med norska
# Frost-stationer? Manuell knapp; resultat på Summary-sidan.
name: frost-prov
on:
  workflow_dispatch: {}
jobs:
  prov:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # shell: bash ger pipefail — annars äter tee exit-koden (tee-läxan, DECISIONS #26).
      - shell: bash
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          node --experimental-strip-types scripts/frost-prov.ts | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
        env: { FROST_CLIENT_ID: "${{ secrets.FROST_CLIENT_ID }}" }
