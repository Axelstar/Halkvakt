# Cellmätningen (kort #42 steg 0b): regnets dekorrelation per avståndsband ur arkivets
# ja/nej-flaggor. Körs på knapp; självtest med känd sanning (svepta celler, teorikurva)
# FÖRE den skarpa körningen, resultatet på Summary-sidan (grind-a-mönstret).
name: cell-matning
on:
  workflow_dispatch:
    inputs:
      dagar:
        description: "Dagar bakåt"
        default: "60"
jobs:
  cell-matning:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node --experimental-strip-types scripts/cell-matning.ts --sjalvtest
      # shell: bash ger pipefail — annars äter tee exit-koden (läxan i DECISIONS #26).
      - shell: bash
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          node --experimental-strip-types scripts/cell-matning.ts "${{ inputs.dagar || '60' }}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
