name: bridges
# Kort #82 (9/9 2026): ingen cron. Broar flyttar inte, filen ligger i repot sedan 4/9, och
# 30-dagarsspärren i skriptet bet aldrig i CI (ett färskt checkout ger filen ålder noll) —
# jobbet körde var 6:e timme för att skriva "hoppar över" och debiterades en minut varje gång
# (32 körningar t.o.m. 8/9). Uppdatering = knappen, som tvingar hämtning.
on:
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --experimental-strip-types scripts/fetch-bridges.ts --force
      - name: Commit om filen ändrats
        run: |
          git config user.name "Claude (Halkvakt)"; git config user.email "claude@halkvakt.se"
          git add data/bridges.geojson || true
          git diff --cached --quiet || (git commit -m "data: broar ur OSM (#38)" && git push)
