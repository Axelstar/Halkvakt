name: bridges
on:
  schedule:
    - cron: "23 */6 * * *"   # var 6:e timme tills data/bridges.geojson finns, sedan skippar skriptet i 30 dagar
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --experimental-strip-types scripts/fetch-bridges.ts
      - name: Commit om filen ändrats
        run: |
          git config user.name "Claude (Halkvakt)"; git config user.email "claude@halkvakt.se"
          git add data/bridges.geojson || true
          git diff --cached --quiet || (git commit -m "data: broar ur OSM (#38)" && git push)
