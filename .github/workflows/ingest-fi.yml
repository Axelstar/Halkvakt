name: ingest-fi
on:
  schedule:
    - cron: "7,37 * * * *"   # var 30:e min, förskjutet från Sverige
  workflow_dispatch:
concurrency: { group: ingest-fi, cancel-in-progress: false }
jobs:
  fi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Fintraffic → fi.* (skuggarkiv, inga användare)
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
        run: node --experimental-strip-types ingest/fi.ts
