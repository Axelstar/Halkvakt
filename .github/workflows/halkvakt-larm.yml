# Halkvakt live, larmen (kort #281, DECISIONS #627): de gula inläggen — SMHI-varning och höstens första — när det händer.
# Startas av pulsklockan var 30:e minut (puls-live-larm, :07 och :37, efter publicera :00/:30 som skriver lan.json).
# Larmen räknas inte mot dagslägets tre inlägg per dygn; högst fyra larm per dygn, och samma varning eller samma län
# högst en gång per 20 h. Inget larm ⇒ inget installeras, ritas eller committas (koll-steget tar några sekunder).
name: halkvakt-larm
on:
  workflow_dispatch:
    inputs:
      ikapp:
        description: "Namnet på ett inlägg som nådde Facebook men inte Instagram (t.ex. 2026-10-17-live-2137): postar bara Instagram"
        default: ""
      ikapp_x:
        description: "Namnet på ett inlägg som nådde Facebook men inte X (t.ex. 2026-10-19-lunch): postar bara på X (DECISIONS #645)"
        default: ""

permissions:
  contents: write

# Samma grupp som halkvakt-live: postat.json skrivs av båda, och två samtidiga körningar får aldrig posta på var sin kopia.
concurrency: { group: halkvakt-live, cancel-in-progress: false }

jobs:
  larm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Ta igen Instagram
        if: inputs.ikapp != ''
        env:
          HV_NAMN: ${{ inputs.ikapp }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_IG_ID: ${{ secrets.META_IG_ID }}
        run: |
          fel=0; node marknadsforing/posta.mjs ikapp || fel=$?
          git config user.name "Halkvakt live"
          git config user.email "motor@halkvakt.dev"
          git add marknadsforing/postat.json
          git diff --cached --quiet || git commit -m "Halkvakt live: Instagram ikapp ${HV_NAMN} [skip ci]"
          git pull --rebase --autostash origin main && git push origin main || { git status --porcelain; exit 1; }
          exit $fel

      - name: Ta igen X
        if: inputs.ikapp_x != ''
        env:
          HV_NAMN: ${{ inputs.ikapp_x }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          fel=0; node marknadsforing/posta.mjs ikapp-x || fel=$?
          git config user.name "Halkvakt live"
          git config user.email "motor@halkvakt.dev"
          git add marknadsforing/postat.json
          git diff --cached --quiet || git commit -m "Halkvakt live: X ikapp ${HV_NAMN} [skip ci]"
          git pull --rebase --autostash origin main && git push origin main || { git status --porcelain; exit 1; }
          exit $fel

      - name: Finns ett larm att posta?
        if: inputs.ikapp == '' && inputs.ikapp_x == ''
        id: koll
        run: node marknadsforing/posta.mjs koll

      # Bilden måste vara pushad innan den skickas — Meta hämtar den via raw.githubusercontent.com.
      - name: Rita larmet
        if: steps.koll.outputs.har == 'ja'
        id: bild
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.47.2
          npx playwright install --with-deps chromium
          node marknadsforing/posta.mjs bild --live

      - name: Committa bilden
        if: steps.koll.outputs.har == 'ja'
        run: |
          git config user.name "Halkvakt live"
          git config user.email "motor@halkvakt.dev"
          git add marknadsforing/inlagg
          git diff --cached --quiet || git commit -m "Halkvakt live: larm $(date -u +%FT%H:%M) [skip ci]"
          git pull --rebase --autostash origin main && git push origin main || { git status --porcelain; exit 1; }

      # Utan hemligheterna är steget en torrkörning: texten skrivs i loggen och inget postas.
      - name: Posta
        if: steps.koll.outputs.har == 'ja' && steps.bild.outputs.namn != ''
        env:
          HV_NAMN: ${{ steps.bild.outputs.namn }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_IG_ID: ${{ secrets.META_IG_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          # Kvittot committas även när Instagram faller, annars postar nästa körning Facebook igen (17/10).
          fel=0; node marknadsforing/posta.mjs skicka || fel=$?
          git add marknadsforing/postat.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Halkvakt live: larm postat $(date -u +%FT%H:%M) [skip ci]"
          git pull --rebase --autostash origin main && git push origin main || { git status --porcelain; exit 1; }
          exit $fel
