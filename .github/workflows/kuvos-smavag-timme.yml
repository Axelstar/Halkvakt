name: kuvos-smavag-timme
# SMÅVÄGSRÖSTENS TIMME (DECISIONS #828, kort #647; sql/105; halkvakt-kuvos F54). Startar när ny-kandidat-timme är klar (workflow_run), ett
# eget flöde så att K:s timjobb inte ändras och aldrig kan fällas härifrån. Timfilen ur hinken (kuvos-smavag.yml: PH och den strängare N3 per
# punkt och timme), stationernas PH och ankarna som dagens K, del B (levande.py) för alla småvägspunkter, regel D (smavag_drift.py rader)
# och timmens rader i smavag_live och smavag_korning. Med brytarna av talar ingenting (sql/105, smavag_talar). Sist taktens underlag till
# den privata hinken (halkvakt-kuvos F55): regelns varnande punkter med N3 och radarns medel, eftersom radar_smavag gallras efter två timmar,
# och timmens resor ur det (smavag_takt.py, F50 del B med F55 och F56).
# Saknas timmens PH hoppas timmen grönt. Saknas timfilen är det ett fel (DECISIONS #849): kedjan startas sedan 12/11 vid R + 51 minuter
# och är klar långt före blocket, så en saknad timfil betyder att kedjan inte räknade, och det ska synas. Loggen säger bara klart eller fel
# (#768). Ankarna lämnar aldrig jobbet. Jobbet reserv startar kedjan igen när timfilen för den senaste slottens körning saknas (#859).
on:
  workflow_run:
    workflows: [ny-kandidat-timme]
    types: [completed]
  workflow_dispatch:
    inputs:
      tid:
        description: "timmen, t.ex. 2026-11-15T12:00:00Z — tomt = den timme som pågår just nu (UTC)"
        required: false
        default: ""
concurrency: { group: kuvos-smavag-timme, cancel-in-progress: false }
permissions:
  contents: read
env:
  HINK: kuvos-smavag-2026-27
jobs:
  timme:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15                      # resorna tar omkring en minut (11/11: 50 s på en vanlig dator)
    env:
      GH_TOKEN: "${{ github.token }}"
      NYKAND_VARIANT: t4                     # T4 §4 a (DECISIONS #720): den rättade kandidatens par och kandidatfil
    steps:
      - uses: actions/checkout@v4
      # Fysiken och kuvösen ligger i det privata repot Axelstar/halkvakt-kuvos (DECISIONS #768): koden läggs ovanpå utcheckningen.
      - uses: actions/checkout@v4
        with: { repository: Axelstar/halkvakt-kuvos, token: "${{ secrets.KUVOS_LASNYCKEL }}", path: .kuvos-privat, persist-credentials: false }
      - name: Koden ur det privata repot ovanpå
        run: rsync -a --exclude .git --exclude '/*.md' .kuvos-privat/ ./ && rm -rf .kuvos-privat
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: fysik/requirements.txt }
      - name: Självtesten
        shell: bash
        run: |
          tyst() { "$@" > tyst.log 2>&1 || { echo "::error::föll: ${*:1:3}: $(tail -1 tyst.log | cut -c1-200)"; exit 1; }; }
          tyst node --experimental-strip-types ingest/smavag-live-db.ts --sjalvtest
          tyst node --experimental-strip-types ingest/smavag-regel.ts --sjalvtest
          python3 -m pip install -q $(grep -E '^(numpy|pandas|scipy|scikit-learn|pyarrow)==' fysik/requirements.txt)
          tyst python3 fysik/ny_kandidat/smavag_drift.py --sjalvtest
          tyst python3 fysik/ny_kandidat/smavag_takt.py --sjalvtest
      # Timmen är den K:s timjobb räknade: timjobbets start, nedåt till hel timme. Körningen är den vars block R+6 … R+11 täcker timmen.
      - name: Timmen och timfilen ur hinken
        id: f
        shell: bash
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}", INTID: "${{ inputs.tid }}", STARTAD: "${{ github.event.workflow_run.run_started_at }}" }
        run: |
          set -euo pipefail
          TID="$INTID"
          if [ -z "$TID" ]; then
            if [ -n "$STARTAD" ]; then TID=$(date -u -d "$STARTAD" +%Y-%m-%dT%H:00:00Z); else TID=$(date -u +%Y-%m-%dT%H:00:00Z); fi
          fi
          STAMP=$(node --experimental-strip-types -e 'import("./ingest/metnordic-live.ts").then((m) => console.log(m.korningFor(new Date(process.argv[1]))))' "$TID" 2>/dev/null)
          [ -n "$STAMP" ] || { echo "::error::körningen för timmen gick inte att räkna"; exit 1; }
          echo "TID=$TID" >> "$GITHUB_ENV"
          command -v psql >/dev/null || sudo apt-get -qq install -y postgresql-client
          read -r FN KEY < <(psql "$DATABASE_URL" -At -F ' ' -c "select substring(command from '(https://[a-z0-9]+[.]supabase[.]co)') || '/functions/v1/arkivdump', substring(command from 'x-halkvakt-key[^A-Za-z0-9_-]+([A-Za-z0-9_-]+)') from cron.job where jobname = 'halkvakt-arkivexport'")
          [ "${#KEY}" -ge 32 ] || { echo "::error::nyckeln gick inte att läsa ur cron.job (halkvakt-arkivexport)"; exit 1; }
          echo "::add-mask::$KEY"
          export FN KEY
          set +e
          node -e '
            const { execFileSync } = require("child_process"), fs = require("fs"), [namn, ut] = process.argv.slice(1);
            const curl = (a) => { try { return execFileSync("curl", ["-sS", "--fail", ...a], { maxBuffer: 1 << 30, stdio: ["ignore", "pipe", "ignore"] }); } catch { return null; } };
            const b = curl(["-X", "POST", `${process.env.FN}?lage=kuvos_hamta`, "-H", `x-halkvakt-key: ${process.env.KEY}`, "-H", "Content-Type: application/json", "-d", JSON.stringify({ filer: [namn] })]);
            if (!b) process.exit(3);
            const f = curl([JSON.parse(b).filer[0].url]);
            if (!f) process.exit(1);
            fs.writeFileSync(ut, f);' "$HINK/timmar_$STAMP.csv.gz" timmar.csv.gz
          KOD=$?
          set -e
          [ "$KOD" = 3 ] && { echo "småvägsröstens timme: ingen timfil" | tee -a "$GITHUB_STEP_SUMMARY"; echo "::error::timfilen för timmen saknas i hinken: kedjan (kuvos-smavag) räknade inte körningen"; exit 1; }
          [ "$KOD" = 0 ] || { echo "::error::timfilen gick inte att hämta"; exit 1; }
          echo "klar=ja" >> "$GITHUB_OUTPUT"
      - name: PH, ankarna och lägena
        id: p
        if: ${{ steps.f.outputs.klar == 'ja' }}
        shell: bash
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
        run: |
          tyst() { "$@" > tyst.log 2>&1 || { echo "::error::föll: ${*:1:3}: $(tail -1 tyst.log | cut -c1-200)"; exit 1; }; }
          set +e
          node --experimental-strip-types ingest/ny-kandidat-db.ts ph "$TID" ph.csv > ph.log 2>&1; K1=$?
          python3 fysik/ny_kandidat/smavag_drift.py ph --timmar timmar.csv.gz --tid "$TID" --ut ph-sv.csv > ph-sv.log 2>&1; K2=$?
          set -e
          if [ "$K1" = 3 ] || [ "$K2" = 3 ]; then echo "småvägsröstens timme: ingen PH för timmen" | tee -a "$GITHUB_STEP_SUMMARY"; echo "klar=nej" >> "$GITHUB_OUTPUT"; exit 0; fi
          [ "$K1" = 0 ] && [ "$K2" = 0 ] || { echo "::error::PH gick inte att läsa"; exit 1; }
          # Stationernas rader följer med, eftersom RÅ:s rester räknas ur stationernas eget PH (kandidat_timme.timme), som för storstäderna.
          { head -1 ph.csv; grep -v -E '^(punkt,|v|[BC][0-9]{5},)' ph.csv || true; tail -n +2 ph-sv.csv; } > ph-alla.csv
          tyst node --experimental-strip-types ingest/kandidat-db.ts ankare ankare.csv
          gh release download metnordic-live-2026-27 --pattern metnordic_punkter.csv --dir mn
          tyst node --experimental-strip-types ingest/smavag-live-db.ts lagen punkter-sv.csv
          tail -n +2 mn/metnordic_punkter.csv | grep -v '^v' | cut -d, -f1-3 >> punkter-sv.csv
          echo "klar=ja" >> "$GITHUB_OUTPUT"
      - name: Del B, regel D och timmens rader
        if: ${{ steps.p.outputs.klar == 'ja' }}
        shell: bash
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
        run: |
          tyst() { "$@" > tyst.log 2>&1 || { echo "::error::föll: ${*:1:3}: $(tail -1 tyst.log | cut -c1-200)"; exit 1; }; }
          tyst python3 fysik/ny_kandidat/levande.py --del-b --ph ph-alla.csv --punkter punkter-sv.csv --ankare ankare.csv --tid "$TID" --ut live.csv
          rm -f ankare.csv
          tyst python3 fysik/ny_kandidat/smavag_drift.py rader --live live.csv --timmar timmar.csv.gz --lagen punkter-sv.csv --tid "$TID" --ut rader.csv
          tyst node --experimental-strip-types ingest/smavag-live-db.ts skriv rader.csv "$TID" "$(cat rader.csv.antal)"
          echo "småvägsröstens timme: klart för $TID" | tee -a "$GITHUB_STEP_SUMMARY"
      # Underlaget går bara till den privata hinken, aldrig till en artefakt. Är timmen inte regelns (för gammal eller under 95 % av
      # punkterna) skrivs ingenting; finns filen redan (en omkörning) skrivs ingenting över. Filerna kontrolleras med hinkens ETag
      # (ingest/hinken.ts, DECISIONS #850) i stället för att hämtas tillbaka.
      - name: Taktens underlag och resorna till hinken, kontrollerade
        if: ${{ steps.p.outputs.klar == 'ja' }}
        shell: bash
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
        run: |
          set -euo pipefail
          FIL="underlag_$(date -u -d "$TID" +%Y%m%dT%H).csv"
          set +e
          node --experimental-strip-types ingest/smavag-live-db.ts underlag "$FIL" "$TID" > underlag.log 2>&1
          KOD=$?
          set -e
          if [ "$KOD" = 3 ]; then echo "taktens underlag: timmen är inte regelns" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          [ "$KOD" = 0 ] || { echo "::error::underlaget föll: $(tail -1 underlag.log | cut -c1-200)"; exit 1; }
          gzip -n "$FIL"
          RES="resor_$(date -u -d "$TID" +%Y%m%dT%H).csv.gz"
          read -r FN KEY < <(psql "$DATABASE_URL" -At -F ' ' -c "select substring(command from '(https://[a-z0-9]+[.]supabase[.]co)') || '/functions/v1/arkivdump', substring(command from 'x-halkvakt-key[^A-Za-z0-9_-]+([A-Za-z0-9_-]+)') from cron.job where jobname = 'halkvakt-arkivexport'")
          [ "${#KEY}" -ge 32 ] || { echo "::error::nyckeln gick inte att läsa ur cron.job (halkvakt-arkivexport)"; exit 1; }
          echo "::add-mask::$KEY"
          ladda() { FN="$FN" KEY="$KEY" node --experimental-strip-types ingest/hinken.ts ladda "$1" "$HINK/$1" --finns-ok 2>> hinken.log \
            || { echo "::error::$2 gick inte till hinken"; exit 1; }; echo "$2: klart" | tee -a "$GITHUB_STEP_SUMMARY"; }
          # Underlaget först: det går inte att räkna om när radar_smavag gallrats, men resorna går att dra ur det i efterhand.
          ladda "$FIL.gz" "taktens underlag"
          # Resorna (halkvakt-kuvos F50 del B med F55 och F56): timmens syntetiska resor och röstens besked.
          python3 fysik/ny_kandidat/smavag_takt.py resor --punkter data/vagdata/smavagsrosten-punkter.json --underlag "$FIL.gz" --tid "$TID" --ut "$RES" > resor.log 2>&1 \
            || { echo "::error::resorna föll: $(tail -1 resor.log | cut -c1-200)"; exit 1; }
          ladda "$RES" "resorna"
          rm -f "$FIL.gz" "$RES"
      # Regeln utanför databasen (ingest/smavag-regel.ts, DECISIONS #843, halkvakt-kuvos F57 §9 punkt 3) mot smavag_regel() för samma
      # timme, efter underlaget så att en skillnad aldrig stoppar det. Backtesten räknar underlaget med kopian, så den måste fatta samma
      # beslut som driften. Bara utfallet skrivs, inga punkter eller tal (#768).
      - name: Regeln utanför databasen mot databasens
        if: ${{ steps.p.outputs.klar == 'ja' }}
        shell: bash
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
        run: |
          set +e
          node --experimental-strip-types ingest/smavag-live-db.ts jamfor "$TID" > jamfor.log 2>&1
          KOD=$?
          set -e
          RAD=$(grep -v ExperimentalWarning jamfor.log | tail -1 | cut -c1-200)
          echo "$RAD" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$KOD" = 0 ] || [ "$KOD" = 3 ]; then exit 0; fi
          if echo "$RAD" | grep -q "OLIKA"; then echo "::error::regeln utanför databasen ger ett annat underlag än smavag_regel()"; exit 1; fi
          echo "::error::jämförelsen föll: $RAD"; exit 1
      - name: Ankarna lämnar aldrig jobbet
        if: always()
        run: rm -f ankare.csv
  # RESERVEN FÖR KEDJAN (DECISIONS #859, Bengt 13/11: "Ja, bygg reserven"). Varje timme, oberoende av timjobbet: saknas timfilen för den
  # senaste slottens körning R (pulsklockan, R + 51) startar scripts/smavag-reserv.ts kedjan igen, 45–269 minuter efter slotten och högst
  # tre gånger, så att blocket R+6 … R+11 ändå får sin timfil. 13/11 00–05 UTC saknades den, eftersom körningen 18Z aldrig räknades. Inget
  # startas när en annan körning i MET-kön (kuvos-ny-kandidat-met) kör eller väntar, och ett gh eller en hink som inte svarar startar
  # ingenting. Bara beslutet och körningens stämpel skrivs ut (#768).
  reserv:
    if: ${{ github.event_name == 'workflow_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write   # kedjans körningar och reserven som startar kedjan igen (#859)
    env: { GH_TOKEN: "${{ github.token }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Kedjans timfil, annars kedjan igen
        shell: bash
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/smavag-reserv.ts --sjalvtest 2>&1 | grep -v ExperimentalWarning | tail -1
          NU=$(date -u +%FT%TZ)
          STAMP=$(node --experimental-strip-types scripts/smavag-reserv.ts --stampel "$NU" 2>/dev/null)
          command -v psql >/dev/null || sudo apt-get -qq install -y postgresql-client
          read -r FN KEY < <(psql "$DATABASE_URL" -At -F ' ' -c "select substring(command from '(https://[a-z0-9]+[.]supabase[.]co)') || '/functions/v1/arkivdump', substring(command from 'x-halkvakt-key[^A-Za-z0-9_-]+([A-Za-z0-9_-]+)') from cron.job where jobname = 'halkvakt-arkivexport'")
          [ "${#KEY}" -ge 32 ] || { echo "::error::nyckeln gick inte att läsa ur cron.job (halkvakt-arkivexport)"; exit 1; }
          echo "::add-mask::$KEY"
          set +e
          FN="$FN" KEY="$KEY" node --experimental-strip-types ingest/hinken.ts finns "$HINK/timmar_$STAMP.csv.gz" 2>/dev/null
          KOD=$?
          set -e
          case "$KOD" in
            0) TIMFIL=ja ;;
            3) TIMFIL=nej ;;
            *) echo "Reserven: hinken svarade inte, ingenting startat." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0 ;;
          esac
          upptagna() { gh run list --workflow "$1" --limit 10 --json status -q '[.[] | select(.status != "completed")] | length'; }
          set +e
          G1=$(upptagna kuvos-stad.yml) && G2=$(upptagna kuvos-pilot.yml) && G3=$(upptagna kuvos-smavag.yml) \
            && RES=$(gh run list --workflow kuvos-smavag.yml --limit 10 --json status,conclusion,createdAt \
              | node --experimental-strip-types scripts/smavag-reserv.ts --nu "$NU" --timfil "$TIMFIL" --grannar "$((G1 + G2 + G3))" 2>/dev/null)
          KOD=$?
          set -e
          [ "$KOD" = 0 ] && [ -n "$RES" ] || { echo "Reserven: gh eller skriptet svarade inte, ingenting startat." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; }
          BESLUT="${RES%%$'\t'*}"; SKAL="${RES#*$'\t'}"
          case "$BESLUT" in
            starta)
              gh workflow run kuvos-smavag.yml -f steg=kedjan || { echo "::warning title=RESERV::småvägskedjan gick inte att starta"; exit 0; }
              echo "::warning title=RESERV::småvägskedjan: $SKAL — kedjan startad igen (scripts/smavag-reserv.ts)"
              echo "**RESERV:** $SKAL. Kedjan är startad igen." >> "$GITHUB_STEP_SUMMARY" ;;
            *)
              echo "Reserven: $SKAL." | tee -a "$GITHUB_STEP_SUMMARY" ;;
          esac
