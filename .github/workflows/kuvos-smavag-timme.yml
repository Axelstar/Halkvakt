name: kuvos-smavag-timme
# SMÅVÄGSRÖSTENS TIMME (DECISIONS #828, kort #647; sql/105; halkvakt-kuvos F54). Startar när ny-kandidat-timme är klar (workflow_run), ett
# eget flöde så att K:s timjobb inte ändras och aldrig kan fällas härifrån. Timfilen ur hinken (kuvos-smavag.yml: PH och den strängare N3 per
# punkt och timme), stationernas PH och ankarna som dagens K, del B (levande.py) för alla småvägspunkter, regel D (smavag_drift.py rader)
# och timmens rader i smavag_live och smavag_korning. Med brytarna av talar ingenting (sql/105, smavag_talar).
# Saknas timfilen eller timmens PH hoppas timmen grönt. Loggen säger bara klart eller fel (#768). Ankarna lämnar aldrig jobbet.
on:
  workflow_run:
    workflows: [ny-kandidat-timme]
    types: [completed]
  workflow_dispatch:
    inputs:
      tid:
        description: "timmen, t.ex. 2026-11-15T12:00:00Z — tomt = den timme som pågår just nu (UTC)"
        required: false
        default: ""
concurrency: { group: kuvos-smavag-timme, cancel-in-progress: false }
permissions:
  contents: read
env:
  HINK: kuvos-smavag-2026-27
jobs:
  timme:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: "${{ github.token }}"
      NYKAND_VARIANT: t4                     # T4 §4 a (DECISIONS #720): den rättade kandidatens par och kandidatfil
    steps:
      - uses: actions/checkout@v4
      # Fysiken och kuvösen ligger i det privata repot Axelstar/halkvakt-kuvos (DECISIONS #768): koden läggs ovanpå utcheckningen.
      - uses: actions/checkout@v4
        with: { repository: Axelstar/halkvakt-kuvos, token: "${{ secrets.KUVOS_LASNYCKEL }}", path: .kuvos-privat, persist-credentials: false }
      - name: Koden ur det privata repot ovanpå
        run: rsync -a --exclude .git --exclude '/*.md' .kuvos-privat/ ./ && rm -rf .kuvos-privat
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: fysik/requirements.txt }
      - name: Självtesten
        shell: bash
        run: |
          tyst() { "$@" > tyst.log 2>&1 || { echo "::error::föll: ${*:1:3}: $(tail -1 tyst.log | cut -c1-200)"; exit 1; }; }
          tyst node --experimental-strip-types ingest/smavag-live-db.ts --sjalvtest
          python3 -m pip install -q $(grep -E '^(numpy|pandas|scipy|scikit-learn|pyarrow)==' fysik/requirements.txt)
          tyst python3 fysik/ny_kandidat/smavag_drift.py --sjalvtest
      # Timmen är den K:s timjobb räknade: timjobbets start, nedåt till hel timme. Körningen är den vars block R+6 … R+11 täcker timmen.
      - name: Timmen och timfilen ur hinken
        id: f
        shell: bash
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}", INTID: "${{ inputs.tid }}", STARTAD: "${{ github.event.workflow_run.run_started_at }}" }
        run: |
          set -euo pipefail
          TID="$INTID"
          if [ -z "$TID" ]; then
            if [ -n "$STARTAD" ]; then TID=$(date -u -d "$STARTAD" +%Y-%m-%dT%H:00:00Z); else TID=$(date -u +%Y-%m-%dT%H:00:00Z); fi
          fi
          STAMP=$(node --experimental-strip-types -e 'import("./ingest/metnordic-live.ts").then((m) => console.log(m.korningFor(new Date(process.argv[1]))))' "$TID" 2>/dev/null)
          [ -n "$STAMP" ] || { echo "::error::körningen för timmen gick inte att räkna"; exit 1; }
          echo "TID=$TID" >> "$GITHUB_ENV"
          command -v psql >/dev/null || sudo apt-get -qq install -y postgresql-client
          read -r FN KEY < <(psql "$DATABASE_URL" -At -F ' ' -c "select substring(command from '(https://[a-z0-9]+[.]supabase[.]co)') || '/functions/v1/arkivdump', substring(command from 'x-halkvakt-key[^A-Za-z0-9_-]+([A-Za-z0-9_-]+)') from cron.job where jobname = 'halkvakt-arkivexport'")
          [ "${#KEY}" -ge 32 ] || { echo "::error::nyckeln gick inte att läsa ur cron.job (halkvakt-arkivexport)"; exit 1; }
          echo "::add-mask::$KEY"
          export FN KEY
          set +e
          node -e '
            const { execFileSync } = require("child_process"), fs = require("fs"), [namn, ut] = process.argv.slice(1);
            const curl = (a) => { try { return execFileSync("curl", ["-sS", "--fail", ...a], { maxBuffer: 1 << 30, stdio: ["ignore", "pipe", "ignore"] }); } catch { return null; } };
            const b = curl(["-X", "POST", `${process.env.FN}?lage=kuvos_hamta`, "-H", `x-halkvakt-key: ${process.env.KEY}`, "-H", "Content-Type: application/json", "-d", JSON.stringify({ filer: [namn] })]);
            if (!b) process.exit(3);
            const f = curl([JSON.parse(b).filer[0].url]);
            if (!f) process.exit(1);
            fs.writeFileSync(ut, f);' "$HINK/timmar_$STAMP.csv.gz" timmar.csv.gz
          KOD=$?
          set -e
          [ "$KOD" = 3 ] && { echo "småvägsröstens timme: ingen timfil" | tee -a "$GITHUB_STEP_SUMMARY"; echo "klar=nej" >> "$GITHUB_OUTPUT"; exit 0; }
          [ "$KOD" = 0 ] || { echo "::error::timfilen gick inte att hämta"; exit 1; }
          echo "klar=ja" >> "$GITHUB_OUTPUT"
      - name: PH, ankarna och lägena
        id: p
        if: ${{ steps.f.outputs.klar == 'ja' }}
        shell: bash
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
        run: |
          tyst() { "$@" > tyst.log 2>&1 || { echo "::error::föll: ${*:1:3}: $(tail -1 tyst.log | cut -c1-200)"; exit 1; }; }
          set +e
          node --experimental-strip-types ingest/ny-kandidat-db.ts ph "$TID" ph.csv > ph.log 2>&1; K1=$?
          python3 fysik/ny_kandidat/smavag_drift.py ph --timmar timmar.csv.gz --tid "$TID" --ut ph-sv.csv > ph-sv.log 2>&1; K2=$?
          set -e
          if [ "$K1" = 3 ] || [ "$K2" = 3 ]; then echo "småvägsröstens timme: ingen PH för timmen" | tee -a "$GITHUB_STEP_SUMMARY"; echo "klar=nej" >> "$GITHUB_OUTPUT"; exit 0; fi
          [ "$K1" = 0 ] && [ "$K2" = 0 ] || { echo "::error::PH gick inte att läsa"; exit 1; }
          # Stationernas rader följer med, eftersom RÅ:s rester räknas ur stationernas eget PH (kandidat_timme.timme), som för storstäderna.
          { head -1 ph.csv; grep -v -E '^(punkt,|v|[BC][0-9]{5},)' ph.csv || true; tail -n +2 ph-sv.csv; } > ph-alla.csv
          tyst node --experimental-strip-types ingest/kandidat-db.ts ankare ankare.csv
          gh release download metnordic-live-2026-27 --pattern metnordic_punkter.csv --dir mn
          tyst node --experimental-strip-types ingest/smavag-live-db.ts lagen punkter-sv.csv
          tail -n +2 mn/metnordic_punkter.csv | grep -v '^v' | cut -d, -f1-3 >> punkter-sv.csv
          echo "klar=ja" >> "$GITHUB_OUTPUT"
      - name: Del B, regel D och timmens rader
        if: ${{ steps.p.outputs.klar == 'ja' }}
        shell: bash
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
        run: |
          tyst() { "$@" > tyst.log 2>&1 || { echo "::error::föll: ${*:1:3}: $(tail -1 tyst.log | cut -c1-200)"; exit 1; }; }
          tyst python3 fysik/ny_kandidat/levande.py --del-b --ph ph-alla.csv --punkter punkter-sv.csv --ankare ankare.csv --tid "$TID" --ut live.csv
          rm -f ankare.csv
          tyst python3 fysik/ny_kandidat/smavag_drift.py rader --live live.csv --timmar timmar.csv.gz --lagen punkter-sv.csv --tid "$TID" --ut rader.csv
          tyst node --experimental-strip-types ingest/smavag-live-db.ts skriv rader.csv "$TID" "$(cat rader.csv.antal)"
          echo "småvägsröstens timme: klart för $TID" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Ankarna lämnar aldrig jobbet
        if: always()
        run: rm -f ankare.csv
