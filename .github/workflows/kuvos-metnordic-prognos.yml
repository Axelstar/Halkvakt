# MET Nordics prognoser för kuvösen (kort #308, DECISIONS #518, #519): MET Norways arkiverade MET Nordic-prognoser för vintern 2024/25,
# timstegen 0–29 ur körningarna 00, 06, 12 och 18 UTC, i samma rutor som analysen, till den öppna releasen
# `kuvos-metnordic-prognos-2024-25` (MET Norway, NLOD / CC BY 4.0). Åtta delar om högst 20 dygn, EN åt gången (tjänstens villkor: en
# förbindelse åt gången). En del som redan ligger i releasen hoppas över, så flödet kan köras om. Piloten 11/10: en körning på 2 min.
#
# Utlöses på knapp, och på grenen claude/metnordic-prognos-519 av en push som ändrar kuvos/metnordic-prognos.start (Bengts ja 11/10;
# Axel 11/10 eftermiddag) — ett flöde som bara finns på en gren kan inte knappas förrän det finns på main. Startfilen, inte flödet,
# utlöser, så att en rättelse av flödet aldrig startar en andra körning bredvid en som går (en förbindelse åt gången). Den raden tas
# bort när grenen slås ihop.
# ÅTERUPPTAGNING (11/10 eftermiddag): del 1 nådde jobbets tak efter nio dygn och del 2 föll på arkivets långsamma svar. Varje del
# hämtar nu sina klara dygn ur den senaste artefakten `mnp-<från>` från en tidigare körning och fortsätter där; hämtningen stannar
# själv efter 320 min (MNP_MINUTER) så att artefakten hinner sparas. En del som inte blev klar körs om med en ny push av startfilen.
name: kuvos-metnordic-prognos
on:
  workflow_dispatch:
  push:
    branches: [claude/metnordic-prognos-519]
    paths: [kuvos/metnordic-prognos.start]
concurrency: { group: thredds-metnordic-prognos, cancel-in-progress: false }
permissions:
  contents: write
  actions: read
jobs:
  hamta:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        del:
          - { fran: "2024-10-31", till: "2024-11-19" }
          - { fran: "2024-11-20", till: "2024-12-09" }
          - { fran: "2024-12-10", till: "2024-12-29" }
          - { fran: "2024-12-30", till: "2025-01-18" }
          - { fran: "2025-01-19", till: "2025-02-07" }
          - { fran: "2025-02-08", till: "2025-02-27" }
          - { fran: "2025-02-28", till: "2025-03-19" }
          - { fran: "2025-03-20", till: "2025-03-31" }
    env:
      GH_TOKEN: "${{ github.token }}"
      REL: kuvos-metnordic-prognos-2024-25
      FIL: "metnordic_prognos_${{ matrix.del.fran }}_${{ matrix.del.till }}.csv.gz"
    steps:
      - uses: actions/checkout@v4
      - name: Finns delen redan i releasen?
        id: finns
        shell: bash
        run: |
          if gh release view "$REL" --json assets -q '.assets[].name' 2>/dev/null | grep -qx "$FIL"; then
            echo "ja=1" >> "$GITHUB_OUTPUT"; echo "$FIL finns redan i $REL — hoppas över"; fi
      - uses: actions/setup-node@v4
        if: ${{ steps.finns.outputs.ja != '1' }}
        with: { node-version: 22 }
      - name: Självtestet
        if: ${{ steps.finns.outputs.ja != '1' }}
        run: node --experimental-strip-types kuvos/metnordic-prognos.ts --sjalvtest
      - name: Analysens stationsrutor, summan mot kuvos/metnordic-leverans.json
        if: ${{ steps.finns.outputs.ja != '1' }}
        shell: bash
        run: |
          gh release download kuvos-metnordic-2024-25 --pattern metnordic_stationer.csv --dir mn-in
          node -e '
            const m = require("./kuvos/metnordic-leverans.json"), c = require("crypto"), fs = require("fs");
            const f = m.filer.find((x) => x.fil === "metnordic_stationer.csv");
            const h = c.createHash("sha256").update(fs.readFileSync("mn-in/metnordic_stationer.csv")).digest("hex");
            console.log(`metnordic_stationer.csv: ${h === f.sha256 ? "ok" : "FEL " + h}`); process.exit(h === f.sha256 ? 0 : 1);'
      - name: Dygnen från en tidigare körning (återupptagningen)
        if: ${{ steps.finns.outputs.ja != '1' }}
        shell: bash
        run: |
          mkdir -p mnp/dagar
          id=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=mnp-${{ matrix.del.fran }}&per_page=100" \
            -q '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last | .id // empty')
          if [ -n "$id" ]; then
            gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > tidigare.zip
            unzip -o -q tidigare.zip -d mnp; rm -f tidigare.zip mnp/dagar/*.tmp mnp/metnordic_prognos_*.csv.gz
            for f in mnp/dagar/*.csv.gz; do [ -e "$f" ] || continue; gzip -t "$f" 2>/dev/null || { echo "trasig: $f"; rm -f "$f"; }; done
          fi
          echo "klara dygn från tidigare körning: $(ls mnp/dagar | grep -c 'csv.gz$' || true)"
      - name: Hämtningen
        if: ${{ steps.finns.outputs.ja != '1' }}
        shell: bash
        env: { MNP_MINUTER: "320" }
        run: |
          node --experimental-strip-types kuvos/metnordic-prognos.ts mn-in/metnordic_stationer.csv mnp "${{ matrix.del.fran }}" "${{ matrix.del.till }}" 2>&1 | grep --line-buffered -v ExperimentalWarning
          test "${PIPESTATUS[0]}" = 0
      # Som för analysen (DECISIONS #470): filerna sparas alltid som artefakt först, och releasen får falla utan att något går förlorat.
      - name: Filerna som artefakt
        if: ${{ always() && steps.finns.outputs.ja != '1' }}
        uses: actions/upload-artifact@v4
        with: { name: "mnp-${{ matrix.del.fran }}", path: mnp/, retention-days: 30, if-no-files-found: ignore }
      - name: Till releasen
        if: ${{ steps.finns.outputs.ja != '1' }}
        shell: bash
        run: |
          gh release view "$REL" >/dev/null 2>&1 || gh release create "$REL" --target main --title "Kuvösen: MET Nordics prognoser för vintern 2024/25" \
            --notes "Kort #308, DECISIONS #518, #519. MET Nordic-prognoser (1 km, körningarna 00, 06, 12 och 18 UTC, timstegen 0–29) ur MET Norways operativa arkiv metpparchive, i rutan närmast varje station (samma rutor som kuvos-metnordic-2024-25), 31/10 2024–31/3 2025. Strålningen är räknad om från summan sedan körningens start till timvärden. Källa: MET Norway (NLOD / CC BY 4.0)."
          gh release upload "$REL" "mnp/$FIL"
          { echo '```'; ls -l "mnp/$FIL"; sha256sum "mnp/$FIL"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
