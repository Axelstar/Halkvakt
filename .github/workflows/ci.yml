name: ci
# KASSAN STYR FORMEN (kort #152, 13/9): kassavakten mätte 311 min/dygn och taket 35 USD slår i
# den 21 september — före vintern, och före de mätningar vinterns domar vilar på. Av de hundra
# senaste körningarna 12/9 var FEMTIO ci, det enskilt största flödet, och flera av dem var rena
# dokumentändringar som ändå startade en postgres-tjänst och körde hela sviten.
#
# paths-ignore hoppar över körningen bara när VARJE ändrad fil matchar. En gren som rör kod OCH
# dokument kör alltså fortfarande allt — kontrakts- och beroendegrindarna kan inte smygas förbi
# genom att lägga till en md-fil.
#
# ⚠️ SÄKERT ENBART SÅ LÄNGE ci INTE ÄR EN OBLIGATORISK STATUSKONTROLL. Kontrollerat 13/9: main
# har inget grenskydd alls. Införs grenskydd med `ci` som krav måste den här raden bort samtidigt,
# annars kan en ren dokument-PR aldrig mergas — kontrollen rapporterar då aldrig, och en PR som
# väntar på ett svar som inte kommer ser ut som en trasig gren.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Skuggmotorns motorkopia i synk med engine/src (#34-läxan)
        run: node --experimental-strip-types scripts/bundle-skuggmotor.ts --check
      - name: publicera/index.ts i synk med snapshotkärnan + broarna (#74)
        run: node --experimental-strip-types scripts/bundle-publicera.ts --check
      - name: Kontraktsgrinden — samma tröskelvärde i varje kopia (#144)
        run: |
          node --experimental-strip-types scripts/kontraktsgrinden.ts --sjalvtest
          node --experimental-strip-types scripts/kontraktsgrinden.ts
      - name: Beroendekartan — varje extern källa deklarerad (#147)
        run: |
          node --experimental-strip-types scripts/beroendekartan.ts --sjalvtest
          node --experimental-strip-types scripts/beroendekartan.ts
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
