name: ci
# KASSAN STYR FORMEN (kort #152, 13/9): kassavakten mätte 311 min/dygn och taket 35 USD slår i
# den 21 september — före vintern, och före de mätningar vinterns domar vilar på. Av de hundra
# senaste körningarna 12/9 var FEMTIO ci, det enskilt största flödet, och flera av dem var rena
# dokumentändringar som ändå startade en postgres-tjänst och körde hela sviten.
#
# paths-ignore hoppar över körningen bara när VARJE ändrad fil matchar. En gren som rör kod OCH
# dokument kör alltså fortfarande allt — kontrakts- och beroendegrindarna kan inte smygas förbi
# genom att lägga till en md-fil.
#
# ⚠️ SÄKERT ENBART SÅ LÄNGE ci INTE ÄR EN OBLIGATORISK STATUSKONTROLL. Kontrollerat 13/9: main
# har inget grenskydd alls. Införs grenskydd med `ci` som krav måste den här raden bort samtidigt,
# annars kan en ren dokument-PR aldrig mergas — kontrollen rapporterar då aldrig, och en PR som
# väntar på ett svar som inte kommer ser ut som en trasig gren.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Skuggmotorns motorkopia i synk med engine/src (#34-läxan)
        run: node --experimental-strip-types scripts/bundle-skuggmotor.ts --check
      - name: publicera/index.ts i synk med snapshotkärnan + broarna (#74)
        run: node --experimental-strip-types scripts/bundle-publicera.ts --check
      - name: favoritprov/index.ts i synk med rapportkärnan, motorn och skuggans rutter (#529)
        run: |
          node --experimental-strip-types scripts/bundle-favoritprov.ts --check
          node --experimental-strip-types scripts/favoritprov-synk.ts --sjalvtest
      - name: Kontraktsgrinden — samma tröskelvärde i varje kopia (#144)
        run: |
          node --experimental-strip-types scripts/kontraktsgrinden.ts --sjalvtest
          node --experimental-strip-types scripts/kontraktsgrinden.ts
      - name: Beroendekartan — varje extern källa deklarerad (#147)
        run: |
          node --experimental-strip-types scripts/beroendekartan.ts --sjalvtest
          node --experimental-strip-types scripts/beroendekartan.ts
      - name: Beslutsnumren — ett beslut, ett nummer (#220)
        run: |
          node --experimental-strip-types scripts/beslutsnumren.ts --sjalvtest
          node --experimental-strip-types scripts/beslutsnumren.ts
      - name: Kortkartan — varje öppet kort kopplat till sitt område i stomdokumenten (#445)
        run: |
          node --experimental-strip-types scripts/kortkartan.ts --sjalvtest
          node --experimental-strip-types scripts/kortkartan.ts --check
      - name: Projektkartan — läget per del, underordnat beviset (#446)
        run: |
          node --experimental-strip-types scripts/projektkartan.ts --sjalvtest
          node --experimental-strip-types scripts/projektkartan.ts --check
      - name: Kartsynken — reglerna, framåt-bara och radformen (#447)
        run: |
          node --experimental-strip-types scripts/kartsynk.ts --sjalvtest
          node --experimental-strip-types scripts/kartsynk.ts --check
      # Själva vakten kör i md-vakt.yml, som ser varje ändring i DECISIONS.md; här prövas skriptet när koden ändras.
      - name: Stomvaktens självtest (#484)
        run: node --experimental-strip-types scripts/stomvakten.ts --sjalvtest
      - name: Grind V-B:s självtest — facit enligt §2 och bara räkningar under spärren (#349, #350)
        run: node --experimental-strip-types publish/grind-v-b.ts --sjalvtest
      # Knapparna som granskningen 25/9 ändrade (kort #252, DECISIONS #352) prövas i varje PR, inte bara när de körs.
      - name: Grindarnas självtester — A, vägpunkten, K-A, R-A, S-B, tystnadsfelet (#352), NT (#361)
        run: |
          node --experimental-strip-types publish/grind-a.ts --sjalvtest
          node --experimental-strip-types scripts/hojd-prov.ts --sjalvtest
          node --experimental-strip-types scripts/grind-k-a.ts --sjalvtest
          node --experimental-strip-types scripts/grind-r-a.ts --sjalvtest
          node --experimental-strip-types publish/grind-s-b.ts --sjalvtest
          node --experimental-strip-types scripts/tystnadsfelet.ts --sjalvtest
          node --experimental-strip-types scripts/grind-nt.ts --sjalvtest
          node --experimental-strip-types scripts/uppspelning-facit.ts --sjalvtest
          node --experimental-strip-types scripts/grind-k-b.ts --sjalvtest
          node --experimental-strip-types scripts/grind-r-b.ts --sjalvtest
          node --experimental-strip-types scripts/kodgrinden.ts --sjalvtest
          node --experimental-strip-types scripts/tillfalliga-arkivet.ts --sjalvtest
          node --experimental-strip-types scripts/matningar/kuvos-fysik-2026-10-08.ts --sjalvtest
          node --experimental-strip-types scripts/matningar/kuvos-c8-fingeravtryck-2026-10-08.ts --sjalvtest
          node --experimental-strip-types scripts/matningar/kuvos-blandning-2026-10-08.ts --sjalvtest
          node --experimental-strip-types scripts/matningar/kuvos-blandning-niva2-2026-10-11.ts --sjalvtest
          node --experimental-strip-types scripts/matningar/kuvos-blandning-prognos-2026-10-11.ts --sjalvtest
          node --experimental-strip-types scripts/matningar/kuvos-blandning-vagb-2026-10-13.ts --sjalvtest
          node --experimental-strip-types scripts/matningar/kuvos-blandning-vagb2-rutnat-2026-10-13.ts --sjalvtest
          node --experimental-strip-types scripts/matningar/kuvos-blandning-vagb2-terrang-2026-10-13.ts --sjalvtest
          node --experimental-strip-types scripts/matningar/kuvos-blandning-frysta-2026-10-13.ts --sjalvtest
          node --experimental-strip-types scripts/vagdata-vagnummer.ts --sjalvtest   # DECISIONS #553, Europaväg
          node --experimental-strip-types kuvos/metnordic-prognos.ts --sjalvtest   # DECISIONS #519
          node --experimental-strip-types ingest/metnordic-live.ts --sjalvtest     # DECISIONS #556, steg 1
          node --experimental-strip-types ingest/metnordic-historik.ts --sjalvtest # DECISIONS #556, steg 2
          node --experimental-strip-types scripts/matningar/kuvos-trafik-per-band-2026-10-08.ts --sjalvtest
          node --experimental-strip-types scripts/matningar/kuvos-fysik-givarvakt-2026-10-08.ts --sjalvtest
          node --experimental-strip-types scripts/matningar/kuvos-kallkartan-2026-10-09.ts --sjalvtest
          node --experimental-strip-types scripts/matningar/a2-populationen-2026-10-14.ts --sjalvtest   # DECISIONS #554
          node --experimental-strip-types scripts/testarvakt.ts --sjalvtest
          node --experimental-strip-types scripts/publikvakt.ts --sjalvtest
          node --experimental-strip-types scripts/matningar/regioner.ts --sjalvtest
          node --experimental-strip-types scripts/matningar/kuvos-fysik-regioner-2026-10-09.ts --sjalvtest
          node --experimental-strip-types scripts/publikvakt.ts
          # Fysikkoden är fryst (DECISIONS #508): de fem filerna bär samma sha256 som FYSIKSPARET-SVAR §1, annars är det inte den frysta versionen.
          (cd fysik && sha256sum -c SHA256SUMS)
          node --experimental-strip-types scripts/matningar/kuvos-metnordic-ecmwf-1b-2026-10-09.ts --sjalvtest
          node --experimental-strip-types scripts/matningar/kuvos-fysik-niva2-metnordic-2026-10-09.ts --sjalvtest
      # Nivå 2:s fysikkedja (fysik/niva2/, DECISIONS #509) är Python: självtestet går på syntetiska data, aldrig på Trafikverkets.
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: fysik/requirements.txt }
      - name: Fysikkedjans självtest (fysik/niva2/sjalvtest.py)
        run: |
          python3 -m pip install -q $(grep -E '^(numpy|pandas|scipy|scikit-learn|pyarrow)==' fysik/requirements.txt)
          python3 fysik/niva2/sjalvtest.py
          python3 fysik/niva2/prognos.py --help > /dev/null
          python3 fysik/niva2/kedja.py --help > /dev/null   # skriptets egen start: självtestet sätter sökvägen själv och såg inte att common saknades 11/10
          python3 fysik/blandning/grannar_blandning.py --sjalvtest   # DECISIONS #516
          python3 fysik/live/kandidat_fysik.py --sjalvtest   # kedjan live, del A (DECISIONS #558, kort #343 steg 3)
          python3 fysik/live/kandidat_timme.py --sjalvtest   # kedjan live, del B: grannarna, RÅ och blandningen
          python3 fysik/niva2/vagb.py --help > /dev/null
          python3 fysik/niva2/vagb_terrang.py --help > /dev/null      # DECISIONS #549
          python3 fysik/niva2/frysta.py --help > /dev/null            # DECISIONS #544 punkt 6
          python3 fysik/blandning/vagb_blandning.py --sjalvtest      # DECISIONS #544
          python3 fysik/vagpunkter/vagpunkter.py --sjalvtest          # DECISIONS #553
          python3 fysik/vagpunkter/hojd.py --sjalvtest                # DECISIONS #553, tillägg 13/10
          python3 fysik/vagpunkter/uh_klass.py --sjalvtest            # DECISIONS #553, val (b)
          python3 fysik/vagpunkter/vagpunkter.py prova --fil data/vagdata/vaglagspunkter-sardrag.json   # värdevaktens spann
      # Generatorn gled isär från vektorfilerna tre gånger (31/8, 2/9, 13/9) utan att någon vakt såg det (#195).
      # Den skriver bara filer vars innehåll ändrats och fäller själv på en vektorfil utan scenario.
      - name: Vektorgeneratorn återskapar engine/vectors/ (#202)
        run: |
          node --experimental-strip-types engine/gen-vectors.ts > /dev/null
          if [ -n "$(git status --porcelain --untracked-files=all engine/vectors/)" ]; then
            git status --porcelain --untracked-files=all engine/vectors/
            echo "::error::engine/gen-vectors.ts och engine/vectors/ har glidit isär — ändra scenariot i generatorn i samma commit som vektorfilen (kort #202)"
            exit 1
          fi
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
