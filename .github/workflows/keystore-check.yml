name: keystore-check
on: { workflow_dispatch: }
# Engångsdiagnos: är HV_KEYSTORE_B64 en giltig keystore, och öppnar HV_KEYSTORE_PASS den?
# Skriver ALDRIG ut lösenordet — bara utfall och alias. Raderas när signeringen fungerar.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Avkoda och prova
        env:
          B64: ${{ secrets.HV_KEYSTORE_B64 }}
          PASS: ${{ secrets.HV_KEYSTORE_PASS }}
        run: |
          if [ -z "$B64" ]; then echo "❌ HV_KEYSTORE_B64 är TOM"; exit 1; fi
          if [ -z "$PASS" ]; then echo "❌ HV_KEYSTORE_PASS är TOM"; exit 1; fi
          echo "$B64" | base64 -d > /tmp/k.jks 2>/dev/null || { echo "❌ B64 går inte att avkoda"; exit 1; }
          SIZE=$(stat -c%s /tmp/k.jks)
          echo "✅ Avkodad fil: $SIZE byte"
          if [ "$SIZE" -lt 1000 ]; then echo "❌ För liten för en keystore — hemligheten är trunkerad"; exit 1; fi
          echo "— alias i keystoren —"
          keytool -list -keystore /tmp/k.jks -storepass "$PASS" 2>/dev/null | grep -i "PrivateKeyEntry\|trustedCertEntry" || echo "(kunde inte lista)"
          echo "— kan nyckeln 'halkvakt' läsas med SAMMA lösenord? —"
          if keytool -list -keystore /tmp/k.jks -storepass "$PASS" -alias halkvakt -keypass "$PASS" >/dev/null 2>/tmp/e2; then
            echo "✅ JA — nyckeln halkvakt öppnas med samma lösenord"
          else
            echo "❌ NEJ:"; sed "s/$PASS/***/g" /tmp/e2 | head -2
          fi
          echo "— provar lösenordet —"
          if keytool -list -keystore /tmp/k.jks -storepass "$PASS" 2>/tmp/err; then
            echo "✅ LÖSENORDET ÖPPNAR KEYSTOREN"
            keytool -list -keystore /tmp/k.jks -storepass "$PASS" | grep -i "alias\|PrivateKeyEntry" || true
          else
            echo "❌ Lösenordet öppnar INTE keystoren:"
            sed 's/'"$PASS"'/***/g' /tmp/err | head -3
          fi
