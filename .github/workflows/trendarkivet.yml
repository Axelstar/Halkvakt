# Trendarkivet — kort #88 steg 2. Räknar trendkandidater ur weather_observations och skriver dem
# durabelt, INNAN gallringen (#83) tunnar arkivet till en rad per halvtimme efter tre dygn (sju till 10/10, #511).
# Knapp, inte cron (#85). Ska tryckas inom tre dygn efter varje frostnatt — vakthundens check 5
# larmar vid frost och säger just det.
name: trendarkivet
on:
  workflow_dispatch:
    inputs:
      dagar:
        description: "Fönster i dygn — taket är 3, bortom det har gallringen ätit upplösningen"
        required: false
        default: "3"
      torrkor:
        description: "Torrkörning: räkna och rapportera, skriv inget"
        type: boolean
        default: false
      jamfor:
        description: "Driftvakten: väljer SQL-funktionen och TypeScript samma rader? (skriver inget)"
        type: boolean
        default: false
jobs:
  trendarkivet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node --experimental-strip-types scripts/trendarkivet.ts --sjalvtest
      - name: Arkivera
        env:
          DATABASE_URL: "${{ secrets.DATABASE_URL }}"
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          node --experimental-strip-types scripts/trendarkivet.ts "${{ inputs.dagar || '3' }}" ${{ inputs.torrkor && '--torrkor' || '' }} ${{ inputs.jamfor && '--jamfor' || '' }} | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
