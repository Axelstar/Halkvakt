# GREN kuvos-smhi-filer — engångsväg för releasen (kort #232, DECISIONS #441). Hämtningen i Actions (37034624104) nådde 90-minuterstaket;
# samma filer hämtades i Claudes session 2/10 och läggs här på en egen gren, som tas bort när releasen finns. Main bär hämtningsvägen.
name: kuvos-smhi
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env: { GH_TOKEN: "${{ github.token }}" }
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          if gh release view kuvos-smhi-2024-25 >/dev/null 2>&1; then echo "::error::releasen finns redan"; exit 1; fi
          sha256sum smhi-release/*.csv.gz | tee -a "$GITHUB_STEP_SUMMARY"
          gh release create kuvos-smhi-2024-25 --target main --title "Kuvösen: SMHI för vintern 2024/25" \
            --notes "Steg 4 (kort #232, DECISIONS #441). Radar samplad mot de 818 väglagssegmenten (driftens kärna) och metobs-parametrarna 1, 7, 13, 16, november 2024–mars 2025. Källa: SMHI öppna data (CC BY 4.0). Summorna i kuvos/smhi-leverans.json." \
            smhi-release/*.csv.gz
