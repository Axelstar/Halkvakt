# Grind K-B — frysklassningens uppspelning (kort #309, DECISIONS #363, #510). Läsande knapp, spärrad som standard: utan dom
# skrivs bara räkningar på facitsidan. dom = ja läser B-utfallet och låser trösklarna (§7) — bara på Bengts ord.
name: grind-k-b
on:
  workflow_dispatch:
    inputs:
      dagar:
        description: "Fönster i dygn"
        required: false
        default: "30"
      dom:
        description: "nej = spärrad (bara räkningar). ja = DOMLÄGE, läser utfallet — bara på Bengts ord, när K-C1 är uppfylld."
        type: choice
        default: nej
        options: [nej, ja]
jobs:
  grind-k-b:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node --experimental-strip-types scripts/grind-k-b.ts --sjalvtest
      # shell: bash ger pipefail — annars äter tee exit-koden (läxan i DECISIONS #26).
      - shell: bash
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          node --experimental-strip-types scripts/grind-k-b.ts "${{ inputs.dagar || '30' }}" ${{ inputs.dom == 'ja' && '--dom' || '' }} | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
