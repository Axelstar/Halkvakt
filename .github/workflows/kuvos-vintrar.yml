name: kuvos-vintrar
# FLER VINTRAR (docs/FORREGISTRERING-FLER-VINTRAR.md, DECISIONS #666–#668): den frysta kandidaten NIVÅ 2+BLANDNING (#552) prövad på
# en vinter, utan omträning, i analysläget. Diagnos, ingen dom. Knapp, inte cron.
#   2024-25            bara identitetsprovet (a) och 2024/25:s mått, märkta i urvalet: kuvösens indata, ingenting hämtas ur nätet;
#   2018-19 … 2022-23  förprovet (MET Nordics arkiv måste bära de sju fälten — långvågen finns först från 14/3 2022, läst 22/10),
#                      vinterns indata till den öppna releasen kuvos-vintrar-<vinter> (MET Nordics analys i delar om 15 dygn, en åt
#                      gången och återupptagbart, och ECMWF IFS ur Open-Meteos arkiv), och sedan i ETT jobb: identitetsprovet, tidszonen
#                      och vintern (fysik/vintrar/vinterkedja.py vägrar läsa vintern utan ett klarat identitetsprov i samma körning);
#   samman             de äldre vintrarnas sammanfattningar (de senaste artefakterna) slagna ihop ur summorna, utan att något läses om.
# Trafikverkets filer och modell.pkl hämtas ur hinken som i kuvos.yml och lämnar aldrig jobbet. Sammanfattningen bär bara aggregat.
# Steget langvag-v4 (utkastet till tillägget till FLER-VINTRAR, Ä1, DECISIONS #711): bara långvågen ur MET:s omräkning v4 i den nya
# kandidatens delar för 2018/19–2021/22 (fysik/vintrar/langvag_v4.ts), till samma releaser. Bara öppna data, aldrig VViS och aldrig
# kandidaten: ingenting läses mot den frysta. Vintern ovan används inte; jobben för kedjan hoppas över.
# Med tillägget läses 2018-19 … 2021-22 bara när tillägget är signerat (docs/FORREGISTRERING-FLER-VINTRAR-TILLAGG-2026-10-25.md):
# förprovet kräver långvågens 11 delar i releasen i stället för arkivets fält, MET hämtas inte, och provningen kör
# fysik/vintrar/osakerhet.py, som räknar den frysta med sin vinterkedja (spärren, station 7, långvågen) och jämför med den nyas veck.
on:
  workflow_dispatch:
    inputs:
      vinter:
        description: "2024-25 = identitetsprovet och vintern i urvalet; en äldre vinter läses efter identitetsprovet och tidszonsprovet; samman = vintrarna ihop"
        type: choice
        options: ["2024-25", "2018-19", "2019-20", "2020-21", "2021-22", "2022-23", "samman"]
        default: "2024-25"
      steg:
        description: "kedjan = som förut; langvag-v4 = bara långvågen ur MET:s v4 för 2018/19–2021/22 (tillägget Ä1), vintern ovan används inte"
        type: choice
        options: ["kedjan", "langvag-v4"]
        default: "kedjan"
concurrency: { group: kuvos-vintrar, cancel-in-progress: false }
permissions:
  contents: read
jobs:
  # Körs alltid, så att matrisen nedan alltid har en lista att läsa (för 2024-25 en tom del, och jobben efter hoppas över).
  forprov:
    if: ${{ inputs.steg != 'langvag-v4' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      delar: ${{ steps.prov.outputs.delar }}
    env: { VINTER: "${{ inputs.vinter }}" }
    steps:
      - uses: actions/checkout@v4
      # Fysiken och kuvösen ligger i det privata repot Axelstar/halkvakt-kuvos (DECISIONS #768): koden läggs ovanpå utcheckningen.
      - uses: actions/checkout@v4
        with: { repository: Axelstar/halkvakt-kuvos, token: "${{ secrets.KUVOS_LASNYCKEL }}", path: .kuvos-privat, persist-credentials: false }
      - name: Koden ur det privata repot ovanpå
        run: rsync -a --exclude .git --exclude '/*.md' .kuvos-privat/ ./ && rm -rf .kuvos-privat
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Provtimmarna 31/10, den första i varje månad och 31/3: alla sju fälten på rutnätet 2321 × 1796, annars hämtas ingenting.
      - name: Förprovet — MET Nordics sju fält i arkivet för vintern
        id: prov
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if [ "$VINTER" = "2024-25" ] || [ "$VINTER" = "samman" ]; then echo 'delar=[{"fran":"-","till":"-"}]' >> "$GITHUB_OUTPUT"; echo "$VINTER: ingen hämtning"; exit 0; fi
          case "$VINTER" in 2018-19|2019-20|2020-21|2021-22)
            # Tillägget (DECISIONS #711): signerat, och långvågens delar med listor i releasen; MET:s arkiv prövas inte och hämtas inte.
            node -e '
              const t = require("fs").existsSync(process.argv[1]) ? require("fs").readFileSync(process.argv[1], "utf8") : "";
              const rad = (n) => { const m = new RegExp(`^\\|\\s*${n}\\s*\\|([^|]*)\\|([^|]*)\\|`, "m").exec(t); return !!(m && m[1].trim() && m[2].trim()); };
              const ok = /^\*\*Status: SIGNERA[DT]\b/m.test(t) && rad("Bengt") && rad("Axel");
              console.log(`tillägget: ${t ? (ok ? "signerat" : "INTE signerat") : "finns inte"}`);
              if (!ok) { console.log("::error::2018/19–2021/22 läses bara efter det signerade tillägget (DECISIONS #711)"); process.exit(1); }' \
              docs/FORREGISTRERING-FLER-VINTRAR-TILLAGG-2026-10-25.md | tee -a "$GITHUB_STEP_SUMMARY"
            N=$(gh release view "kuvos-vintrar-$VINTER" --json assets -q '.assets[].name')
            D=$(echo "$N" | grep -c '^metnordic_lw4_.*\.csv\.gz$' || true); L=$(echo "$N" | grep -c '^lw4_.*\.json$' || true)
            echo "långvågens delar i kuvos-vintrar-$VINTER: $D delar, $L listor" | tee -a "$GITHUB_STEP_SUMMARY"
            [ "$D" -eq 11 ] && [ "$L" -eq 11 ] || { echo "::error::långvågens delar saknas — kör steget langvag-v4 först"; exit 1; }
            echo 'delar=[{"fran":"-","till":"-"}]' >> "$GITHUB_OUTPUT"; exit 0;;
          esac
          node --experimental-strip-types fysik/vintrar/metnordic_vinter.ts --sjalvtest 2>&1 | grep -v ExperimentalWarning
          A="${VINTER%-*}"; B=$((A + 1)); RC=0
          node --experimental-strip-types fysik/vintrar/metnordic_vinter.ts --forprov "$A-10-31" "$B-03-31" > forprov.txt 2>&1 || RC=$?
          grep -v ExperimentalWarning forprov.txt
          { echo '```'; grep -v ExperimentalWarning forprov.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          [ "$RC" -eq 0 ] || exit "$RC"
          echo "delar=$(node --experimental-strip-types fysik/vintrar/metnordic_vinter.ts --delar "$A-10-31" "$B-03-31" 15 2>/dev/null)" >> "$GITHUB_OUTPUT"

  # ECMWF IFS (CC BY 4.0) för vinterns 10/10–31/3, en gång, till releasen: fetch_ifs.py:s hämtning med datumen som parametrar.
  ecmwf:
    needs: forprov
    if: ${{ inputs.vinter != '2024-25' && inputs.vinter != 'samman' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions: { contents: write }
    env: { GH_TOKEN: "${{ github.token }}", VINTER: "${{ inputs.vinter }}", REL: "kuvos-vintrar-${{ inputs.vinter }}" }
    steps:
      - uses: actions/checkout@v4
      # Fysiken och kuvösen ligger i det privata repot Axelstar/halkvakt-kuvos (DECISIONS #768): koden läggs ovanpå utcheckningen.
      - uses: actions/checkout@v4
        with: { repository: Axelstar/halkvakt-kuvos, token: "${{ secrets.KUVOS_LASNYCKEL }}", path: .kuvos-privat, persist-credentials: false }
      - name: Koden ur det privata repot ovanpå
        run: rsync -a --exclude .git --exclude '/*.md' .kuvos-privat/ ./ && rm -rf .kuvos-privat
      - name: Finns ECMWF redan i releasen?
        id: finns
        shell: bash
        run: |
          if gh release view "$REL" --json assets -q '.assets[].name' 2>/dev/null | grep -qx "ifs_$VINTER.tar.gz"; then
            echo "ja=1" >> "$GITHUB_OUTPUT"; echo "ifs_$VINTER.tar.gz finns redan i $REL — hoppas över"; fi
      - uses: actions/setup-node@v4
        if: ${{ steps.finns.outputs.ja != '1' }}
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        if: ${{ steps.finns.outputs.ja != '1' }}
        with: { python-version: "3.13", cache: pip, cache-dependency-path: fysik/requirements.txt }
      - name: ECMWF ur Open-Meteos arkiv (fysik/vintrar/hamta_ifs.py), stationerna ur indatan
        if: ${{ steps.finns.outputs.ja != '1' }}
        shell: bash
        run: |
          python3 -m pip install -q $(grep -E '^(numpy|pandas|scipy|scikit-learn|pyarrow)==' fysik/requirements.txt)
          mkdir -p indata && gh release download kuvos-fysik-indata-2024-25 --dir indata
          node -e '
            const m = require("./kuvos/fysik-indata-leverans.json"), c = require("crypto"), fs = require("fs");
            let fel = 0;
            for (const f of m.filer) { const h = c.createHash("sha256").update(fs.readFileSync("indata/" + f.fil)).digest("hex");
              console.log(`${f.fil}: ${h === f.sha256 ? "ok" : "FEL " + h}`); if (h !== f.sha256) fel++; }
            process.exit(fel ? 1 : 0);'
          mkdir -p frusen && for f in indata/*.tar.gz; do tar -xzf "$f" -C frusen; done
          if [ -d frusen/data ]; then mv frusen/data/* frusen/ && rmdir frusen/data; fi
          A="${VINTER%-*}"; B=$((A + 1))
          python3 fysik/vintrar/hamta_ifs.py --stationer frusen/stations.csv --fran "$A-10-10" --till "$B-03-31" --ut ifs | tail -3 | tee -a "$GITHUB_STEP_SUMMARY"
          tar -czf "ifs_$VINTER.tar.gz" ifs && sha256sum "ifs_$VINTER.tar.gz" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Till releasen
        if: ${{ steps.finns.outputs.ja != '1' }}
        shell: bash
        run: |
          gh release view "$REL" >/dev/null 2>&1 || gh release create "$REL" --target main --title "Kuvösen, fler vintrar: indata för $VINTER" \
            --notes "Förregistreringen FLER-VINTRAR (DECISIONS #666–#668). Öppna data: MET Nordics analys (MET Norway, NLOD / CC BY 4.0, metpparchive) i kuvösens rutor (metnordic_stationer.csv i kuvos-metnordic-2024-25) och ECMWF IFS via Open-Meteo (CC BY 4.0). Inga Trafikverksdata."
          gh release upload "$REL" "ifs_$VINTER.tar.gz"

  # MET Nordics analys 31/10–31/3 i delar om 15 dygn, EN åt gången (MET:s villkor), efter mallen metnordic-historik.yml: en del som redan
  # ligger i releasen hoppas över, en del tar vid ur sin senaste artefakt, och hämtningen stannar själv efter 320 min.
  metnordic:
    needs: forprov
    if: ${{ inputs.vinter != '2024-25' && inputs.vinter != 'samman' && !contains('2018-19 2019-20 2020-21 2021-22', inputs.vinter) }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions: { contents: write, actions: read }
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        del: ${{ fromJSON(needs.forprov.outputs.delar) }}
    env:
      GH_TOKEN: "${{ github.token }}"
      VINTER: "${{ inputs.vinter }}"
      REL: "kuvos-vintrar-${{ inputs.vinter }}"
      FIL: "metnordic_analys_${{ matrix.del.fran }}_${{ matrix.del.till }}.csv.gz"
    steps:
      - uses: actions/checkout@v4
      # Fysiken och kuvösen ligger i det privata repot Axelstar/halkvakt-kuvos (DECISIONS #768): koden läggs ovanpå utcheckningen.
      - uses: actions/checkout@v4
        with: { repository: Axelstar/halkvakt-kuvos, token: "${{ secrets.KUVOS_LASNYCKEL }}", path: .kuvos-privat, persist-credentials: false }
      - name: Koden ur det privata repot ovanpå
        run: rsync -a --exclude .git --exclude '/*.md' .kuvos-privat/ ./ && rm -rf .kuvos-privat
      - name: Finns delen redan i releasen?
        id: finns
        shell: bash
        run: |
          if gh release view "$REL" --json assets -q '.assets[].name' 2>/dev/null | grep -qx "$FIL"; then
            echo "ja=1" >> "$GITHUB_OUTPUT"; echo "$FIL finns redan i $REL — hoppas över"; fi
      - uses: actions/setup-node@v4
        if: ${{ steps.finns.outputs.ja != '1' }}
        with: { node-version: 22 }
      - name: Rutorna (kuvos-metnordic-2024-25) och stationerna (kuvos-fysik-indata-2024-25), summorna mot manifesten
        if: ${{ steps.finns.outputs.ja != '1' }}
        shell: bash
        run: |
          mkdir -p mn indata && gh release download kuvos-metnordic-2024-25 --dir mn --pattern metnordic_stationer.csv
          gh release download kuvos-fysik-indata-2024-25 --dir indata
          node -e '
            const c = require("crypto"), fs = require("fs"); let fel = 0;
            const prova = (fil, sha) => { const h = c.createHash("sha256").update(fs.readFileSync(fil)).digest("hex"); console.log(`${fil}: ${h === sha ? "ok" : "FEL " + h}`); if (h !== sha) fel++; };
            prova("mn/metnordic_stationer.csv", require("./kuvos/metnordic-leverans.json").filer.find((f) => f.fil === "metnordic_stationer.csv").sha256);
            for (const f of require("./kuvos/fysik-indata-leverans.json").filer) prova("indata/" + f.fil, f.sha256);
            process.exit(fel ? 1 : 0);'
          mkdir -p frusen && for f in indata/*.tar.gz; do tar -xzf "$f" -C frusen; done
          if [ -d frusen/data ]; then mv frusen/data/* frusen/ && rmdir frusen/data; fi
      - name: Dygnen från en tidigare körning (återupptagningen)
        if: ${{ steps.finns.outputs.ja != '1' }}
        shell: bash
        run: |
          mkdir -p mnv/dagar
          id=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=mnv-$VINTER-${{ matrix.del.fran }}&per_page=100" \
            -q '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last | .id // empty')
          if [ -n "$id" ]; then
            gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > tidigare.zip
            unzip -o -q tidigare.zip -d mnv; rm -f tidigare.zip mnv/dagar/*.tmp mnv/metnordic_analys_*.csv.gz
            for f in mnv/dagar/*.csv.gz; do [ -e "$f" ] || continue; gzip -t "$f" 2>/dev/null || { echo "trasig: $f"; rm -f "$f"; }; done
          fi
          echo "klara dygn från tidigare körning: $(ls mnv/dagar | grep -c 'csv.gz$' || true)"
      - name: Hämtningen
        if: ${{ steps.finns.outputs.ja != '1' }}
        shell: bash
        env: { MNV_MINUTER: "320" }
        run: |
          { echo '```'; node --experimental-strip-types fysik/vintrar/metnordic_vinter.ts --hamta mnv "${{ matrix.del.fran }}" "${{ matrix.del.till }}" \
              --rutor mn/metnordic_stationer.csv --stationer frusen/stations.csv; echo '```'; } 2>&1 | grep --line-buffered -v ExperimentalWarning | tee -a "$GITHUB_STEP_SUMMARY"
          [ -f "mnv/$FIL" ] || { echo "::error::$FIL skrevs inte — tidsbudgeten eller ett fel; tryck igen så tar delen vid"; exit 1; }
      - name: Filerna som artefakt
        if: ${{ always() && steps.finns.outputs.ja != '1' }}
        uses: actions/upload-artifact@v4
        with: { name: "mnv-${{ inputs.vinter }}-${{ matrix.del.fran }}", path: mnv/, retention-days: 30, if-no-files-found: ignore }
      - name: Till releasen
        if: ${{ steps.finns.outputs.ja != '1' }}
        shell: bash
        run: |
          gh release view "$REL" >/dev/null 2>&1 || gh release create "$REL" --target main --title "Kuvösen, fler vintrar: indata för $VINTER" \
            --notes "Förregistreringen FLER-VINTRAR (DECISIONS #666–#668). Öppna data: MET Nordics analys (MET Norway, NLOD / CC BY 4.0, metpparchive) i kuvösens rutor (metnordic_stationer.csv i kuvos-metnordic-2024-25) och ECMWF IFS via Open-Meteo (CC BY 4.0). Inga Trafikverksdata."
          gh release upload "$REL" "mnv/$FIL"
          { echo '```'; ls -l "mnv/$FIL"; sha256sum "mnv/$FIL"; cat "mnv/sammanfattning_${{ matrix.del.fran }}_${{ matrix.del.till }}.json"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"

  provning:
    needs: [forprov, ecmwf, metnordic]
    if: ${{ !cancelled() && needs.forprov.result == 'success' && inputs.vinter != 'samman' && (inputs.vinter == '2024-25' || (needs.ecmwf.result == 'success' && (needs.metnordic.result == 'success' || (needs.metnordic.result == 'skipped' && contains('2018-19 2019-20 2020-21 2021-22', inputs.vinter))))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions: { contents: read, actions: read }
    env: { GH_TOKEN: "${{ github.token }}", VINTER: "${{ inputs.vinter }}", V4: "${{ contains('2018-19 2019-20 2020-21 2021-22', inputs.vinter) && '1' || '' }}" }
    steps:
      - uses: actions/checkout@v4
      # Fysiken och kuvösen ligger i det privata repot Axelstar/halkvakt-kuvos (DECISIONS #768): koden läggs ovanpå utcheckningen.
      - uses: actions/checkout@v4
        with: { repository: Axelstar/halkvakt-kuvos, token: "${{ secrets.KUVOS_LASNYCKEL }}", path: .kuvos-privat, persist-credentials: false }
      - name: Koden ur det privata repot ovanpå
        run: rsync -a --exclude .git --exclude '/*.md' .kuvos-privat/ ./ && rm -rf .kuvos-privat
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: fysik/requirements.txt }
      - name: Självtestet (påhittade data)
        shell: bash
        run: |
          python3 -m pip install -q $(grep -E '^(numpy|pandas|scipy|scikit-learn|pyarrow)==' fysik/requirements.txt)
          (cd fysik && sha256sum -c --quiet SHA256SUMS)
          python3 fysik/vintrar/sjalvtest.py | grep -v '^  '
          python3 fysik/vintrar/osakerhet.py --sjalvtest | grep -v '^  '
      # Hinken som i kuvos.yml: signerade adresser ur arkivdump, nyckeln ur pg_cron:s jobb, maskerad. Rättelsen modell.pkl, leveransen
      # 2/10 (2024/25) och för en äldre vinter dess två filer ur leveransen 21/10; summorna mot manifesten.
      - name: Hinken — modell.pkl och Trafikverkets filer, kontrollsummorna mot manifesten
        shell: bash
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
        run: |
          set -euo pipefail
          command -v psql >/dev/null || sudo apt-get -qq install -y postgresql-client
          read -r FN KEY < <(psql "$DATABASE_URL" -At -F ' ' -c "select substring(command from '(https://[a-z0-9]+[.]supabase[.]co)') || '/functions/v1/arkivdump', substring(command from 'x-halkvakt-key[^A-Za-z0-9_-]+([A-Za-z0-9_-]+)') from cron.job where jobname = 'halkvakt-arkivexport'")
          [ "${#KEY}" -ge 32 ] || { echo "::error::nyckeln gick inte att läsa ur cron.job (halkvakt-arkivexport)"; exit 1; }
          echo "::add-mask::$KEY"
          FILER=$(node -e '
            const v = process.env.VINTER, a = Number(v.slice(0, 4));
            const f = ["kuvos-kandidat-2026-27/modell.pkl", ...require("./kuvos/leverans.json").filer.map((x) => "kuvos-trv-2024-25/" + x.packad)];
            if (v !== "2024-25") f.push(...[`Halkvakt_${a}-2.csv.gz`, `Halkvakt_${a + 1}-1.csv.gz`].map((x) => "kuvos-vvis-2018-24/" + x));
            if (process.env.V4) f.push(`kuvos-kandidat-2027-28/ph_utan-${v}_${v}.npz`);      // tillägget: den nyas veck utan vintern
            console.log(JSON.stringify(f));')
          curl -sS --fail-with-body -X POST "$FN?lage=kuvos_hamta" -H "x-halkvakt-key: $KEY" -H "Content-Type: application/json" -d "{\"filer\":$FILER}" > hamta.json
          mkdir -p hink/v2425 hink/vinter hink/ph
          node -e '
            const { execFileSync } = require("child_process");
            // execFileSync:s fel bär kommandoraden och därmed den signerade adressen: fångas, bara statusen skrivs ut.
            for (const d of require("./hamta.json").filer) {
              const ut = d.fil.endsWith("modell.pkl") ? "modell.pkl" : d.fil.endsWith(".npz") ? "hink/ph/" + d.fil.split("/").pop()
                : (d.fil.startsWith("kuvos-trv-2024-25/") ? "hink/v2425/" : "hink/vinter/") + d.fil.split("/").pop();
              try { execFileSync("curl", ["-sS", "--fail", "-o", ut, d.url], { stdio: ["ignore", "ignore", "ignore"] }); }
              catch (e) { console.error(`hämtningen av ${d.fil} föll (curl ${e.status})`); process.exit(1); }
            }'
          rm hamta.json
          node -e '
            const c = require("crypto"), fs = require("fs"), v = process.env.VINTER; let fel = 0;
            const prova = (fil, sha, bytes) => { const b = fs.readFileSync(fil), h = c.createHash("sha256").update(b).digest("hex");
              const ok = h === sha && (bytes === undefined || b.length === bytes); fel += !ok; console.log(`${fil}: ${b.length} byte, ${ok ? "sha256 lika manifestet" : "FEL " + h}`); };
            const k = require("./kuvos/kandidat-2026-27.json").filer.find((f) => f.fil === "modell.pkl"); prova("modell.pkl", k.sha256, k.bytes);
            for (const f of require("./kuvos/leverans.json").filer) prova("hink/v2425/" + f.packad, f.packad_sha256);
            if (v !== "2024-25") { const a = Number(v.slice(0, 4)), beh = [`Halkvakt_${a}-2.csv.gz`, `Halkvakt_${a + 1}-1.csv.gz`];
              for (const f of require("./kuvos/vvis-2018-24-leverans.json").filer.filter((x) => beh.includes(x.packad))) prova("hink/vinter/" + f.packad, f.packad_sha256, f.packad_bytes); }
            if (process.env.V4) { const p = require("./kuvos/kandidat-2027-28.json").filer.find((x) => x.fil === `ph_utan-${v}_${v}.npz`);
              prova("hink/ph/" + p.fil, p.sha256, p.bytes); }
            process.exit(fel ? 1 : 0);' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Releaserna — indatan, MET Nordic 2024/25 och vinterns indata
        shell: bash
        run: |
          mkdir -p indata mn2425
          gh release download kuvos-fysik-indata-2024-25 --dir indata
          gh release download kuvos-metnordic-2024-25 --dir mn2425 --pattern 'metnordic_2024-25.csv.gz'
          node -e '
            const c = require("crypto"), fs = require("fs"); let fel = 0;
            const prova = (fil, sha) => { const h = c.createHash("sha256").update(fs.readFileSync(fil)).digest("hex"); console.log(`${fil}: ${h === sha ? "ok" : "FEL " + h}`); if (h !== sha) fel++; };
            for (const f of require("./kuvos/fysik-indata-leverans.json").filer) prova("indata/" + f.fil, f.sha256);
            prova("mn2425/metnordic_2024-25.csv.gz", require("./kuvos/metnordic-leverans.json").filer.find((f) => f.fil === "metnordic_2024-25.csv.gz").sha256);
            process.exit(fel ? 1 : 0);' | tee -a "$GITHUB_STEP_SUMMARY"
          mkdir -p frusen && for f in indata/*.tar.gz; do tar -xzf "$f" -C frusen; done
          if [ -d frusen/data ]; then mv frusen/data/* frusen/ && rmdir frusen/data; fi
          echo "indata: $(ls frusen | tr '\n' ' ') · ifs $(ls frusen/ifs | wc -l) stationer"
          if [ "$VINTER" != "2024-25" ]; then
            mkdir -p rel && gh release download "kuvos-vintrar-$VINTER" --dir rel
            tar -xzf "rel/ifs_$VINTER.tar.gz" -C rel
            { echo '```'; (cd rel && sha256sum ./*.gz); echo "ECMWF: $(ls rel/ifs | wc -l) stationer"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Den nya kandidatens tal per vinter (nykand-samman), för tilläggets jämförelse
        if: ${{ env.V4 == '1' }}
        shell: bash
        run: |
          id=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=nykand-samman&per_page=100" -q '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last | .id // empty')
          [ -n "$id" ] || { echo "::error::artefakten nykand-samman saknas"; exit 1; }
          mkdir -p samman && gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > a.zip && unzip -o -q a.zip -d samman && rm a.zip
          echo "nykand-samman: artefakt $id" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Kedjan — identitetsprovet, tidszonen och vintern
        shell: bash
        run: |
          set -o pipefail
          ARGS=(--vinter "$VINTER" --kandidat kuvos/kandidat-2026-27.json --modell modell.pkl --indata frusen
                --urvalet-vvis hink/v2425 --urvalet-metnordic mn2425/metnordic_2024-25.csv.gz --arbete arbete --ut ut)
          if [ "$V4" = "1" ]; then
            # Tillägget: den frysta med sin vinterkedja (spärren, station 7, långvågen ur v4) och jämförelsen med den nyas veck.
            ARGS+=(--vvis hink/vinter --ifs rel/ifs --smhi smhi --metnordic rel/metnordic_lw4_*.csv.gz --lw4 rel/lw4_*.json
                   --ny-ph "hink/ph/ph_utan-${VINTER}_${VINTER}.npz" --samman samman/samman.json)
            RC=0; python3 fysik/vintrar/osakerhet.py "${ARGS[@]}" 2>&1 | tee kedjan.txt || RC=$?
            cp ut/fryst/kuvos-vintrar-"$VINTER".* ut/ 2>/dev/null || true
            cat ut/osakerhet_*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
            cat ut/kuvos-vintrar-*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
            rm -rf arbete hink modell.pkl
            exit "$RC"
          fi
          if [ "$VINTER" != "2024-25" ]; then ARGS+=(--vvis hink/vinter --ifs rel/ifs --smhi smhi --metnordic rel/metnordic_analys_*.csv.gz); fi
          RC=0; python3 fysik/vintrar/vinterkedja.py "${ARGS[@]}" 2>&1 | tee kedjan.txt || RC=$?
          cat ut/*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          rm -rf arbete hink modell.pkl
          exit "$RC"
      - name: Sammanfattningen (bara aggregat)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with: { name: "kuvos-vintrar-${{ inputs.vinter }}", path: ut/, retention-days: 90, if-no-files-found: ignore }

  # De äldre vintrarna ihop (§4): de senaste sammanfattningarna per vinter, ur summorna. 2024/25 står bredvid, i urvalet, och räknas inte in.
  samman:
    if: ${{ inputs.vinter == 'samman' && inputs.steg != 'langvag-v4' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: read, actions: read }
    env: { GH_TOKEN: "${{ github.token }}" }
    steps:
      - uses: actions/checkout@v4
      # Fysiken och kuvösen ligger i det privata repot Axelstar/halkvakt-kuvos (DECISIONS #768): koden läggs ovanpå utcheckningen.
      - uses: actions/checkout@v4
        with: { repository: Axelstar/halkvakt-kuvos, token: "${{ secrets.KUVOS_LASNYCKEL }}", path: .kuvos-privat, persist-credentials: false }
      - name: Koden ur det privata repot ovanpå
        run: rsync -a --exclude .git --exclude '/*.md' .kuvos-privat/ ./ && rm -rf .kuvos-privat
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: fysik/requirements.txt }
      - name: Sammanfattningarna ur artefakterna, ihop
        shell: bash
        run: |
          python3 -m pip install -q $(grep -E '^(numpy|pandas|scipy|scikit-learn|pyarrow)==' fysik/requirements.txt)
          mkdir -p in
          for V in 2018-19 2019-20 2020-21 2021-22 2022-23 2024-25; do
            id=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=kuvos-vintrar-$V&per_page=100"               -q '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last | .id // empty')
            if [ -n "$id" ]; then gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > a.zip && unzip -o -q a.zip -d in && rm a.zip; echo "$V: artefakt $id"
            else echo "$V: ingen sammanfattning"; fi
          done
          ls in/kuvos-vintrar-*.json >/dev/null 2>&1 || { echo "::error::inga sammanfattningar att slå ihop"; exit 1; }
          python3 fysik/vintrar/vinterkedja.py --samman in/kuvos-vintrar-*.json --ut ut
          cat ut/kuvos-vintrar-samman.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: kuvos-vintrar-samman, path: ut/, retention-days: 90 }

  # Steget langvag-v4 (Ä1, DECISIONS #711): de fyra vintrarnas delar ur releaserna (den fyllda delen före den egna), sedan långvågen
  # del för del, EN åt gången (MET:s villkor). En del vars metnordic_lw4_ redan ligger i releasen hoppas över.
  langvag-plan:
    if: ${{ inputs.steg == 'langvag-v4' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      delar: ${{ steps.plan.outputs.delar }}
    env: { GH_TOKEN: "${{ github.token }}" }
    steps:
      - uses: actions/checkout@v4
      # Fysiken och kuvösen ligger i det privata repot Axelstar/halkvakt-kuvos (DECISIONS #768): koden läggs ovanpå utcheckningen.
      - uses: actions/checkout@v4
        with: { repository: Axelstar/halkvakt-kuvos, token: "${{ secrets.KUVOS_LASNYCKEL }}", path: .kuvos-privat, persist-credentials: false }
      - name: Koden ur det privata repot ovanpå
        run: rsync -a --exclude .git --exclude '/*.md' .kuvos-privat/ ./ && rm -rf .kuvos-privat
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Självtestet och delarna ur releaserna
        id: plan
        shell: bash
        run: |
          set -o pipefail
          node --experimental-strip-types fysik/vintrar/langvag_v4.ts --sjalvtest 2>&1 | grep -v ExperimentalWarning
          mkdir -p listor
          for V in 2018-19 2019-20 2020-21 2021-22; do gh release view "kuvos-vintrar-$V" --json assets -q '.assets[].name' > "listor/$V.txt"; done
          P=$(node --experimental-strip-types fysik/vintrar/langvag_v4.ts --plan listor 2>/dev/null)
          echo "delar=$P" >> "$GITHUB_OUTPUT"
          echo "$P" | node -e 'const p = JSON.parse(require("fs").readFileSync(0, "utf8")); const v = [...new Set(p.map((x) => x.vinter))];
            console.log(`${p.length} delar i ${v.length} vintrar (${v.join(", ")}); ${p.filter((x) => x.kalla.startsWith("metnordic_fylld_")).length} ur tillägget T2:s fyllda delar`);' | tee -a "$GITHUB_STEP_SUMMARY"

  langvag:
    needs: langvag-plan
    if: ${{ inputs.steg == 'langvag-v4' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions: { contents: write }
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        del: ${{ fromJSON(needs.langvag-plan.outputs.delar) }}
    env:
      GH_TOKEN: "${{ github.token }}"
      REL: "kuvos-vintrar-${{ matrix.del.vinter }}"
      KALLA: "${{ matrix.del.kalla }}"
      FIL: "metnordic_lw4_${{ matrix.del.fran }}_${{ matrix.del.till }}.csv.gz"
      LISTA: "lw4_${{ matrix.del.fran }}_${{ matrix.del.till }}.json"
    steps:
      - uses: actions/checkout@v4
      # Fysiken och kuvösen ligger i det privata repot Axelstar/halkvakt-kuvos (DECISIONS #768): koden läggs ovanpå utcheckningen.
      - uses: actions/checkout@v4
        with: { repository: Axelstar/halkvakt-kuvos, token: "${{ secrets.KUVOS_LASNYCKEL }}", path: .kuvos-privat, persist-credentials: false }
      - name: Koden ur det privata repot ovanpå
        run: rsync -a --exclude .git --exclude '/*.md' .kuvos-privat/ ./ && rm -rf .kuvos-privat
      - name: Finns delen redan i releasen?
        id: finns
        shell: bash
        run: |
          if gh release view "$REL" --json assets -q '.assets[].name' | grep -qx "$FIL"; then
            echo "ja=1" >> "$GITHUB_OUTPUT"; echo "$FIL finns redan i $REL — hoppas över"; fi
      - uses: actions/setup-node@v4
        if: ${{ steps.finns.outputs.ja != '1' }}
        with: { node-version: 22 }
      - name: Rutorna (kuvos-metnordic-2024-25), summan mot manifestet, och källdelen ur releasen
        if: ${{ steps.finns.outputs.ja != '1' }}
        shell: bash
        run: |
          mkdir -p mn rel && gh release download kuvos-metnordic-2024-25 --dir mn --pattern metnordic_stationer.csv
          node -e '
            const c = require("crypto"), fs = require("fs");
            const h = c.createHash("sha256").update(fs.readFileSync("mn/metnordic_stationer.csv")).digest("hex");
            const sha = require("./kuvos/metnordic-leverans.json").filer.find((f) => f.fil === "metnordic_stationer.csv").sha256;
            console.log(`mn/metnordic_stationer.csv: ${h === sha ? "ok" : "FEL " + h}`); process.exit(h === sha ? 0 : 1);'
          gh release download "$REL" --dir rel --pattern "$KALLA"
          sha256sum "rel/$KALLA"
      - name: Långvågen
        if: ${{ steps.finns.outputs.ja != '1' }}
        shell: bash
        run: |
          { echo '```'; node --experimental-strip-types fysik/vintrar/langvag_v4.ts --fyll "rel/$KALLA" ut --rutor mn/metnordic_stationer.csv; echo '```'; } 2>&1 \
            | grep --line-buffered -v ExperimentalWarning | tee -a "$GITHUB_STEP_SUMMARY"
          [ -f "ut/$FIL" ] && [ -f "ut/$LISTA" ] || { echo "::error::$FIL skrevs inte — tryck igen så görs delen om"; exit 1; }
      - name: Till releasen
        if: ${{ steps.finns.outputs.ja != '1' }}
        shell: bash
        run: |
          gh release upload "$REL" "ut/$FIL" "ut/$LISTA"
          { echo '```'; ls -l "ut/$FIL"; sha256sum "ut/$FIL"; node -e 'const j = require("./ut/" + process.env.LISTA);
            console.log(JSON.stringify({ ...j, saknas: j.saknas.length > 20 ? j.saknas.slice(0, 20).concat("…") : j.saknas }, null, 1));'; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
