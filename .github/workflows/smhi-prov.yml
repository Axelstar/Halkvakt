# SMHI-provet (Bengts order 1/9): kan SMHI:s luftstationer vara sekundära ankare där
# VViS är glest? Körs på knapp; självtest med känd sanning FÖRE den skarpa körningen,
# resultatet på Summary-sidan (samma mönster som grind-a). Ingen dom fälls här —
# provet upprepas på vinterdata och värderas i tröskeldokumentet.
name: smhi-prov
on:
  # Startas av pulsklockan (Supabase pg_cron, puls-smhi-prov "0 6 * * 1" UTC) — kort #160: GitHub-cronen kom
  # 5–7 h sent 14/9 och levererade 40 % i #70. Tiden: måndagar, 20 min efter grind-a — båda vinterkurvorna växer ihop
  workflow_dispatch:
    inputs:
      dagar:
        description: "Dagar bakåt"
        default: "60"
jobs:
  smhi-prov:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node --experimental-strip-types scripts/smhi-prov.ts --sjalvtest
      # shell: bash ger pipefail — annars äter tee exit-koden (läxan i DECISIONS #26).
      - shell: bash
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          node --experimental-strip-types scripts/smhi-prov.ts "${{ inputs.dagar || '60' }}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
