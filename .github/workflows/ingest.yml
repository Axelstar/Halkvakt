name: ingest
on:
  schedule:
    - cron: "11 * * * *"     # timvis: livemotorn (pg_cron) äger nu minutfärskheten för
                             # situations/roadcondition — GitHub-flödet sköter väder/kameror/
                             # polisen/smhi + fungerar som reserv. Beslut #22 (minutdiet).
  workflow_dispatch: {}
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run ingest
        env:
          TRAFIKVERKET_API_KEY: ${{ secrets.TRAFIKVERKET_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Radarpiloten i skugga (kort #43 steg 3, DECISIONS #60). Eget steg i detta jobb
      # för minutdietens skull (#22) — ryms i redan betalda minuter. continue-on-error
      # under pilotfasen så en SMHI-hicka inte fäller kärningesten; gravstensläxans
      # motvikt är färskhetsraden i loggen + radar-pilot-knappens bevisläge.
      - name: Radarpiloten (skugga, får fallera utan att fälla ingest)
        continue-on-error: true
        run: node --experimental-strip-types ingest/radar.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
