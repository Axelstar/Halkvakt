name: ingest
on:
  schedule:
    - cron: "11 * * * *"     # timvis: livemotorn (pg_cron) äger nu minutfärskheten för
                             # situations/roadcondition — GitHub-flödet sköter väder/kameror/
                             # polisen/smhi + fungerar som reserv. Beslut #22 (minutdiet).
  workflow_dispatch: {}
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run ingest
        env:
          TRAFIKVERKET_API_KEY: ${{ secrets.TRAFIKVERKET_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
