name: ingest
on:
  # CRON BORTTAGEN (kort #53): pulsklockan är klockan (puls-ingest, EN gång i timmen
  # sedan kort #80), och GitHub-cronen levererade bara 40 % av bokad takt (#70).
  workflow_dispatch: {}
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      # Kort #80: väder och olyckor ägs av livemotorn (ingest-live, #72) — den här körningen
      # bär det livemotorn inte gör: kamerorna, vinterarkivets egna kursor (moaten), polisens
      # viltolyckor och SMHI. Utan --skip slåss två skrivare om samma changeid (#73a).
      - run: npm run ingest -- --skip=weather,deviations
        env:
          TRAFIKVERKET_API_KEY: ${{ secrets.TRAFIKVERKET_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Radarpiloten i skugga (kort #43 steg 3, DECISIONS #60). Eget steg i detta jobb
      # för minutdietens skull (#22) — ryms i redan betalda minuter. continue-on-error
      # under pilotfasen så en SMHI-hicka inte fäller kärningesten; gravstensläxans
      # motvikt är färskhetsraden i loggen + radar-pilot-knappens bevisläge.
      - name: Radarpiloten (skugga, får fallera utan att fälla ingest)
        continue-on-error: true
        run: node --experimental-strip-types ingest/radar.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
