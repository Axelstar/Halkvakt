name: publish-map
on:
  schedule:
    - cron: "12,42 * * * *"   # 12 min after each ingest tick
  workflow_dispatch: {}
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node --experimental-strip-types publish/build-map-data.ts out
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
      - name: Push data to public map repo
        run: |
          git clone --depth 1 "https://x-access-token:${{ secrets.PUBLISH_TOKEN }}@github.com/Axelstar/halkvakt-karta.git" karta
          mkdir -p karta/data && cp out/* karta/data/
          cd karta && git add data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git -c user.name="halkvakt-bot" -c user.email="bot@halkvakt.dev" commit -qm "data: $(date -u +%FT%TZ)"
          git push -q
