name: publish-map
# Sedan kort #77 (8/9 2026) publicerar Supabase-funktionen `publicera` BÅDE appens snapshot
# (#74) och kartsajtens lager, var 30:e minut, utan Actions-minuter. Kvar här: de nordiska
# app-snapshoterna (fi/dk), som bara behöver köras när grannlandsingesten gått. Ingen egen
# cron längre — den (*/30 × 2 debiterade minuter) hade ensam ätit oktoberpotten på tre veckor.
on:
  workflow_run:
    workflows: [ingest, ingest-grannar]   # kedjad: publicerar när färsk nordisk data landat
    types: [completed]
  workflow_dispatch: {}
concurrency:
  group: publish-map
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Varken kartlagren (#77) eller data/app/v1/ (#74) byggs här längre: publicera i
      # Supabase är enda skrivaren av båda. Kärnorna är gemensamma: publish/map-core.ts
      # och publish/snapshot-core.ts. Kvar: fi/dk-snapshoterna nedan.
      - run: node --experimental-strip-types publish/build-snapshot-fi.ts out
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
      - run: node --experimental-strip-types publish/build-snapshot-dk.ts out
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
      - run: node --experimental-strip-types publish/push-data.ts out
        env: { PUBLISH_TOKEN: "${{ secrets.PUBLISH_TOKEN }}" }
