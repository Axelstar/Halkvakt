name: publish-map
on:
  workflow_run:
    workflows: [ingest]        # kedjad: publicerar direkt när färsk data landat
    types: [completed]
  schedule:
    - cron: "*/30 * * * *"     # egen klocka: DB är minutfärsk via livemotorn, så webben
                               # hålls ≤ ~35 min gammal oavsett ingest-kedjan. Beslut #22.
  workflow_dispatch: {}
concurrency:
  group: publish-map
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node --experimental-strip-types publish/build-map-data.ts out
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
      - run: node --experimental-strip-types publish/build-snapshot.ts out
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
      - run: node --experimental-strip-types publish/push-data.ts out
        env: { PUBLISH_TOKEN: "${{ secrets.PUBLISH_TOKEN }}" }
