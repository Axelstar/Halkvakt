name: publish-map
on:
  schedule:
    - cron: "12,42 * * * *"
  workflow_dispatch: {}
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node --experimental-strip-types publish/build-map-data.ts out
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
      - run: node --experimental-strip-types publish/build-snapshot.ts out
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
      - run: node --experimental-strip-types publish/push-data.ts out
        env: { PUBLISH_TOKEN: "${{ secrets.PUBLISH_TOKEN }}" }
