# Grind K-A — läsande knapp. Se skriptets huvud för vad den prövar.
name: grind-k-a
on:
  workflow_dispatch:
    inputs:
      dagar:
        description: "Fönster i dygn"
        required: false
        default: "60"

# Domlarmet (DECISIONS #649) skriver ärenden; inget annat behöver token.
permissions:
  contents: read
  issues: write
jobs:
  grind-k-a:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node --experimental-strip-types scripts/grind-k-a.ts --sjalvtest
      # Kort #323 (DECISIONS #513): fönstret ur hinken (de exporterade dygnen) och driften (de senaste) till en tillfällig
      # PostGIS, så att raderingens golv på 14 dygn (#511) inte krymper grinden. Grinden räknar mot den.
      - uses: ./.github/actions/tillfalliga-arkivet
        with: { dagar: "${{ inputs.dagar || '60' }}", drift-url: "${{ secrets.DATABASE_URL }}" }
      # shell: bash ger pipefail — annars äter tee exit-koden (läxan i DECISIONS #26).
      - shell: bash
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          node --experimental-strip-types scripts/grind-k-a.ts "${{ inputs.dagar || '60' }}"  | tee -a "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/utskrift.txt"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
        env: { DATABASE_URL: "${{ env.TILLFALLIG_URL }}" }
      # Domlarmet (DECISIONS #649): domraderna i utskriften (scripts/domrad.ts) blir ärenden med etiketten dom,
      # en gång per grind och utfall. Körs även när grinden fällt jobbet — en FALLER ska också larma.
      - name: Domlarmet (#649)
        if: ${{ !cancelled() }}
        run: node --experimental-strip-types scripts/domlarm.ts "$RUNNER_TEMP/utskrift.txt"
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
