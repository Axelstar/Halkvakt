# Annonstratten (DECISIONS #827, Axel 9/11): Meta-annonsernas dagssiffror och App Store-nedladdningarna för de senaste 14 dygnen
# till Supabase (meta_annons_dag och appstore_dag, sql/102), som annonstratten_stat lägger bredvid Apple Ads och appräknaren.
# GitHub-cronen och inte pulsklockan, som apple-annonser.yml: inget brådskar, och nästa körning skriver om hela fönstret.
# Apples dagsrapport för gårdagen är klar på förmiddagen amerikansk tid, så kvällskörningen är den som får med den.
# Utan nycklarna hoppas respektive källa över med en rad i loggen.
name: annonsdata
on:
  schedule:
    - cron: "41 6 * * *"
    - cron: "41 18 * * *"
  workflow_dispatch:
    inputs:
      torr:
        description: "Hämta och skriv ut, skriv inget i databasen"
        type: boolean
        default: false

permissions:
  contents: read

concurrency: { group: annonsdata, cancel-in-progress: false }

jobs:
  tratten:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Meta och App Store
        env:
          META_ADS_TOKEN: ${{ secrets.META_ADS_TOKEN }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_VENDOR: ${{ vars.ASC_VENDOR }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node marknadsforing/annonsdata.mjs ${{ inputs.torr && '--torr' || '' }}
