name: android
on:
  push:
    branches: [main]
    paths: ["android/**", "engine/vectors/**", "engine/fixtures/**", ".github/workflows/android.yml"]
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Kotlin engine vs shared vectors (the cross-platform contract)
        run: cd android && ./gradlew --no-daemon :engine:test :app:testDebugUnitTest
      - name: Assemble debug APK
        run: cd android && ./gradlew --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: halkvakt-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Bygg signerad release-AAB
        env:
          HV_KEYSTORE_B64: ${{ secrets.HV_KEYSTORE_B64 }}
          HV_KEYSTORE_PASS: ${{ secrets.HV_KEYSTORE_PASS }}
        run: |
          echo "$HV_KEYSTORE_B64" | base64 -d > /tmp/upload.jks
          export HV_KEYSTORE_PATH=/tmp/upload.jks
          cd android && ./gradlew --no-daemon :app:bundleRelease
      - name: Ladda upp release-AAB
        uses: actions/upload-artifact@v4
        with:
          name: halkvakt-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot emulator + run on-device Skåne replay
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            cd android && ./gradlew --no-daemon :app:connectedDebugAndroidTest
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant se.halkvakt.app android.permission.ACCESS_FINE_LOCATION
            adb emu geo fix 18.063 59.334
            adb shell am start -n se.halkvakt.app/.MainActivity
            sleep 6
            adb emu geo fix 18.063 59.334
            sleep 2
            adb emu geo fix 18.064 59.335
            adb shell am start -n se.halkvakt.app/.MainActivity
            sleep 8
            SZ=$(adb shell wm size | tr -d '\r' | awk '{print $NF}'); W=${SZ%x*}; H=${SZ#*x}; Y=$((H*95/100)); echo "skärm ${W}x${H} y=$Y"; adb exec-out screencap -p > /tmp/shot-1-vakten.png; adb shell input tap $((W/2)) $Y; sleep 3; adb exec-out screencap -p > /tmp/shot-2-installningar.png; adb shell input tap $((W*5/6)) $Y; sleep 3; adb exec-out screencap -p > /tmp/shot-3-om.png
      - name: Upload app screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshots
          path: /tmp/shot-*.png
          retention-days: 14
