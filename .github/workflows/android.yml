name: android
on:
  push:
    branches: [main]
    paths: ["android/**", "engine/vectors/**", "engine/fixtures/**", ".github/workflows/android.yml"]
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Kotlin engine vs shared vectors (the cross-platform contract)
        run: cd android && ./gradlew --no-daemon :engine:test
      - name: Assemble debug APK
        run: cd android && ./gradlew --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: halkvakt-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
