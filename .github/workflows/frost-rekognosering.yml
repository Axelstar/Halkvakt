# Frost-rekognoseringen (tavelkort "Frost-ankare (NO)"): manuell knapp.
# Resultatet på körningens Summary-sida.
name: frost-rekognosering
on:
  workflow_dispatch: {}
jobs:
  rekognosering:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # shell: bash ger pipefail — annars äter tee exit-koden (tee-läxan, DECISIONS #26).
      - shell: bash
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          node --experimental-strip-types scripts/frost-rekognosering.ts | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
        env: { FROST_CLIENT_ID: "${{ secrets.FROST_CLIENT_ID }}" }
