# Höjdprovet (Bengts order 1/9, ankarbreddningen 3b): vad återvinner en enkel
# höjdkorrektion där historik saknas (segmentfallet)? Körs på knapp; självtest med
# känd fysik FÖRE den skarpa körningen, resultatet på Summary-sidan (grind-a-mönstret).
# Sedan 23/9 bär skriptet också VÄGPUNKTSGRINDEN (DECISIONS #323): grind A:s mått utan målets
# egen historik, tre kandidater — domen står sist i utskriften.
name: hojd-prov
on:
  # Startas av pulsklockan (Supabase pg_cron, puls-hojd-prov "0 7 * * 1" UTC) — kort #160: GitHub-cronen kom
  # 5–7 h sent 14/9 och levererade 40 % i #70. Tiden: måndagar, sist i mätserien (grind-a 05:40 · smhi 06:00 · v3 06:20 · trv 06:40)
  workflow_dispatch:
    inputs:
      dagar:
        description: "Dagar bakåt"
        default: "60"
jobs:
  hojd-prov:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node --experimental-strip-types scripts/hojd-prov.ts --sjalvtest
      # shell: bash ger pipefail — annars äter tee exit-koden (läxan i DECISIONS #26).
      - if: ${{ inputs.dagar != 'population' && inputs.dagar != 'premisser' && inputs.dagar != 'premisser-fi' }}
        shell: bash
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          node --experimental-strip-types scripts/hojd-prov.ts "${{ inputs.dagar || '60' }}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
      # Vägpunktsgrindens premisser (DECISIONS #405, kort #269): `dagar: premisser` kör bara den förregistrerade mätningen
      # (`premisser-fi` samma sak på det finska arkivet, DECISIONS #407),
      # självtest först. Ingen dom, inga trösklar — läser samma arkiv som grinden.
      # Sedan 2/10 (DECISIONS #435, kort #270 a) går den svenska mätningen också varje måndag, efter höjdprovet. Den LÄSES en
      # gång, tisdag 24/11, på en egen körning (`dagar: premisser`); måndagarnas utskrift är driftbevis, inget utfall.
      - if: ${{ inputs.dagar != 'population' }}
        shell: bash
        run: |
          node --experimental-strip-types scripts/matningar/vagpunkt-premisser-2026-09-30.ts --sjalvtest
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          node --experimental-strip-types scripts/matningar/vagpunkt-premisser-2026-09-30.ts 60 ${{ inputs.dagar == 'premisser-fi' && '--land fi' || '' }} | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
      # Populationsläsningen (kort #266, DECISIONS #399) varje måndag efter provet: vägpunktsgrindens population med arkivet
      # som det är mot den gamla arkivregeln, före och efter 25/9, frysflaggan vid 1 °C och vägviktat. Ingen dom.
      # `dagar: population` kör bara läsningen.
      - if: ${{ inputs.dagar != 'premisser' && inputs.dagar != 'premisser-fi' }}
        shell: bash
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          node --experimental-strip-types scripts/vagpunkt-population.ts 60 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
