# Olyckorna direkt hos Trafikverket (Bengt 24/11): en engångsläsning på en arbetsgren. Läser Trafikverkets API och, i en READ ONLY-
# transaktion, vår kopia; skriver bara antal per dygn. scripts/matningar/olyckor-trv-kontroll-2026-11-24.ts.
name: olyckor-trv-kontroll
on:
  push:
    branches: [claude/project-thread-pnu45o]
    paths: [".github/workflows/olyckor-trv-kontroll.yml", "scripts/matningar/olyckor-trv-kontroll-2026-11-24.ts", "scripts/matningar/polisens-trafikolyckor-2026-11-24.ts"]
  workflow_dispatch: {}
jobs:
  kontroll:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # shell: bash ger pipefail (tee-läxan, DECISIONS #26).
      - shell: bash
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          node --experimental-strip-types scripts/matningar/olyckor-trv-kontroll-2026-11-24.ts | tee -a "$GITHUB_STEP_SUMMARY"
          echo "== Polisens händelser ==" | tee -a "$GITHUB_STEP_SUMMARY"
          node --experimental-strip-types scripts/matningar/polisens-trafikolyckor-2026-11-24.ts | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
        env:
          TRAFIKVERKET_API_KEY: "${{ secrets.TRAFIKVERKET_API_KEY }}"
          DATABASE_URL: "${{ secrets.DATABASE_URL }}"
