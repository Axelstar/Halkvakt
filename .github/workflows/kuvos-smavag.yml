name: kuvos-smavag
# SMÅVÄGSRÖSTENS KEDJA I DRIFT (DECISIONS #828, kort #647; halkvakt-kuvos BESLUT F51–F54). Bengt 11/11: "Ja, båda" och "Ja, bygg". Alla
# punkter i kuvösens punktfil går genom den levande kedjans del A, med filerna oförändrade (fysik/ny_kandidat/smavagar_pilot.ts,
# smavagar_pilot.py och levande.py i det privata repot). Punkterna, särdragen och koden ligger där.
#   historik  45 dygns MET Nordic-analys bakåt, ur MET:s arkiv, till Actions-cachen kuvos-smavag-alla-<dygn>. Pausar runt de levande
#             körningarna. Tar tiden slut, tar nästa körning vid där den slutade (som kuvos-stad).
#   kedjan    startar när kuvos-stad är klar (workflow_run), så att de två aldrig väntar i MET-kön samtidigt: en väntande körning i
#             en concurrency-grupp avbryts av nästa. Dygnen som saknas, körningen, del A i DELAR delar där varje del bara läser sin dels
#             historik, och timfilen med PH och den strängare N3 per punkt och timme (smavag_drift.py timmar) till hinken. Timflödet
#             kuvos-smavag-timme.yml läser den. Inga punkter, tal eller PH i loggen, bara klart eller fel (#768).
# Timfilen ligger i hinken eftersom Actions-cachen kan läsas av en PR från en fork. MET-dygnen är öppna data och får ligga i cachen.
# Källa: MET Norway, MET Nordic (NLOD / CC BY 4.0).
on:
  workflow_run:
    workflows: [kuvos-stad]
    types: [completed]
  workflow_dispatch:
    inputs:
      steg:
        description: "historik (en gång, några timmar) → kedjan (startar sedan själv efter kuvos-stad)"
        type: choice
        options: [historik, kedjan]
        default: historik
concurrency: { group: kuvos-ny-kandidat-met, cancel-in-progress: false }
permissions:
  contents: read
  actions: read      # de levande körningarna för väntan på MET
env:
  PUNKTER: data/vagdata/smavagsrosten-punkter.json
  SARDRAG: data/vagdata/smavagsrosten-punkter-sardrag.csv
  CACHE: kuvos-smavag-dygn-               # ny 11/11: kuvos-smavag-alla-2026-11-08 bär dygn med luckor (smavagskedjan.ts hela)
  HINK: kuvos-smavag-2026-27
jobs:
  historik:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.steg == 'historik' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env: { GH_TOKEN: "${{ github.token }}", REL: metnordic-live-2026-27 }
    steps:
      - uses: actions/checkout@v4
      # Fysiken och kuvösen ligger i det privata repot Axelstar/halkvakt-kuvos (DECISIONS #768): koden läggs ovanpå utcheckningen.
      - uses: actions/checkout@v4
        with: { repository: Axelstar/halkvakt-kuvos, token: "${{ secrets.KUVOS_LASNYCKEL }}", path: .kuvos-privat, persist-credentials: false }
      - name: Koden ur det privata repot ovanpå
        run: rsync -a --exclude .git --exclude '/*.md' .kuvos-privat/ ./ && rm -rf .kuvos-privat
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Självtesten och fönstret
        id: f
        shell: bash
        run: |
          tyst() { "$@" > tyst.log 2>&1 || { echo "::error::föll: ${*:1:3}: $(tail -1 tyst.log | cut -c1-200)"; exit 1; }; }
          tyst node --experimental-strip-types fysik/ny_kandidat/smavagar_pilot.ts --sjalvtest
          tyst node --experimental-strip-types ingest/smavagskedjan.ts --sjalvtest
          echo "fran=$(date -u -d '47 days ago' +%F)" >> "$GITHUB_OUTPUT"; echo "till=$(date -u -d '3 days ago' +%F)" >> "$GITHUB_OUTPUT"
      - name: Dygnen ur cachen (återupptagningen)
        id: c
        uses: actions/cache/restore@v4
        with: { path: mnsv, key: "${{ env.CACHE }}${{ steps.f.outputs.till }}", restore-keys: "${{ env.CACHE }}" }
      - name: Rutorna (första gången), mot releasens ruta
        shell: bash
        run: |
          tyst() { "$@" > tyst.log 2>&1 || { echo "::error::föll: ${*:1:3}: $(tail -1 tyst.log | cut -c1-200)"; exit 1; }; }
          mkdir -p mnsv/dagar
          gh release download "$REL" --dir rel --pattern metnordic_punkter.csv
          [ -f mnsv/pilot_punkter.csv ] || tyst node --experimental-strip-types fysik/ny_kandidat/smavagar_pilot.ts --rutor mnsv/pilot_punkter.csv --punkter "$PUNKTER" --release rel/metnordic_punkter.csv
      - name: Hämtningen
        id: h
        shell: bash
        env: { MNP_MINUTER: "320", FRAN: "${{ steps.f.outputs.fran }}", TILL: "${{ steps.f.outputs.till }}" }
        run: |
          mkdir -p mnsv/dagar
          for f in mnsv/dagar/*.csv.gz; do [ -e "$f" ] || continue; [[ "$(basename "$f" .csv.gz)" < "$FRAN" ]] && rm -f "$f"; done
          set +e
          node --experimental-strip-types fysik/ny_kandidat/smavagar_pilot.ts --historik mnsv "$FRAN" "$TILL" > historik.log 2>&1
          KOD=$?
          set -e
          [ "$KOD" = 3 ] && { echo "::warning::tidsbudgeten tog slut — tryck historik igen, den tar vid där"; echo "klar=nej" >> "$GITHUB_OUTPUT"; exit 0; }
          [ "$KOD" = 0 ] || { echo "::error::historiken föll: $(tail -1 historik.log | cut -c1-200)"; exit 1; }
          set +e
          node --experimental-strip-types ingest/smavagskedjan.ts hela mnsv > hela.log 2>&1
          KOD=$?
          set -e
          [ "$KOD" = 3 ] && { echo "::warning::$(tail -1 hela.log) — tryck historik igen"; echo "klar=nej" >> "$GITHUB_OUTPUT"; exit 0; }
          [ "$KOD" = 0 ] || { echo "::error::kontrollen av dygnen föll: $(tail -1 hela.log | cut -c1-200)"; exit 1; }
          echo "klar=ja" >> "$GITHUB_OUTPUT"
          echo "historiken: klart" | tee -a "$GITHUB_STEP_SUMMARY"
      # MET Nordic är öppna data. Cachen bär punkternas rutor och analysens värden, inga kandidattal. En ny post bara när dygnen ändrats:
      # nyckeln är fönstrets sista dygn, och en ofullständig hämtning sparas under körningens id så att nästa tar vid.
      - name: Dygnen till cachen
        if: ${{ always() && steps.c.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with: { path: mnsv, key: "${{ env.CACHE }}${{ steps.h.outputs.klar == 'ja' && steps.f.outputs.till || format('ofullstandig-{0}', github.run_id) }}" }

  kedjan:
    if: ${{ github.event_name == 'workflow_run' || inputs.steg == 'kedjan' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: "${{ github.token }}"
      NYKAND_VARIANT: t4                     # T4 §4 a (DECISIONS #720): den rättade modellen, som i drift
      DELAR: "15"                            # Bengt 11/11 (#828): omkring 6 000 punkter per del och 5,8 GB, mätt på en fjärdedel
    steps:
      - uses: actions/checkout@v4
      # Fysiken och kuvösen ligger i det privata repot Axelstar/halkvakt-kuvos (DECISIONS #768): koden läggs ovanpå utcheckningen.
      - uses: actions/checkout@v4
        with: { repository: Axelstar/halkvakt-kuvos, token: "${{ secrets.KUVOS_LASNYCKEL }}", path: .kuvos-privat, persist-credentials: false }
      - name: Koden ur det privata repot ovanpå
        run: rsync -a --exclude .git --exclude '/*.md' .kuvos-privat/ ./ && rm -rf .kuvos-privat
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: fysik/requirements.txt }
      - name: Självtesten, kandidatfilen och fönstret
        id: f
        shell: bash
        run: |
          tyst() { "$@" > tyst.log 2>&1 || { echo "::error::föll: ${*:1:3}: $(tail -1 tyst.log | cut -c1-200)"; exit 1; }; }
          tyst node --experimental-strip-types fysik/ny_kandidat/smavagar_pilot.ts --sjalvtest
          tyst node --experimental-strip-types ingest/metnordic-live.ts --sjalvtest
          tyst node --experimental-strip-types ingest/stadskedjan.ts --sjalvtest
          tyst node --experimental-strip-types ingest/smavagskedjan.ts --sjalvtest
          python3 -m pip install -q $(grep -E '^(numpy|pandas|scipy|scikit-learn|pyarrow)==' fysik/requirements.txt)
          (cd fysik && sha256sum -c --quiet SHA256SUMS)
          tyst python3 fysik/live/indata.py --sjalvtest
          tyst python3 fysik/ny_kandidat/smavagar_pilot.py --sjalvtest
          tyst python3 fysik/ny_kandidat/smavag_drift.py --sjalvtest
          tyst python3 -c "import sys; sys.path.insert(0, 'fysik/ny_kandidat'); import levande; c = levande.ladda()"
          echo "fran=$(date -u -d '47 days ago' +%F)" >> "$GITHUB_OUTPUT"; echo "till=$(date -u -d '3 days ago' +%F)" >> "$GITHUB_OUTPUT"
      - name: Historiken ur cachen
        id: c
        uses: actions/cache/restore@v4
        with: { path: mnsv, key: "${{ env.CACHE }}${{ steps.f.outputs.till }}", restore-keys: "${{ env.CACHE }}" }
      - name: Historiken finns?
        id: finns
        shell: bash
        run: |
          if [ ! -f mnsv/pilot_punkter.csv ]; then
            echo "::notice::ingen historik i cachen ännu — tryck kuvos-smavag med steget historik först; kedjan räknar inget den här gången"
            echo "ja=nej" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "ja=ja" >> "$GITHUB_OUTPUT"
      - name: Väntan på MET (de levande körningarna)
        if: ${{ steps.finns.outputs.ja == 'ja' }}
        shell: bash
        run: |
          for i in $(seq 1 90); do
            node --experimental-strip-types fysik/ny_kandidat/smavagar_pilot.ts --vanta 2>&1 | grep -v ExperimentalWarning
            N=$(gh run list --workflow kandidat-fysik.yml --limit 10 --json status -q '[.[] | select(.status != "completed")] | length' 2>/dev/null || echo "?")
            M=$(gh run list --workflow ny-kandidat-fysik.yml --limit 10 --json status -q '[.[] | select(.status != "completed")] | length' 2>/dev/null || echo "?")
            [ "$N" = 0 ] && [ "$M" = 0 ] && { echo "de levande körningarna kör inte — vidare"; exit 0; }
            echo "en levande körning kör eller väntar ($N, $M) — väntar 30 s"; sleep 30
          done
          echo "::error::de levande körningarna har kört i 45 minuter — kedjan hämtar inte samtidigt"; exit 1
      - name: Dygnen som saknas, till cachen
        id: h
        if: ${{ steps.finns.outputs.ja == 'ja' }}
        shell: bash
        env: { MNP_MINUTER: "40", FRAN: "${{ steps.f.outputs.fran }}", TILL: "${{ steps.f.outputs.till }}" }
        run: |
          for f in mnsv/dagar/*.csv.gz; do [ -e "$f" ] || continue; [[ "$(basename "$f" .csv.gz)" < "$FRAN" ]] && rm -f "$f"; done
          set +e
          node --experimental-strip-types fysik/ny_kandidat/smavagar_pilot.ts --historik mnsv "$FRAN" "$TILL" > historik.log 2>&1
          KOD=$?
          set -e
          [ "$KOD" = 3 ] && { echo "::warning::historiken är inte komplett efter tidsbudgeten — tryck historik; kedjan räknar inget nu"; echo "klar=nej" >> "$GITHUB_OUTPUT"; exit 0; }
          [ "$KOD" = 0 ] || { echo "::error::historiken föll: $(tail -1 historik.log | cut -c1-200)"; exit 1; }
          set +e
          node --experimental-strip-types ingest/smavagskedjan.ts hela mnsv > hela.log 2>&1
          KOD=$?
          set -e
          [ "$KOD" = 3 ] && { echo "::warning::$(tail -1 hela.log) — kedjan räknar vidare, och nästa körning hämtar om dem"; echo "hel=nej" >> "$GITHUB_OUTPUT"; }
          [ "$KOD" = 0 ] || [ "$KOD" = 3 ] || { echo "::error::kontrollen av dygnen föll: $(tail -1 hela.log | cut -c1-200)"; exit 1; }
          echo "klar=ja" >> "$GITHUB_OUTPUT"
      - name: Dygnen till cachen
        if: ${{ always() && steps.finns.outputs.ja == 'ja' && steps.c.outputs.cache-hit != 'true' && steps.h.outcome == 'success' }}
        uses: actions/cache/save@v4
        with: { path: mnsv, key: "${{ env.CACHE }}${{ steps.h.outputs.klar == 'ja' && steps.h.outputs.hel != 'nej' && steps.f.outputs.till || format('ofullstandig-{0}', github.run_id) }}" }
      - name: De levande dygnen ur cachen
        if: ${{ steps.h.outputs.klar == 'ja' }}
        uses: actions/cache/restore@v4
        with: { path: mnsv-live, key: "kuvos-smavag-live-${{ github.run_id }}-${{ github.run_attempt }}", restore-keys: kuvos-smavag-live- }
      # metnordic-live.ts --dygn hämtar bara de timmar som saknas. Finns körningen inte i katalogen (kod 3) räknas ingenting den här gången.
      - name: Hämtningarna ur MET
        id: m
        if: ${{ steps.h.outputs.klar == 'ja' }}
        shell: bash
        run: |
          tyst() { "$@" > tyst.log 2>&1 || { echo "::error::föll: ${*:1:3}: $(tail -1 tyst.log | cut -c1-200)"; exit 1; }; }
          for dag in $(date -u -d '2 days ago' +%F) $(date -u -d yesterday +%F) $(date -u +%F); do
            tyst node --experimental-strip-types ingest/metnordic-live.ts --dygn "$dag" --punkter mnsv/pilot_punkter.csv --ut mnsv-live
          done
          ls mnsv-live/dagar | sort | head -n -4 | sed 's|^|mnsv-live/dagar/|' | xargs -r rm -f
          set +e
          node --experimental-strip-types ingest/metnordic-live.ts --korning --punkter mnsv/pilot_punkter.csv --ut sv-korning > korning.log 2>&1
          KOD=$?
          set -e
          [ "$KOD" = 3 ] && { echo "::notice::körningen finns inte i MET:s katalog ännu — kedjan räknar inget den här gången"; echo "klar=nej" >> "$GITHUB_OUTPUT"; exit 0; }
          [ "$KOD" = 0 ] || { echo "::error::körningen gick inte att hämta"; exit 1; }
          echo "STAMP=$(cat sv-korning/korning.txt)" >> "$GITHUB_ENV"
          echo "klar=ja" >> "$GITHUB_OUTPUT"
      - name: De levande dygnen till cachen
        if: ${{ always() && steps.m.outcome == 'success' }}
        uses: actions/cache/save@v4
        with: { path: mnsv-live, key: "kuvos-smavag-live-${{ github.run_id }}-${{ github.run_attempt }}" }
      # Indatan som i kuvos-stad, med punkterna (smavagar_pilot.py indata) i DELAR delar (ingest/stadskedjan.ts indata), och analysdygnen
      # valda som i storstädernas kedja (stadskedjan.ts dygn) och delade per del (ingest/smavagskedjan.ts historik).
      - name: Indatan och historiken per del
        if: ${{ steps.m.outputs.klar == 'ja' }}
        shell: bash
        env: { FRAN: "${{ steps.f.outputs.fran }}" }
        run: |
          tyst() { "$@" > tyst.log 2>&1 || { echo "::error::föll: ${*:1:3}: $(tail -1 tyst.log | cut -c1-200)"; exit 1; }; }
          gh release download kuvos-fysik-indata-2024-25 --dir indata
          node -e '
            const m = require("./kuvos/fysik-indata-leverans.json"), c = require("crypto"), fs = require("fs");
            process.exit(m.filer.every((f) => c.createHash("sha256").update(fs.readFileSync("indata/" + f.fil)).digest("hex") === f.sha256) ? 0 : 1);' \
            || { echo "::error::indatans kontrollsumma stämmer inte"; exit 1; }
          mkdir -p frusen && for f in indata/*.tar.gz; do tar -xzf "$f" -C frusen; done
          if [ -d frusen/data ]; then mv frusen/data/* frusen/ && rmdir frusen/data; fi
          tyst python3 fysik/live/indata.py --frusen frusen --rot . --ut indata-live
          tyst python3 fysik/ny_kandidat/smavagar_pilot.py indata --indata indata-live --punkter "$PUNKTER" --sardrag "$SARDRAG"
          tyst node --experimental-strip-types ingest/stadskedjan.ts dygn sv-analys.txt "$FRAN" "$(date -u +%F)" mnsv mnsv-live
          tyst node --experimental-strip-types ingest/stadskedjan.ts indata indata-live "$DELAR" indata-sv
          tyst node --experimental-strip-types ingest/smavagskedjan.ts historik sv-analys.txt indata-sv "$DELAR" mnsv-del
      # Modellen ur hinken som i ny-kandidat-fysik.yml: adressen och nyckeln ur cron.job, maskade; bara statusen skrivs ut vid fel.
      - name: modell_alla.pkl ur hinken, kontrollsumman mot kandidatfilen
        if: ${{ steps.m.outputs.klar == 'ja' }}
        shell: bash
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
        run: |
          set -euo pipefail
          command -v psql >/dev/null || sudo apt-get -qq install -y postgresql-client
          read -r FN KEY < <(psql "$DATABASE_URL" -At -F ' ' -c "select substring(command from '(https://[a-z0-9]+[.]supabase[.]co)') || '/functions/v1/arkivdump', substring(command from 'x-halkvakt-key[^A-Za-z0-9_-]+([A-Za-z0-9_-]+)') from cron.job where jobname = 'halkvakt-arkivexport'")
          [ "${#KEY}" -ge 32 ] || { echo "::error::nyckeln gick inte att läsa ur cron.job (halkvakt-arkivexport)"; exit 1; }
          echo "::add-mask::$KEY"
          curl -sS --fail-with-body -X POST "$FN?lage=kuvos_hamta" -H "x-halkvakt-key: $KEY" -H "Content-Type: application/json" -d '{"filer":["kuvos-kandidat-2027-28-t4/modell_alla.pkl"]}' > hamta.json
          node -e '
            const k = require("./kuvos/kandidat-2027-28-t4.json"), h = require("./hamta.json").filer, c = require("crypto"), { execFileSync } = require("child_process"), fs = require("fs");
            const curl = (a) => { try { return execFileSync("curl", a, { maxBuffer: 1 << 30, stdio: ["ignore", "pipe", "ignore"] }); } catch (e) { console.error(`hämtningen föll (curl ${e.status})`); process.exit(1); } };
            const b = curl(["-sS", "--fail", h[0].url]); const f = k.filer.find((x) => (x.enhet ?? "alla") === "alla" && x.fil === "modell_alla.pkl");
            const ok = !!f && c.createHash("sha256").update(b).digest("hex") === f.sha256 && b.length === f.bytes;
            fs.writeFileSync("modell_alla.pkl", b); console.log(`modell_alla.pkl ur hinken: ${b.length} byte — ${ok ? "sha256 lika kandidatfilen" : "FEL"}`); process.exit(ok ? 0 : 1);'
          rm hamta.json
      # Del A:s utskrift visas inte i den publika loggen (#768). Varje del läser bara sin dels historik (provet 11/11, #828).
      - name: Del A i delar
        if: ${{ steps.m.outputs.klar == 'ja' }}
        shell: bash
        run: |
          for i in $(seq 1 "$DELAR"); do
            python3 fysik/ny_kandidat/levande.py --del-a --indata "indata-sv$i" --analys mnsv-del$i/dagar/*.csv.gz \
                --korning "sv-korning/metnordic_korning_$STAMP.csv.gz" --modell modell_alla.pkl --kandidat kuvos/kandidat-2027-28-t4.json --ut "ut-sv$i" > "del-a-$i.log" 2>&1 \
              || { echo "::error::Del A, del $i, föll: $(tail -1 "del-a-$i.log" | cut -c1-200)"; exit 1; }
          done
          rm -f modell_alla.pkl
          echo "del A: klart" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Timfilen
        if: ${{ steps.m.outputs.klar == 'ja' }}
        shell: bash
        run: |
          python3 fysik/ny_kandidat/smavag_drift.py timmar --punkter "$PUNKTER" --ph ut-sv*/ny_kandidat_ph_"$STAMP".csv.gz \
              --korning "sv-korning/metnordic_korning_$STAMP.csv.gz" --ut "timmar/timmar_$STAMP.csv.gz" > timmar.log 2>&1 \
            || { echo "::error::timfilen föll: $(tail -1 timmar.log | cut -c1-200)"; exit 1; }
      # Timfilen går bara till den privata hinken, aldrig till en artefakt. Finns den redan (en omkörning) skrivs ingenting över.
      - name: Timfilen till hinken, hämtad tillbaka och jämförd
        if: ${{ steps.m.outputs.klar == 'ja' }}
        shell: bash
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
        run: |
          set -euo pipefail
          command -v psql >/dev/null || sudo apt-get -qq install -y postgresql-client
          read -r FN KEY < <(psql "$DATABASE_URL" -At -F ' ' -c "select substring(command from '(https://[a-z0-9]+[.]supabase[.]co)') || '/functions/v1/arkivdump', substring(command from 'x-halkvakt-key[^A-Za-z0-9_-]+([A-Za-z0-9_-]+)') from cron.job where jobname = 'halkvakt-arkivexport'")
          [ "${#KEY}" -ge 32 ] || { echo "::error::nyckeln gick inte att läsa ur cron.job (halkvakt-arkivexport)"; exit 1; }
          echo "::add-mask::$KEY"
          export FN KEY
          node -e '
            const { execFileSync } = require("child_process"), fs = require("fs"), c = require("crypto"), fil = process.argv[1];
            const sha = (b) => c.createHash("sha256").update(b).digest("hex"), namn = process.env.HINK + "/" + fil.split("/").pop();
            // execFileSync:s fel bär kommandoraden och därmed nyckeln eller den signerade adressen: fångas, bara statusen skrivs ut.
            const curl = (a, vad) => { try { return execFileSync("curl", ["-sS", "--fail", ...a], { maxBuffer: 1 << 30, stdio: ["ignore", "pipe", "ignore"] }); }
              catch (e) { if (vad) { console.error(`${vad} föll (curl ${e.status})`); process.exit(1); } return null; } };
            const anrop = (lage, vad) => { const b = curl(["-X", "POST", `${process.env.FN}?lage=${lage}`, "-H", `x-halkvakt-key: ${process.env.KEY}`,
              "-H", "Content-Type: application/json", "-d", JSON.stringify({ filer: [namn] })], vad); return b && JSON.parse(b); };
            if (anrop("kuvos_hamta")) { console.log("timfilen: klart (fanns redan)"); process.exit(0); }
            const u = anrop("kuvos_ladda_upp", "adressen för uppladdningen").urls[0];
            curl(["-X", "PUT", "-H", "Content-Type: application/octet-stream", "--data-binary", "@" + fil, u], "uppladdningen");
            const h = anrop("kuvos_hamta", "hämtningen tillbaka").filer[0];
            const ok = sha(curl([h.url], "hämtningen")) === sha(fs.readFileSync(fil));
            console.log(ok ? "timfilen: klart" : "timfilen: FEL, i hinken med annat innehåll"); process.exit(ok ? 0 : 1);' "timmar/timmar_$STAMP.csv.gz" | tee -a "$GITHUB_STEP_SUMMARY"
          rm -rf timmar
