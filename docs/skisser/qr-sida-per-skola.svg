<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 760" width="980" height="760" font-family="Helvetica, Arial, sans-serif">
  <!-- Skiss till kort #204 (19/9 2026): skolans namn på QR-sidan — attribution på webben, inte banner i appen. -->
  <rect width="980" height="760" fill="#151515"/>
  <text x="490" y="34" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="bold">Skolans namn på QR-sidan — webbversionen (kort #204)</text>
  <text x="490" y="56" text-anchor="middle" fill="#9a9a9a" font-size="13">Bladet → skolans egen sida → butikerna. Räknaren räknar besök, aldrig personer. Appen vet inget — och behöver inte veta.</text>

  <!-- ===== 1. Bladet ===== -->
  <text x="170" y="92" text-anchor="middle" fill="#dddddd" font-size="14" font-weight="bold">1. Bladet skolan delar ut</text>
  <rect x="50" y="104" width="240" height="340" rx="6" fill="#f7f5ef" stroke="#3a3a3a" stroke-width="2"/>
  <text x="66" y="134" fill="#111111" font-size="10" font-weight="bold" letter-spacing="2">▲ HALKVAKT</text>
  <text x="66" y="160" fill="#111111" font-size="16" font-weight="bold">Varnar innan det blir halt.</text>
  <text x="66" y="180" fill="#444444" font-size="10">En gratis app som säger till med rösten</text>
  <text x="66" y="194" fill="#444444" font-size="10">när vägen framför är hal — innan du är där.</text>
  <!-- QR-symbol -->
  <rect x="100" y="212" width="140" height="140" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <rect x="108" y="220" width="34" height="34" fill="#111111"/><rect x="114" y="226" width="22" height="22" fill="#ffffff"/><rect x="119" y="231" width="12" height="12" fill="#111111"/>
  <rect x="198" y="220" width="34" height="34" fill="#111111"/><rect x="204" y="226" width="22" height="22" fill="#ffffff"/><rect x="209" y="231" width="12" height="12" fill="#111111"/>
  <rect x="108" y="310" width="34" height="34" fill="#111111"/><rect x="114" y="316" width="22" height="22" fill="#ffffff"/><rect x="119" y="321" width="12" height="12" fill="#111111"/>
  <g fill="#111111">
    <rect x="150" y="222" width="6" height="6"/><rect x="162" y="222" width="6" height="6"/><rect x="176" y="228" width="6" height="6"/><rect x="156" y="234" width="6" height="6"/>
    <rect x="168" y="240" width="6" height="6"/><rect x="150" y="246" width="6" height="6"/><rect x="180" y="246" width="6" height="6"/><rect x="110" y="262" width="6" height="6"/>
    <rect x="122" y="268" width="6" height="6"/><rect x="134" y="262" width="6" height="6"/><rect x="146" y="268" width="6" height="6"/><rect x="158" y="262" width="6" height="6"/>
    <rect x="170" y="268" width="6" height="6"/><rect x="182" y="262" width="6" height="6"/><rect x="194" y="268" width="6" height="6"/><rect x="206" y="262" width="6" height="6"/>
    <rect x="218" y="268" width="6" height="6"/><rect x="116" y="280" width="6" height="6"/><rect x="140" y="286" width="6" height="6"/><rect x="164" y="280" width="6" height="6"/>
    <rect x="188" y="286" width="6" height="6"/><rect x="212" y="280" width="6" height="6"/><rect x="128" y="292" width="6" height="6"/><rect x="152" y="298" width="6" height="6"/>
    <rect x="176" y="292" width="6" height="6"/><rect x="200" y="298" width="6" height="6"/><rect x="224" y="292" width="6" height="6"/><rect x="152" y="312" width="6" height="6"/>
    <rect x="164" y="318" width="6" height="6"/><rect x="176" y="312" width="6" height="6"/><rect x="188" y="324" width="6" height="6"/><rect x="200" y="312" width="6" height="6"/>
    <rect x="212" y="324" width="6" height="6"/><rect x="224" y="318" width="6" height="6"/><rect x="158" y="336" width="6" height="6"/><rect x="182" y="336" width="6" height="6"/>
    <rect x="206" y="342" width="6" height="6"/><rect x="224" y="336" width="6" height="6"/>
  </g>
  <text x="170" y="374" text-anchor="middle" fill="#111111" font-size="11" font-weight="bold">Från Mårtenssons Trafikskola</text>
  <text x="170" y="392" text-anchor="middle" fill="#444444" font-size="9">Skanna — appen är gratis. Ingen reklam.</text>
  <text x="170" y="406" text-anchor="middle" fill="#444444" font-size="9">Din position lämnar aldrig telefonen.</text>
  <text x="170" y="430" text-anchor="middle" fill="#8a8a8a" font-size="8">halkvakt.se/via/martenssons</text>
  <text x="170" y="470" text-anchor="middle" fill="#6f6f6f" font-size="11">Samma blad för alla skolor —</text>
  <text x="170" y="486" text-anchor="middle" fill="#6f6f6f" font-size="11">bara namnet och QR-koden byts.</text>

  <!-- ===== 2. Sidan eleven landar på ===== -->
  <text x="490" y="92" text-anchor="middle" fill="#dddddd" font-size="14" font-weight="bold">2. Sidan eleven landar på</text>
  <rect x="355" y="104" width="270" height="470" rx="28" fill="#0b0b0b" stroke="#3a3a3a" stroke-width="2"/>
  <text x="373" y="136" fill="#f5c400" font-size="10" font-weight="bold" letter-spacing="2">▲ HALKVAKT</text>
  <rect x="371" y="154" width="238" height="54" rx="12" fill="#1c1c1e"/>
  <text x="387" y="176" fill="#9a9a9a" font-size="10" letter-spacing="1">VÄLKOMMEN FRÅN</text>
  <text x="387" y="196" fill="#ffffff" font-size="15" font-weight="bold">Mårtenssons Trafikskola</text>
  <text x="373" y="250" fill="#ffffff" font-size="26" font-weight="bold">Varnar innan</text>
  <text x="373" y="280" fill="#ffffff" font-size="26" font-weight="bold">det blir halt.</text>
  <text x="373" y="306" fill="#9a9a9a" font-size="11">Rösten säger till när vägen framför är hal —</text>
  <text x="373" y="321" fill="#9a9a9a" font-size="11">innan du är där. Oftast är den tyst.</text>
  <rect x="373" y="346" width="234" height="40" rx="20" fill="#ffffff"/>
  <text x="490" y="371" text-anchor="middle" fill="#0b0b0b" font-size="13" font-weight="bold"> Hämta i App Store</text>
  <rect x="373" y="394" width="234" height="40" rx="20" fill="#22c55e"/>
  <text x="490" y="419" text-anchor="middle" fill="#0b0b0b" font-size="13" font-weight="bold">▶ Hämta på Google Play</text>
  <text x="490" y="466" text-anchor="middle" fill="#6f6f6f" font-size="10">Gratis · ingen reklam · inget konto</text>
  <text x="490" y="481" text-anchor="middle" fill="#6f6f6f" font-size="10">Din position lämnar aldrig telefonen.</text>
  <text x="490" y="512" text-anchor="middle" fill="#f5c400" font-size="10">Se testbilarna som kör dygnet runt →</text>
  <text x="490" y="556" text-anchor="middle" fill="#6f6f6f" font-size="10">Sidan är statisk (halkvakt-karta, GitHub Pages).</text>

  <!-- ===== 3. Listan och märket ===== -->
  <text x="810" y="92" text-anchor="middle" fill="#dddddd" font-size="14" font-weight="bold">3. Listan — och märket till skolans kanaler</text>
  <rect x="690" y="104" width="240" height="200" rx="12" fill="#1c1c1e" stroke="#3a3a3a" stroke-width="1"/>
  <text x="706" y="130" fill="#ffffff" font-size="13" font-weight="bold">Trafikskolor som är med</text>
  <text x="706" y="148" fill="#9a9a9a" font-size="10">På halkvakt.se, utan siffror.</text>
  <text x="706" y="176" fill="#dddddd" font-size="12">• Mårtenssons Trafikskola, Malmö</text>
  <text x="706" y="198" fill="#dddddd" font-size="12">• Pauli Trafikskola, Malmö</text>
  <text x="706" y="220" fill="#dddddd" font-size="12">• Erikssons Trafikskola, Lund</text>
  <text x="706" y="250" fill="#9a9a9a" font-size="10">Siffrorna får skolan i ett mejl varje månad:</text>
  <text x="706" y="266" fill="#f5c400" font-size="11" font-style="italic">"143 besök på er sida i november."</text>
  <text x="706" y="286" fill="#9a9a9a" font-size="10">Offentlig lista, privata tal.</text>
  <!-- märket -->
  <rect x="700" y="330" width="220" height="86" rx="12" fill="#f5c400"/>
  <text x="716" y="356" fill="#0b0b0b" font-size="10" font-weight="bold" letter-spacing="2">▲ HALKVAKT</text>
  <text x="716" y="380" fill="#0b0b0b" font-size="16" font-weight="bold">Testpartner 2026/27</text>
  <text x="716" y="400" fill="#0b0b0b" font-size="10">Vi ger våra elever appen som varnar för halka.</text>
  <text x="810" y="440" text-anchor="middle" fill="#6f6f6f" font-size="10">Märket läggs på skolans hemsida och Instagram —</text>
  <text x="810" y="455" text-anchor="middle" fill="#6f6f6f" font-size="10">där de som ännu inte valt skola ser det.</text>
  <text x="810" y="470" text-anchor="middle" fill="#6f6f6f" font-size="10">Det är där reklamen för skolan faktiskt verkar.</text>
  <rect x="690" y="494" width="240" height="80" rx="12" fill="#1c1c1e" stroke="#3a3a3a" stroke-width="1"/>
  <text x="706" y="516" fill="#ffffff" font-size="11" font-weight="bold">I appen: bara Om-sidan</text>
  <text x="706" y="534" fill="#9a9a9a" font-size="10">Testpartner: Bulltoftabanan, Mårtenssons,</text>
  <text x="706" y="548" fill="#9a9a9a" font-size="10">Pauli, NTF Jönköping — gemensam rad.</text>
  <text x="706" y="564" fill="#9a9a9a" font-size="10">Ingen per-skola-märkning, ingen banner.</text>

  <!-- ===== Kedjan ===== -->
  <rect x="40" y="600" width="900" height="1" fill="#3a3a3a"/>
  <text x="490" y="624" text-anchor="middle" fill="#dddddd" font-size="13" font-weight="bold">Så räknas det — utan att någon uppgift om besökaren sparas</text>
  <rect x="50" y="640" width="180" height="56" rx="10" fill="#1c1c1e" stroke="#3a3a3a"/>
  <text x="140" y="663" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">QR-koden på bladet</text>
  <text x="140" y="680" text-anchor="middle" fill="#9a9a9a" font-size="9">pekar på skolans länk</text>
  <text x="250" y="672" text-anchor="middle" fill="#f5c400" font-size="18">→</text>
  <rect x="270" y="640" width="200" height="56" rx="10" fill="#1c1c1e" stroke="#f5c400"/>
  <text x="370" y="663" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">Räknaren (en liten funktion)</text>
  <text x="370" y="680" text-anchor="middle" fill="#9a9a9a" font-size="9">+1 på raden "martenssons, november"</text>
  <text x="490" y="672" text-anchor="middle" fill="#f5c400" font-size="18">→</text>
  <rect x="510" y="640" width="190" height="56" rx="10" fill="#1c1c1e" stroke="#3a3a3a"/>
  <text x="605" y="663" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">Skolans sida (2)</text>
  <text x="605" y="680" text-anchor="middle" fill="#9a9a9a" font-size="9">visar namnet och knapparna</text>
  <text x="720" y="672" text-anchor="middle" fill="#f5c400" font-size="18">→</text>
  <rect x="740" y="640" width="190" height="56" rx="10" fill="#1c1c1e" stroke="#3a3a3a"/>
  <text x="835" y="663" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">App Store / Google Play</text>
  <text x="835" y="680" text-anchor="middle" fill="#9a9a9a" font-size="9">appen vet inte varifrån — behöver inte</text>
  <text x="490" y="722" text-anchor="middle" fill="#9a9a9a" font-size="11">Räknaren sparar bara skola + månad + antal. Ingen adress, ingen enhet, ingen kaka. Ett besök är ett besök, inte en person.</text>
  <text x="490" y="740" text-anchor="middle" fill="#6f6f6f" font-size="10">Kostnad: en sida per skola ur en lista med namn, en funktion på ~20 rader, ett mejl i månaden. Byggs när bladet byggs — när appen finns i butikerna.</text>
</svg>
