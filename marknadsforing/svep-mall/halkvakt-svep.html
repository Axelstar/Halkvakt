,60.67385,13.03955Z"/><path d="M65.27688,8.86328a.57572.57572,0,1,1,.5752.5415A.54735.54735,0,0,1,65.27688,8.86328Zm.13184,1.33154h.88574v4.50293h-.88574Z"/></g></svg>';
const EXAMPLES = {
  omslag: { bild: 'omslag', nr: 1, av: 5, rubrik: 'Halt i morse', under: 'Halka på 62 vägavsnitt i 3 län.', tid: '06:50', date: '2026-11-02',
            lan: [{ nr: 2, kort: 'Norrbotten', halt: 46, vagavsnitt: 58, kalla: 21 }, { nr: 3, kort: 'Jämtland', halt: 14, vagavsnitt: 30, kalla: 9 },
                  { nr: 4, kort: 'Dalarna', halt: 0, vagavsnitt: 31, kalla: 5 }], fler: 0 },
  lan: { bild: 'lan', nr: 3, av: 5, date: '2026-11-02', county: 'Jämtland', hazard: 'Risk för halka', subtitle: '14 vägavsnitt i Jämtland',
         roads: [{ road: 'E14', stretch: 'Gevsjön–Järpen' }, { road: 'E45', stretch: 'Åsarna–Ytterhogdal' }], coldest: { station: 'Lossendammen', surfaceTemp: -1.5 }, dataTime: '06:50' },
  appen: { bild: 'appen', nr: 5, av: 5 },
};
const DAY = ['SÖN','MÅN','TIS','ONS','TOR','FRE','LÖR'], MON = ['JAN','FEB','MAR','APR','MAJ','JUN','JUL','AUG','SEP','OKT','NOV','DEC'];
const clean = s => String(s ?? '').replace(/!/g, '').replace(/—/g, '–').replace(/\s+/g, ' ').trim();
const esc = s => clean(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const fmtDate = d => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || ''); if (!m) return esc(d).toUpperCase(); const x = new Date(+m[1], +m[2] - 1, +m[3]); return DAY[x.getDay()] + ' ' + x.getDate() + ' ' + MON[x.getMonth()]; };
const fmtTemp = t => (t < 0 ? '−' : t > 0 ? '+' : '') + Math.abs(t).toFixed(1).replace('.', ',') + ' °C';
const marke = (fill, w = 40.5, h = 35.8) => `<svg width="${w}" height="${h}" viewBox="3 3 94 83" aria-hidden="true"><path fill-rule="evenodd" fill="${fill}" d="${MARKE}"/></svg>`;
const raknare = d => d.nr && d.av ? ` · ${d.nr} / ${d.av}` : '';

function omslag(d) {
  const lan = d.lan || [];
  const rader = lan.map(l => `<div class="r"><span class="nr mono">${l.nr}</span><span class="namn">${esc(l.kort)}</span>` +
    (l.halt ? `<span class="v mono">${l.halt} <small>av ${l.vagavsnitt}</small></span>` : `<span class="v mono">${l.kalla} <small>under 0°</small></span>`) + '</div>').join('');
  return `<div id="bild" class="mork">
    <div class="kant" aria-hidden="true"></div>
    <div class="meta mono"><span class="l"><span class="prick"></span>Halkläget kl. ${esc(d.tid)}</span><span>${fmtDate(d.date)}</span></div>
    <h1 class="stor">${esc(d.rubrik)}</h1>
    <p class="under">${esc(d.under)}</p>
    <div class="index"><div class="hd mono"><span>Bild · Län</span><span>Vägavsnitt med halka</span></div>${rader}</div>
    ${d.fler ? `<p class="fler mono">+ ${d.fler} län till på halkvakt.se/lan</p>` : ''}
    <div class="svep"><span>Svep till ditt län</span><i aria-hidden="true"><svg width="56" height="56" viewBox="0 0 48 48" fill="none" stroke="#080B0D" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 24 H38 M27 13 L38 24 L27 35"/></svg></i></div>
    <div class="fot mono"><span class="logo">${marke('#FFC94A')}HALKVAKT</span><span>KÄLLA TRAFIKVERKET${raknare(d)}</span></div>
  </div>`;
}

function lanskort(d) {
  const hazard = clean(d.hazard) || 'Halka';
  const roads = (d.roads || []).filter(r => r && (r.road || r.stretch)).slice(0, 3);
  const c = d.coldest && d.coldest.station && typeof d.coldest.surfaceTemp === 'number' ? d.coldest : null;
  return `<div id="bild" class="gul" style="--ts:${hazard.length <= 6 ? 240 : hazard.length <= 11 ? 164 : 140}px">
    <div class="head mono"><span class="l"><svg width="30" height="26.5" viewBox="3 3 94 83" aria-hidden="true"><path fill="#080B0D" d="${TRIANGEL}"/></svg><span>Läget i ${esc(d.county)}</span></span><span>${[fmtDate(d.date), esc(d.dataTime)].filter(Boolean).join(' · ')}</span></div>
    <div class="icon">${ICONS[HAZARD_ICON[hazard.toLowerCase()] || 'halka']}</div>
    <div class="title">${esc(hazard)}</div>
    ${d.subtitle ? `<div class="sub">${esc(d.subtitle)}</div>` : ''}
    ${roads.length ? `<div class="rows">${roads.map(r => `<div class="row"><span class="k mono">${esc(r.road)}</span><span class="v">${esc(r.stretch)}</span></div>`).join('')}</div>` : ''}
    ${c ? `<div class="temp"><div class="k"><span class="lbl mono">Kallast vägbana</span><span class="st">${esc(c.station)}</span></div><span class="t mono">${fmtTemp(c.surfaceTemp)}</span></div>` : ''}
    <div class="gulfot mono"><span class="logo">${marke('#080B0D')}HALKVAKT</span><span>TRAFIKVERKETS DATA${raknare(d)}</span></div>
  </div>`;
}

function appen(d) {
  const staplar = [24, 46, 64, 34, 54, 26].map(h => `<b style="height:${h}px"></b>`).join('');
  return `<div id="bild" class="mork appen">
    <div class="meta mono"><span class="l"><span class="prick"></span>Appen</span><span>Gratis för iPhone</span></div>
    <h1>Halkvakt varnar med rösten innan du är där.</h1>
    <p class="under">Halka, olyckor, frysrisk, vilt och fartkameror från Trafikverket, i bilens högtalare.</p>
    <div class="ruta rost"><span class="vag" aria-hidden="true">${staplar}</span><q>Varning: halka rapporterad på vägen framför dig.</q></div>
    <div class="ruta"><span class="lb mono">Löftet</span><span class="lv">Din position lämnar inte telefonen av sig själv.</span></div>
    <div class="ladda">${BADGE}<span class="mono">Länken finns<br>i profilen</span></div>
    <div class="fot mono"><span class="logo">${marke('#FFC94A')}HALKVAKT</span><span>HALKVAKT.SE${raknare(d)}</span></div>
  </div>`;
}

function getData() {
  if (window.HALKVAKT_SVEP) return window.HALKVAKT_SVEP;
  return EXAMPLES[new URLSearchParams(location.search).get('example') || 'omslag'] || EXAMPLES.omslag;
}

// Shrink rows and type until everything fits above the foot.
function fit() {
  const el = document.getElementById('bild');
  let k = 1; el.style.setProperty('--k', k);
  while (el.scrollHeight > el.clientHeight + 1 && k > 0.6) { k -= 0.04; el.style.setProperty('--k', k.toFixed(2)); }
}

const d = getData();
document.getElementById('bild').outerHTML = (d.bild === 'lan' ? lanskort : d.bild === 'appen' ? appen : omslag)(d);
document.fonts.ready.then(() => { fit(); requestAnimationFrame(() => { document.documentElement.dataset.ready = '1'; }); });
</script>
</body>
</html>
