        <path d="M57.77932,13.42432c0-.81055.60352-1.27783,1.6748-1.34424l1.21973-.07031v-.38867c0-.47559-.31445-.74414-.92187-.74414-.49609,0-.83984.18213-.93848.50049h-.86035c.09082-.77344.81836-1.26953,1.83984-1.26953,1.12891,0,1.76563.562,1.76563,1.51318v3.07666h-.85547v-.63281h-.07031a1.515,1.515,0,0,1-1.35254.707A1.36026,1.36026,0,0,1,57.77932,13.42432Zm2.89453-.38477v-.37646l-1.09961.07031c-.62012.0415-.90137.25244-.90137.64941,0,.40527.35156.64111.835.64111A1.0615,1.0615,0,0,0,60.67385,13.03955Z" style="fill: #fff"/>

<script>
const ICONS = {
  halka: '<svg viewBox="0 0 48 48"><path d="M13 18 L16 9 H32 L35 18"/><rect x="8" y="17" width="32" height="10" rx="3"/><path d="M13 22 H16 M32 22 H35 M13 27 V31 M35 27 V31"/><path d="M5 38 q4.5 -4 9.5 0 t9.5 0 t9.5 0 t9.5 0"/><path d="M5 45 q4.5 -4 9.5 0 t9.5 0 t9.5 0 t9.5 0"/></svg>',
  frys: '<svg viewBox="0 0 48 48"><g><path d="M24 5 V43 M19 8 L24 13 L29 8 M19 40 L24 35 L29 40"/></g><g transform="rotate(60 24 24)"><path d="M24 5 V43 M19 8 L24 13 L29 8 M19 40 L24 35 L29 40"/></g><g transform="rotate(-60 24 24)"><path d="M24 5 V43 M19 8 L24 13 L29 8 M19 40 L24 35 L29 40"/></g></svg>',
  vilt: '<svg viewBox="0 0 48 48"><path d="M8 19 L28 18 L31 14 L35 15 L40 15 L45 19 L45 22 L40 22 L38 26 L36 27 L36 41 L33 41 L33 31 L16 31 L16 41 L13 41 L13 31 L9 30 L7 25 Z" style="fill:#080B0D;stroke-width:2"/><path d="M37 15 L34.5 7 M35.5 11 L31.5 9 M38.5 15 L43 7.5 M40.5 11.5 L45 10.5" style="stroke-width:3"/></svg>',
  olycka: '<svg viewBox="0 0 48 48"><rect x="5" y="13" width="38" height="13" rx="2.5"/><path d="M15 13 L10 26 M25 13 L20 26 M35 13 L30 26 M43 16 L39 26"/><path d="M12 26 V41 M36 26 V41 M7 41 H17 M31 41 H41"/></svg>',
  kamera: '<svg viewBox="0 0 48 48"><rect x="5" y="9" width="27" height="17" rx="3"/><circle cx="18.5" cy="17.5" r="4.5"/><path d="M37 12 L43 9 M37 17.5 H44 M37 23 L43 26"/><path d="M18.5 26 V42 M11 42 H26"/></svg>',
};
const HAZARD_ICON = { 'halka': 'halka', 'risk för halka': 'halka', 'fläckvis is': 'frys', 'frysrisk': 'frys' };
const EXAMPLES = {
  'vasternorrland': { date: '2026-10-27', county: 'Västernorrland', hazard: 'Risk för halka', subtitle: '6 vägavsnitt i Västernorrland', roads: [{ road: 'VÄG 90', stretch: 'Hälla–Junsele–Bollstabruk' }, { road: 'VÄG 87', stretch: 'Bispgården–Sollefteå' }, { road: 'VÄG 335', stretch: 'Grillom–Sollefteå' }], coldest: null, dataTime: '05:40' },
  'norrbotten': { date: '2026-10-28', county: 'Norrbotten', hazard: 'Fläckvis is', subtitle: '1 vägavsnitt i Norrbotten', roads: [{ road: 'E10', stretch: 'Abisko–Riksgränsen' }], coldest: { station: 'Vassijaure', surfaceTemp: -0.9 }, dataTime: '05:40' },
  'vastra-gotaland': { date: '2026-11-10', county: 'Västra Götaland', hazard: 'Halka', subtitle: '11 vägavsnitt i Västra Götaland', roads: [{ road: 'VÄG 157', stretch: 'Ulricehamn–Gällstad–Hökerum–Tranemo–Limmared–Länsgränsen mot Halland' }, { road: 'E20', stretch: 'Alingsås–Vårgårda' }, { road: 'VÄG 1653', stretch: 'Herrljunga–Ljung' }], coldest: { station: 'Hökerum', surfaceTemp: -1.4 }, dataTime: '05:40' },
  'evergreen': { variant: 'evergreen' },
  'evergreen-rosten': { variant: 'evergreen-rosten' },
};
const LINES = [['halka', 'Varning: halka rapporterad på vägen framför dig.'], ['vilt', 'Viltrisk framöver.'], ['olycka', 'Olycka rapporterad på E18 3 kilometer framför dig.'], ['kamera', 'Fartkamera om 500 meter. Gränsen är 80.']];
const DAY = ['SÖN','MÅN','TIS','ONS','TOR','FRE','LÖR'], MON = ['JAN','FEB','MAR','APR','MAJ','JUN','JUL','AUG','SEP','OKT','NOV','DEC'];

const clean = s => String(s ?? '').replace(/!/g, '').replace(/\u2014/g, '–').replace(/\s+/g, ' ').trim();
const fmtDate = d => { if (!d) return ''; const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d); if (!m) return clean(d).toUpperCase(); const x = new Date(+m[1], +m[2] - 1, +m[3]); return DAY[x.getDay()] + ' ' + x.getDate() + ' ' + MON[x.getMonth()]; };
const fmtTemp = t => { if (t === null || t === undefined || t === '') return ''; if (typeof t === 'string') return clean(t).replace(/^-/, '−'); return (t < 0 ? '−' : t > 0 ? '+' : '') + Math.abs(t).toFixed(1).replace('.', ',') + ' °C'; };
const esc = s => clean(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const $ = f => document.querySelector('[data-field="' + f + '"]');
const set = (f, v) => { const el = $(f); el.textContent = v; el.hidden = !v; };

function getData() {
  const q = new URLSearchParams(location.search);
  if (window.HALKVAKT_AD) return window.HALKVAKT_AD;
  if (q.get('data')) try { return JSON.parse(q.get('data')); } catch (e) {}
  return EXAMPLES[q.get('example') || 'vasternorrland'] || EXAMPLES.vasternorrland;
}

function render(d) {
  const variant = d.variant || 'daily';
  const daily = variant === 'daily';
  ['subtitle', 'roads', 'coldest', 'voice', 'lines'].forEach(f => $(f).hidden = true);

  if (daily) {
    const hazard = clean(d.hazard) || 'Halka';
    const time = clean(d.dataTime);
    set('headLeft', ('Läget i ' + clean(d.county)).toUpperCase());
    set('headRight', [fmtDate(d.date), time].filter(Boolean).join(' · '));
    $('icon').innerHTML = ICONS[HAZARD_ICON[hazard.toLowerCase()] || 'halka'];
    set('hazard', hazard);
    document.getElementById('ad').style.setProperty('--ts', (hazard.length <= 6 ? 240 : hazard.length <= 11 ? 164 : 140) + 'px');
    set('subtitle', clean(d.subtitle));
    const roads = (d.roads || []).filter(r => r && (r.road || r.stretch)).slice(0, 3);
    $('roads').innerHTML = roads.map(r => '<div class="row"><span class="k mono">' + esc(r.road) + '</span><span class="v">' + esc(r.stretch) + '</span></div>').join('');
    $('roads').hidden = !roads.length;
    const c = d.coldest;
    if (c && c.station && c.surfaceTemp !== undefined && c.surfaceTemp !== null) {
      set('coldest.station', clean(c.station)); set('coldest.surfaceTemp', fmtTemp(c.surfaceTemp)); $('coldest').hidden = false;
    }
    set('source', time ? 'Trafikverkets data · ' + time : 'Trafikverkets data');
  } else {
    set('headLeft', 'HALKVAKT VARNAR'); set('headRight', '');
    if (variant === 'evergreen-rosten') {
      $('icon').innerHTML = ''; $('icon').hidden = true; $('hazard').classList.add('noicon');
      set('hazard', 'Ögonen på vägen.');
      document.getElementById('ad').style.setProperty('--ts', '148px');
      set('subtitle', 'Halka, vilt, olyckor och fartkameror. Upplästa, innan du är där.');
      $('lines').innerHTML = LINES.map(([k, q]) => '<div class="line">' + ICONS[k] + '<q>' + q + '</q></div>').join(''); $('lines').hidden = false;
    } else {
      $('icon').innerHTML = ICONS.halka;
      set('hazard', 'Halka');
      document.getElementById('ad').style.setProperty('--ts', '300px');
      set('subtitle', 'FRAMFÖR DIG'); $('subtitle').classList.add('mono'); $('subtitle').style.letterSpacing = '.06em'; $('subtitle').style.fontWeight = '600';
      $('voice').hidden = false;
    }
    set('source', 'Källa: Trafikverkets öppna data');
  }
}

function fit() {
  const ad = document.getElementById('ad'), card = ad.querySelector('.card');
  let k = 1; ad.style.setProperty('--k', k);
  while (card.scrollHeight > card.clientHeight + 1 && k > 0.6) { k -= 0.04; ad.style.setProperty('--k', k.toFixed(2)); }
}

render(getData());
document.fonts.ready.then(() => { fit(); requestAnimationFrame(() => { document.documentElement.dataset.ready = '1'; }); });
</script>
