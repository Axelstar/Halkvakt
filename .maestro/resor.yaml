# Startsidan och fliken Resor (DECISIONS #981, #982, #984). Startar med fotostudions argument, som hoppar över
# introduktionen och frågan om varningen före resan. Sökningen provas inte här: den går mot Apple och levande data.
appId: se.halkvakt.app
---
- launchApp:
    clearState: true
    arguments:
      fotostudio_facit: "1"
- takeScreenshot: bilder/start-1-overst
- scrollUntilVisible:
    element: "Planera resa"
    direction: DOWN
- takeScreenshot: bilder/start-2-knapparna
- tapOn: "Planera resa"
- assertVisible: "Vart ska du?"
- assertVisible: "Sök adress eller ort"
- takeScreenshot: bilder/resor-1-fran-startsidan
- assertVisible: "Fråga om jag vill spara resan"
