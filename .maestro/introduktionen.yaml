# Introduktionen för en ny användare (DECISIONS #979, #984): välkomstens bilder och steget om platsen.
# Bilderna byts av sig själva, så flödet väntar på knappen och inte på en viss bild. Det stannar före iOS ruta om
# platsen: den hör till telefonen, inte till appen.
appId: se.halkvakt.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Kom igång"
    timeout: 20000
- takeScreenshot: bilder/intro-1-valkommen
- extendedWaitUntil:
    visible: "Vi varnar för"
    timeout: 20000
- takeScreenshot: bilder/intro-2-ikonerna
- tapOn: "Kom igång"
# Maestro ger appen platsen när den startar, så steget kan visa att platsen redan är klar.
- assertVisible: "Nu slår vi på vakten|Platsen är klar"
- takeScreenshot: bilder/intro-3-platsen
